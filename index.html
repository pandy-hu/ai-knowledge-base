<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>元宝的知识库 · 工具站</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--line:#e5e7eb;--txt:#1f2328;--mut:#6b7280;--acc:#2563eb;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.6;padding:18px 16px 40px;}
h1{font-size:22px;margin:6px 0 2px;}
.sub{color:var(--mut);font-size:13px;margin-bottom:18px;}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;}
.card:active{background:#f0f4ff;}
.ct{font-size:18px;font-weight:600;margin-bottom:4px;}
.cd{font-size:13px;color:var(--mut);}
.arrow{float:right;color:var(--acc);font-size:20px;font-weight:700;}
.note{font-size:12px;color:var(--mut);margin-top:18px;text-align:center;}
</style>
</head>
<body>
<h1>元宝的知识库 · 工具站</h1>
<div class="sub">零成本 · 一人可执行 · 不踩坑</div>

<a class="card" href="kb.html">
  <span class="arrow">›</span>
  <div class="ct">📚 我的知识库（手机浏览器）</div>
  <div class="cd">带搜索 / 标签 / 分类过滤，喂内容自动出卡</div>
</a>

  <span class="arrow">›</span>
  <div class="ct">🚦 副业红线检查器</div>

</a>

<div class="note">本站由元宝自动同步 · 源数据见仓库 knowledge-base/</div>
</body>
</html>
