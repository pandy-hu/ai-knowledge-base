<script>
var ENTRIES=[{"title": "成人舞蹈是\"心理代偿市场\"：体验型生意的操盘逻辑", "source": "抖音 @老贾讲营销心理学（视频 5 分 17 秒）· https://v.douyin.com/YibPErd8q3s/", "date": "2026-07-28", "category": "创业与变现", "tags": ["营销心理学", "体验经济", "心理代偿", "第三空间", "副业观察"], "relevance": "高", "monetize": "高（框架值钱、可迁移；⚠️但直接开实体店不符你\"零成本\"标准，卖框架/接单才是你的路）", "core": "成人舞蹈卖的不是技术，是\"肉体自恋+社交疗愈\"——把教室改成\"情绪美容院\"，用视觉、社群、降门槛让人上瘾复购。", "body_html": "<h2>原文要点（我提炼，不是全文）</h2>\n<ul>\n<li>核心判断：成人舞蹈培训的本质<strong>不是艺术，而是一场关于肉体自恋与社交疗愈的现代救赎</strong>，是一个正在兴起的巨大\"心理代偿市场\"。人愿为<strong>情绪价值、社交链接、自我重塑</strong>买单。</li>\n<li>作者给了一套\"生存法则\"，分三块 + 三个操盘逻辑 + 破局三步：</li>\n<li><strong>价值错配</strong>：你卖的舞蹈技术，在成年人世界里\"一灯不亮\"。交易本质是<strong>虚荣心+陪伴感+自我取悦</strong>的综合交易（类比买化妆品买的是\"被爱/年轻的希望\"，不是那瓶液体）。白领取爵士舞买的是\"镜子里的自己怎么这么好看\"的心理暗示。→ 舞蹈室物理是教室，<strong>体验上必须是\"情绪美容院\"</strong>；老师不是冷酷评委，是高情商情绪价值提供者，课上多说\"太棒了、这个眼神绝了\"，少说\"你又错了\"。</li>\n<li><strong>体验设计（技术交付→戏剧体验）</strong>：脑科学——人易受视觉/环境暗示（环境锚定情绪）。传统白日光灯+斑驳墙=简陋。要把每节课设计成<strong>微型舞台剧</strong>：暖色舞台感射灯；课后最后 10 分钟做成 <strong>show time</strong>，老师用手持稳定器+滤镜像拍 MV 一样记录每个人。动作标不标准无所谓，逆光+滤镜下他就是\"女主角\"。学员发朋友圈收获赞和\"你太美了\"，这张卡在他心理账簿上<strong>价值翻 10 倍</strong>，必复购。</li>\n<li><strong>落地打法（三个操盘逻辑）</strong>：<ul>\n<li>逻辑一：重新定义交易本质（虚荣心/陪伴/自我取悦，见上）。</li>\n<li>逻辑二：视觉升级（灯光+show time+MV 精修，见上）。</li>\n<li>逻辑三：<strong>重组社交矩阵对抗惰性</strong>。靠个人自律对抗懒惰必败，唯一解法是<strong>群体效应+社交绑定</strong>。建\"兴趣部落\"微信社群，每周评\"打卡之星\"、办\"复古红唇之夜/纯白芭蕾派对\"主题沙龙，让学员结交闺蜜。舞蹈室成了<strong>家和办公室之外的\"第三空间\"</strong>——沉淀的社交关系与情感资产，对手便宜 10 块的体验课根本挖不走。</li>\n</ul>\n</li>\n<li><strong>破局三步法</strong>：① 改造物理空间——弃惨白 LED，改多色温射灯+侧光逆光，让微胖女孩显瘦，镜子倾斜 1–2 度拉长腿比例；② 重训老师——KPI 从\"上了几节课\"改成\"<strong>课后视频分享率+体验课转化率</strong>\"，课后 30 分钟内私发精修视频+针对闪光点的真诚赞美；③ 降低门槛——大课拆成\"零基础保姆班/三节课学会一支成品舞\"，先让成人尝到\"跳成一首歌\"的快乐，才愿为高价私教课消费。</li>\n</ul>\n<hr />\n<h2>① 怎么用</h2>\n<p><strong>现在马上能做：</strong>\n1. 任何\"体验型\"副业（舞蹈/健身/书法/咖啡馆/手工/宠物社交），把定位从\"教技术\"改成\"卖自我迷恋+社交\"——这是这条最值钱的一转。\n2. 落地三招可直接抄：灯光改暖色射灯+逆光显瘦；<strong>课后 30 分钟内私发精修视频+真诚赞美</strong>；社群做\"打卡之星/主题沙龙\"建第三空间。\n3. 把交付者（老师/你）的 KPI 从\"交付次数\"改成\"分享率+转化率\"——这一改，生意逻辑就变了。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- 固化成<strong>「体验型生意拆解框架」</strong>：价值错配 → 体验设计 → 社交绑定 → 降门槛。可复用于一切线下体验业态。\n- 做成 mini-app<strong>「体验生意体检表」</strong>：输入你的生意，自动诊断卡在四步哪一步。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>上一条「挠痒痒营销法」（卡 7）</strong>：一条在<strong>文案层</strong>（怎么写让人惦记的 6 式痒点），这条在<strong>生意层</strong>（怎么把店开成让人上瘾）。两者互补，合起来是\"引流+留客\"双杀。</li>\n<li><strong>副业红线检查器</strong>：舞蹈培训是<strong>实体/重服务</strong>，需场地+老师，和你\"零成本启动\"标准冲突——这张卡定位为「观察学习」，不是让你下场开店。</li>\n<li><strong>mini-apps</strong>：可做「体验生意体检表」小工具（已有 10 个小应用基础）。</li>\n<li><strong>抖音文案提取链路 / 每日简报 / 知识星球</strong>：可作为\"心理代偿市场\"赛道洞察内容。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li><strong>路径 A（卖洞察/咨询）</strong>：把\"体验型生意拆解框架\"做成付费帖/小册子，或给实体店做诊断咨询（按次收费）。</li>\n<li><strong>路径 B（接单代运营）</strong>：你不必自己开店——用这套框架接\"实体店抖音引流脚本/社群运营话术/体验设计顾问\"的单子，卖脑力不卖场地。</li>\n<li><strong>路径 C（产品化）</strong>：「体验生意体检表」mini-app 引流到星球/简报。</li>\n<li><strong>结论</strong>：潜力<strong>高</strong>，但分两层——① 框架本身值钱、可迁移（高）；② 对你个人的直接变现偏间接（卖框架/接单/内容），且<strong>直接开店不符零成本原则</strong>。所以对你而言最稳的路是\"卖框架+接单\"，不是下场。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>做<strong>「体验生意体检表」mini-app</strong>（输入业态→诊断价值错配/体验/社交/门槛四步），挂导航页引流。</li>\n<li><strong>跨行业映射</strong>：把\"心理代偿/第三空间/课后精修视频\"迁移到健身、书法、插花、剧本杀、宠物社交——同一套\"卖情绪不卖技术\"。</li>\n<li>和卡 7 合一张<strong>「营销双杀：文案痒点 + 体验上瘾」</strong>总卡，作为创业与变现板块的入门钩子。</li>\n<li>反脆弱：把\"实体重服务 ≠ 零成本副业\"补进<strong>副业红线检查器</strong>，作为\"重资产陷阱\"提醒，防止冲动投入。</li>\n</ul>"}, {"title": "马师傅\"挠痒痒\"营销法：用「痒点」让人惦记你的产品", "source": "抖音 @配叫一声马师傅（视频 10 分 38 秒）· https://v.douyin.com/jkZJQ3ZMgPw/", "date": "2026-07-27", "category": "创业与变现", "tags": ["营销", "文案", "创意", "痒点", "销售话术"], "relevance": "高", "monetize": "高", "core": "别只盯痛点（伤口）和爽点（止痛片），真正值钱的是「痒点」——伤口四周的皮肤，不逼单、不降价，就让你一直惦记。", "body_html": "<h2>原文要点（我提炼，不是全文）</h2>\n<ul>\n<li>营销三要素重新定义：<strong>痛点=伤口，爽点=止痛片，痒点=伤口四周的皮肤</strong>。痒点不催促、不打折，只让人\"分心、惦记、崩溃\"，是最贵的购买欲。</li>\n<li>作者给出 6 个制造\"痒点\"的\"式\"（套路），可直接套去改标题、卖点、详情页、销售话术：</li>\n<li><strong>差一点儿</strong>：人最惦记\"快要拥有\"。不说\"教你从0到1\"，改说\"你有一条视频有过300播放，只是没接住\"；英语课不说\"每天15分钟提升\"，改说\"你有底子，只是没机会开口\"。变体\"差一点儿+后果\"：7000人加购、3000库存，错过会难受。</li>\n<li><strong>欲拥有感（彩排拥有）</strong>：先别介绍产品，先在用户心里排练\"如果是我会怎样\"。100万手表\"他们会等你\"；咖啡机\"一个台面就是一家咖啡馆\"；扫地机器人\"回家推开门地是干净的，今天至少一件事顺心\"。秘诀：产品只是道具，用户才是主演。</li>\n<li><strong>身份痒</strong>：你买的不是东西，是\"我像谁\"。西服=不易被忽略的人（5000块平摊每天2.7块买自信）；硬派越野=随时能走的选择权；小众香水=经过时\"不像空气\"。本质：人买的是\"高级版本的自己\"。</li>\n<li><strong>神秘痒</strong>：越遮掩越想要。评论\"因内容敏感已折叠，点击查看\"；香水\"不建议在初次见面时试这个\"比任何描述都勾人；香奈儿5号\"睡觉时只穿香奈儿5号\"。</li>\n<li>（口播逐字稿此处 ASR 有断点，作者列到第六式，第五式疑似在\"神秘\"与\"亏欠\"之间被吞，待复核原片补全）</li>\n<li><strong>亏欠痒</strong>：不是\"我想要\"，而是\"觉得该补偿\"。儿童学习桌\"孩子每天写两三个小时，你给他买最亮的台灯最贵的笔，他却弯着腰独自承受\"→\"先做直再做题\"；宠物粮\"他一生见过的世界可能就是你家楼下和你\"。⚠️慎用：用好了是温柔提醒，用过是道德绑架。</li>\n</ul>\n<hr />\n<h2>① 怎么用</h2>\n<p><strong>现在马上能做：</strong>\n1. 写任何卖点/详情页/带货脚本前，先套这 6 式各写一版，挑最痒的那句当标题。\n2. 短视频开头用\"差一点儿\"钩子替代\"从0到1\"套路（用户对后者已免疫）。\n3. 详情页第一段只写\"欲拥有感\"场景，参数往后放——先让用户在心里彩排拥有。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- 把\"6式\"固化成<strong>文案改写提示词</strong>（输入产品→输出6式卖点），复用给所有项目。\n- 做成<strong>「痒点文案生成器」mini-app</strong>：输入产品名/卖点，一键生成6式标题+详情页。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>抖音文案提取指引 / video-downloader</strong>：正是这条卡的来源链路——丢抖音链接→提发布文案+口播逐字稿→蒸馏成卡。闭环验证无误。</li>\n<li><strong>mini-apps</strong>：可产品化为「痒点文案生成器」小工具（你已有 10 个网页小应用基础）。</li>\n<li><strong>每日 AI 热点简报</strong>：营销/文案类抖音号可成为简报素材源，丰富\"创业与变现\"主题。</li>\n<li><strong>GitHub</strong>：文案生成器可开源（你已配 SSH 免密），也是引流入口。</li>\n<li><strong>知识星球</strong>：6式拆解可作付费内容（星球 158584248182 当前免费引流）。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li><strong>路径 A（卖模板/知识）</strong>：把\"6式+案例库\"做成小册子/付费帖，发知识星球或小红书引流。</li>\n<li><strong>路径 B（接单交付）</strong>：帮抖音小商家/带货号改写详情页、写带货脚本，按条收费（文案改写是刚需、门槛低）。</li>\n<li><strong>路径 C（产品化）</strong>：「痒点文案生成器」mini-app 接广告或引流到星球/简报。</li>\n<li><strong>结论</strong>：潜力<strong>高</strong>。营销是永恒需求，文案改写零成本、可复用、可产品化，完美契合你\"零成本启动、可验证、低风险\"的副业标准。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>做「痒点文案生成器」mini-app（输入产品→6式卖点），直接挂你游戏合集/导航页引流。</li>\n<li>结合 LLM 自动化：写个工作流，给一条产品自动跑\"6式改写\"，批量产出带货脚本。</li>\n<li>补一张对比卡：<strong>痒点 vs 痛点 vs 爽点</strong> 一张图讲清，作为营销入门钩子。</li>\n<li>反脆弱提醒：把\"亏欠痒慎用\"补进你的「副业红线检查器」，避免踩道德绑架的坑。</li>\n</ul>"}, {"title": "零基础搭 AI 知识库，四步闭环越用越聪明", "source": "抖音 @姜胡说（视频链接 https://v.douyin.com/MDxC1r46FH8/ ，用户提供字幕）", "date": "2026-07-25", "category": "AI与方法", "tags": ["知识管理", "AI学习", "零基础", "个人成长", "姜胡说"], "relevance": "高", "monetize": "高", "core": "别用「准备」逃避开始——先上场，把看到的好内容直接喂给 AI，让它替你分「现在用 / 未来用」，每天复盘，越用越聪明。", "body_html": "<h2>原文要点（我提炼）</h2>\n<ol>\n<li><strong>第一步 工具准备</strong>：用 WorkBuddy + CodeBuddy（视频里叫 Workbody / Coder Work），免费、每天送积分，拿来即用，不配环境、不纠结 Cloud Code / Codex。</li>\n<li><strong>第二步 建档案</strong>：告诉 AI「你是谁、干嘛的、优点、缺点、目标、卡点」，把它当几十万的咨询顾问，让它记住你，以后给你建议、方法、朝目标推。</li>\n<li><strong>第三步 喂内容</strong>：看到好文章直接复制给 AI；好视频/音频给链接。问它「根据我的情况，这知识怎么用」——它列「现在马上能用的一二三」和「未来能用的知识块」。</li>\n<li><strong>第四步 每天复盘</strong>：用了之后说「我现在这么用，结果是这样，你复盘下，告诉我怎么改进」。每天做，几天就和别人不一样。</li>\n<li><strong>核心心智</strong>：很多人学傻了，非要「学会再用」；正确是「先上场，一边学一边用，甚至不必懂，先帅起来」。</li>\n</ol>\n<hr />\n<h2>① 怎么用</h2>\n<p><strong>现在马上能做：</strong>\n1. <strong>补一份「目标 + 卡点」档案</strong>：我已知你是上野（上海 / 关注 AI·创业·信息差），但视频法强调主动让 AI 当顾问。你下条消息补一句「我的目标 XX、卡点 XX」，我记进长期记忆。\n2. <strong>把「喂内容→问怎么用」固化</strong>：本知识库就是这个动作的产品化——你贴内容，我出四问卡。\n3. <strong>每天复盘接进现有简报</strong>：你已有「每日 AI 热点简报自动化」，我在简报末尾加一段「今日可落地的 1 个动作 + 复盘提问」，闭环就成了。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- 「先上场再学」心态，可作为你所有内容产品的统一方法论标签。\n- 「知识块」概念 → 以后每条卡都能被检索、被二次组合成文章/课。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>每日 AI 热点简报</strong>：现成的「喂内容」管道，每天已有 AI 资讯流入；只差补「复盘 + 怎么用」两环，正好和本知识库合并成一条流水线。</li>\n<li><strong>mini-apps / mini-games</strong>：可直接做一个「个人知识库」网页应用（卡片 + 标签 + 搜索 + 移动端），这是顺手的开发项目，也能当 demo 接单。</li>\n<li><strong>GitHub SSH 免密</strong>：知识库可版本化备份到新仓库（或并入 web-games 仓库），防丢、可公开当作品集。</li>\n<li><strong>元宝变现意图</strong>：这条本身就是「用元宝当低成本虚拟员工」的最佳示范案例。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li><strong>路径 A（卖方法论）</strong>：把「四步闭环」包装成小报童专栏 / 知识星球 / 短视频系列，你已是案例，自带信任。</li>\n<li><strong>路径 B（卖工具/模板）</strong>：做「个人 AI 知识库」网页模板或 Notion/腾讯文档模板，按订阅或一次性卖。</li>\n<li><strong>路径 C（接单）</strong>：帮小白搭「自己的 AI 知识库 + 顾问档案」，你用自己跑通的流程交付，客单价低但可批量。</li>\n<li><strong>路径 D（信息差产品）</strong>：每日简报 + 知识库筛选 → 付费「AI 机会日报」，你已有自动化底座。</li>\n<li><strong>结论</strong>：<strong>变现潜力高</strong>。方法轻、可复制、和你已有资产（简报/游戏/SSH）100% 咬合，启动成本≈0。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>把知识库做成<strong>手机 HTML 浏览器</strong>（搜索+标签），你手机上看更爽，也能当产品卖。</li>\n<li>做一个<strong>「喂我一条，出一张卡」的小工具</strong>，朋友圈/社群引流用。</li>\n<li>四步法 → 拍成你自己的短视频，反哺「姜胡说」这类流量池，做个人 IP。</li>\n</ul>"}, {"title": "撸店铺保证金能发财？小心坐牢（黑灰产揭秘·反例卡）", "source": "抖音 @未知（链接 https://v.douyin.com/oBSG7vARkjw/ ，标题+标签由用户提供，暂无逐字稿）", "date": "2026-07-25", "category": "个人成长", "tags": ["踩坑警示", "黑灰产揭秘", "合规红线", "变现避坑", "认知", "捞偏门"], "relevance": "中", "monetize": "低（作为「方法」本身违法不可行；作为「揭秘内容」可中）", "core": "所有「撸平台/撸保证金/撸漏洞」的偏门，本质多是诈骗或非法经营，轻则封号冻款，重则坐牢——它是「绝不能碰的红线」，不是「能发财的路子」。", "body_html": "<h2>原文要点（据标题+标签推断，待补逐字稿）</h2>\n<ul>\n<li>主题：拆解「撸电商店铺保证金」类偏门玩法的真实风险，标题直接点出「小心坐牢」。</li>\n<li>标签含 #捞偏门 #赚钱 #黑灰产揭秘 —— 属于「揭秘/劝退」向内容，不是教学。</li>\n<li>「撸店铺保证金」通常指利用平台保证金（如淘宝/拼多多/抖音小店缴纳的押金）的退款或规则漏洞套现，往往涉及虚假交易、伪造材料、恶意投诉等行为。</li>\n</ul>\n<blockquote>\n<p>⚠️ 说明：本条仅依据用户给的标题与标签生成，我未拿到视频逐字稿。如你贴出文案/字幕，我可补全「具体手法 + 对应法条 + 判罚案例」，让这张卡更扎实。</p>\n</blockquote>\n<hr />\n<h2>① 怎么用</h2>\n<p><strong>现在马上能做：</strong>\n1. <strong>当成红线清单</strong>：把「撸平台/撸保证金/撸漏洞/刷单/跑分/接码」这类词加入你的「副业黑名单」。以后任何副业 idea 一旦沾这些词，直接 pass，不浪费时间评估。\n2. <strong>建一个「合规自检」小问题</strong>，贴在你每天的副业思考里：「这事儿合法吗？平台允许吗？要我伪造/欺骗吗？」三问任一为否，就不做。\n3. <strong>当内容素材</strong>：「黑灰产揭秘」本身是个能吸流量的内容赛道（你标题里的标签就是证明），可反向做成你未来账号的「避坑科普」系列。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- 「偏门→违法」映射表：撸保证金/刷单/跑分/接码/搬砖套利 各自对应的法律风险，攒多了就是一篇「副业避坑手册」。\n- 「合规自检三问」模板，复用到所有副业评估。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>每日 AI 热点简报</strong>：可加一个「副业风险」栏目，顺手把当天看到的黑灰产/割韭菜套路标记出来，既是内容也是自我保护。</li>\n<li><strong>一人公司 / 副业探索</strong>：这是你「不想踩坑」约束的最硬核注脚——用真实法律风险给所有副业想法做第一道筛子，省下大量试错成本。</li>\n<li><strong>知识库本身</strong>：应在分类里长期保留「踩坑警示」子标签，让反例和正例并列，知识库才有「避坑」功能，而不只是「找机会」。</li>\n<li><strong>mini-apps / 内容账号</strong>：可做一个「这个副业 idea 踩红线了吗」小工具/互动帖，引流到你未来账号。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li><strong>路径 A（照搬方法）</strong>：❌ 不可行。视频本身就在警告「小心坐牢」，这类玩法多为诈骗/非法经营，封号冻款是轻的，刑责是实的。与你「零风险、不踩坑」底线直接冲突，坚决不做。</li>\n<li><strong>路径 B（揭秘内容变现）</strong>：✅ 可行且低风险。把「黑灰产揭秘/副业避坑」做成短视频或图文，吃的是「认知差+猎奇+避险」流量，可接广告、带货合规工具、沉淀私域。启动成本≈0，契合你一人公司方向。</li>\n<li><strong>结论</strong>：作为「方法」变现潜力=低（违法）；作为「内容素材」变现潜力=中。这张卡对你最大的钱，是<strong>帮你少亏一笔钱、少冒一次险</strong>，以及提供一条合规的内容赛道。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ul>\n<li><strong>「副业红线」检查器</strong>：一个网页小工具，输入副业想法，自动比对黑名单词库+合规三问，输出「高危/注意/可行」——可挂你 GitHub Pages，引流用。</li>\n<li><strong>「黑灰产揭秘」内容系列</strong>：按「手法→风险→真实案例→正确做法」四段式，做成你账号的常青栏目，反哺流量池。</li>\n<li><strong>知识库升级</strong>：在 index.md 统计里加「踩坑警示 N 条」维度，让反例可视、可检索，知识库从「找机会」进化成「机会+避坑」双引擎。</li>\n</ul>"}, {"title": "仓颉 Skill（cangjie-skill）解析：把内容蒸馏成可调用技能", "source": "GitHub `kangarooking/cangjie-skill`（作者「袋鼠帝」，MIT 协议，1.3K Star）+ 成品仓库 `kangarooking/kangarooking-skills`", "date": "", "category": "AI与方法", "tags": [], "relevance": "高", "monetize": "高", "core": "", "body_html": "<h2>一句话核心</h2>\n<p>cangjie-skill 是一个「内容蒸馏器」：把书、长视频、播客转写成一组<strong>可调用 Agent Skills（方法论单元）</strong>，而不是写一篇摘要。本质是「把看过的东西，变成能一句话调出来的工具箱」。</p>\n<h2>原文要点（已抓 GitHub 仓库分析）</h2>\n<ul>\n<li><strong>仓库结构</strong>：<code>SKILL.md</code>（元 skill 执行规范）+ <code>methodology/</code>（RIA-TV++ 各阶段）+ <code>extractors/</code>（5 个并行提取器 prompt）+ <code>templates/</code>（SKILL.md/INDEX.md/BOOK_OVERVIEW.md 模板）。协议 MIT，可商用复用。</li>\n<li><strong>核心流水线 RIA-TV++（七阶段）</strong>：</li>\n<li>整体理解（Adler 分析阅读法）→ <code>BOOK_OVERVIEW.md</code></li>\n<li>并行提取（框架/原则/案例/反例/术语 5 路）</li>\n<li>三重验证筛选（≥2 处佐证 / 有预测力 / 非常识，通过率仅 25-50%）</li>\n<li>RIA++ 构造（R 原文/I 重写/A1 案例/A2 触发场景/E 可执行步骤/B 边界盲点）</li>\n<li>Zettelkasten 链接 → <code>INDEX.md</code></li>\n<li>压力测试（诱饵题 + 跨 skill 混淆）→ <code>test-prompts.json</code></li>\n<li>交付（安装到 Claude Code / Codex 的 skills 目录）</li>\n<li><strong>视频蒸馏</strong>：需先借 <code>video-downloader</code> skill 把视频转成文本（下载+字幕/ASR），再喂给 cangjie-skill。</li>\n<li><strong>关键发现</strong>：<code>kangarooking-skills</code> 里的 <code>video-downloader</code> <strong>支持抖音、B站、YouTube、小红书</strong>，可同时提取「平台原始文案」+「ASR 口播稿」——这正是补上你昨天问的「抖音链接读不到口播稿」痛点的现成方案。</li>\n</ul>\n<h2>① 怎么用（落到你的知识库）</h2>\n<ul>\n<li><strong>升级出卡流程</strong>：把「喂内容→四问卡」升级为「喂内容→蒸馏成 skill」。同一段素材，既存知识（卡），又沉淀方法（skill），知识库从「笔记本」进化成「工具箱」。</li>\n<li><strong>直接解决抖音提取</strong>：把 <code>video-downloader</code> 的思路接进知识库喂料管道（抖音链接→原始文案+口播稿→出卡/蒸馏）。注意它本地需要 <code>yt-dlp</code> + ASR（Whisper 或免费 API），属进阶项，先评估再上。</li>\n<li><strong>变成我的能力</strong>：我（元宝）本就支持 Skill 系统（SKILL.md）。可把 RIA-TV++ 蒸馏法蒸馏成我自己的「内容蒸馏」skill，以后你丢书/视频/播客，我自动走七阶段出 skill——这是本条最实在的落地。</li>\n</ul>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li><strong>知识库（强相关）</strong>：蒸馏 = 知识库的终极形态；你已有的「四问卡」是轻量蒸馏，cangjie-skill 是工业化蒸馏。</li>\n<li><strong>元宝 Skill 系统（强相关）</strong>：格式兼容（均 SKILL.md + 开放标准 agentskills.io），可把成品 skill 直接装进我的技能库复用。</li>\n<li><strong>视频蒸馏成 Skill 卡（上一条，强相关）</strong>：本条是那条的方法论源代码。</li>\n<li><strong>抖音文案提取指引卡（强相关）</strong>：<code>video-downloader</code> 就是该卡「方式 B/C」的现成实现。</li>\n<li><strong>红线检查器 / 每日简报</strong>：蒸馏出的「副业/起号」类 skill 可组合成「一人公司工具箱」卖。</li>\n</ul>\n<h2>③ 能不能挣钱</h2>\n<ul>\n<li><strong>路径 A</strong>：卖蒸馏服务——帮人把书/课/播客蒸馏成 skill 包，按本/小时收费，成本≈0（吃 AI 能力）。</li>\n<li><strong>路径 B</strong>：卖成品 skill 包——作者已蒸馏出《爆款文案》《影响力》《疯传》巴菲特信等，你可二创/汉化/本地化后挂小报童/知识星球。</li>\n<li><strong>路径 C</strong>：教蒸馏方法——短视频/图文「如何把书变成工具箱」，吃认知差。</li>\n<li><strong>路径 D</strong>：知识库 + 蒸馏组合包——你的浏览器 + 红线检查器 + 蒸馏 skill，打包「一人公司工具箱」。</li>\n<li><strong>结论</strong>：变现潜力高，启动成本≈0，且与你已有资产直接复用。MIT 协议允许商用，注意保留署名。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li><strong>做成我的「内容蒸馏」Skill</strong>（本次可落地）：把 RIA-TV++ 蒸馏成我自己的 skill，你丢内容我自动出 skill 包。</li>\n<li><strong>video-downloader 接进喂料管道</strong>：抖音链接一键出原文+口播稿，直接喂知识库。</li>\n<li><strong>「书/视频→技能包」服务产品</strong>：对小白是刚需，可做标准化交付。</li>\n</ul>\n<h2>⚠️ 合规与边界</h2>\n<ul>\n<li><code>video-downloader</code> 涉及平台视频下载，注意版权与平台 ToS；仅用于<strong>你自己有权限</strong>的内容。</li>\n<li>复用成品 skill 包注意 MIT 署名要求；二创/商用保留原作者信息。</li>\n<li>与红线检查器一致：不碰他人私密/侵权内容。</li>\n</ul>"}, {"title": "视频蒸馏成 Skill：把任何视频变成可复用工作流", "source": "抖音（链接 https://v.douyin.com/y2ZC1Y1GV5A/ ，作者「开源仓颉」）", "date": "", "category": "AI与方法", "tags": [], "relevance": "高", "monetize": "高", "core": "", "body_html": "<h2>一句话核心</h2>\n<p>「蒸馏」= 把一段视频/一堆资料的<strong>隐性经验，抽成可复用的标准化步骤（Skill/工作流）</strong>。你不用自己摸索，把爆款案例喂给 AI，让它吐出「照着做就能复现」的 SOP。</p>\n<h2>原文要点（据标题+描述推断，待补逐字稿）</h2>\n<ul>\n<li>主题：开源一个「仓颉.Skill」，能把任意视频蒸馏成 skill。</li>\n<li>示范案例：基于某平台「起号」的大量视频资料，蒸馏出一个「起号 skill」，用于冷启动。</li>\n<li>定位：#开源 #拆书 #蒸馏 #玩儿个很新的东西——属于「方法论开源 + AI 提效」向。</li>\n<li>本质：把「看别人怎么做的」变成「我也能按步骤做」的资产。</li>\n</ul>\n<h2>① 怎么用</h2>\n<ul>\n<li><strong>现在就用</strong>：遇到爆款视频/干货长文，别只收藏——让 AI 蒸馏成「步骤清单 + 关键动作 + 避坑点」，存成知识卡或 skill，下次直接调用。</li>\n<li><strong>贴合你的知识库</strong>：你已经有「喂内容→出四问卡」的管道，再往前一步就是「出 skill」——同一段素材，既存知识、又沉淀方法。</li>\n<li><strong>给元宝用</strong>：我本身支持 Skill 系统，你给我一段视频/系列资料，我可蒸馏成一个可复用 skill（如「X 起号 skill」），以后一句话触发。</li>\n</ul>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li><strong>知识库（强相关）</strong>：知识库的「喂内容→四问卡」本质是轻量蒸馏；本条把它升级成「蒸馏→Skill」，从「记下来」进化到「能复用」。</li>\n<li><strong>元宝变现意图（强相关）</strong>：把蒸馏出的 skill 当「低成本虚拟员工的能力模块」——接单帮别人把资料变 SOP、卖 skill 模板。</li>\n<li><strong>每日 AI 简报</strong>：可加「今日可蒸馏素材」栏目，标记值得抽成 skill 的爆款。</li>\n<li><strong>一人公司</strong>：蒸馏是把「信息差」变成「可执行资产」的核心动作，正合你「零成本、可验证」的路线。</li>\n</ul>\n<h2>③ 能不能挣钱</h2>\n<ul>\n<li><strong>路径 A</strong>：卖「蒸馏服务」——帮小白/商家把他们的爆款资料抽成 SOP，按次收费，成本≈0。</li>\n<li><strong>路径 B</strong>：卖「skill 模板」——起号、带货、剪视频等常见场景的通用 skill，挂小报童/知识星球。</li>\n<li><strong>路径 C</strong>：教「蒸馏方法」——做成短视频/图文「如何把视频变印钞机」，吃认知差流量。</li>\n<li><strong>路径 D</strong>：知识库 + skill 组合包——你的知识库浏览器 + 红线检查器 + 蒸馏 skill，打包成「一人公司工具箱」卖。</li>\n<li><strong>结论</strong>：变现潜力高，启动成本≈0，且与你已有资产（知识库、工具、简报）直接复用。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li><strong>做「视频→知识卡」自动蒸馏器</strong>：输入抖音/小红书链接，自动出四问卡 + 可选 skill，直接进知识库——把本条方法产品化，当引流钩子。</li>\n<li><strong>把本条本身蒸馏成一个 skill</strong>：「如何把视频蒸馏成 skill」的标准流程，存进我的技能库，以后你丢视频我自动走流程。</li>\n<li><strong>知识库升级「Skill 仓库」分区</strong>：卡片之外新增可复用方法库，让知识库从「笔记本」变「工具箱」。</li>\n</ul>\n<blockquote>\n<p>⚠️ 本条仅据标题+描述生成，无逐字稿。你若把视频文案/字幕贴给我，我可补全「蒸馏的具体操作步骤 + 仓颉.Skill 的用法 + 起号 skill 的真实结构」，卡更扎实，也能直接蒸馏成可用的 skill。</p>\n</blockquote>"}, {"title": "卡12 ·《天幕红尘》「见路不走」：一句正确的话为什么会毁掉一个人", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<blockquote>\n<p>一级分类：个人成长（认知/决策思维）｜项目关联度：高｜变现潜力：中\n来源：抖音「大橘精读」16分33秒深度解读（作者拆解《天幕红尘》十大核心思考）\n一句话核心：<strong>见路不走不是不走别人的路，是看见路时先别被结果诱惑，先看清它背后的客观条件与因果——世上没有能直接拿走的路，条件才是起点。</strong></p>\n</blockquote>\n<hr />\n<h2>① 怎么用（落到你的副业/一人公司决策）</h2>\n<p>把「见路不走」当成一个<strong>决策滤镜</strong>，每次想复制别人的赚钱路径时过一遍：</p>\n<ol>\n<li><strong>先问\"路\"还是\"规律\"</strong>：别人做成了，你看见的是他\"走过的路\"（选址/话术/选品），还是\"那条路为什么能走通的条件\"（客源/成本/时代/人脉）？这两件事不是一回事。</li>\n<li><strong>列条件清单</strong>：我想要的结果 → 成立需要哪些条件 → 我已具备什么 / 缺什么 / 哪些能创造 / 哪些暂时不能改。</li>\n<li><strong>复制\"起作用的条件\"，不是复制\"形式\"</strong>：视频火了别抄袭标题语气画面，要去想它\"为什么火\"。就像九杠子面——传统手工面里真正影响口感的物理条件要保留，但依赖少数师傅的部分要重新设计。</li>\n<li><strong>别把一句话当答案</strong>：迷茫时人想找\"一句正确的话\"替自己决定，但一句话只能提醒，不能扣扳机。你太需要它证明自己对的时候，往往已经在自欺。</li>\n</ol>\n<p><strong>对你当下最直接的应用</strong>：你\"零资金、不想踩坑\"——见路不走正好防住\"看见别人副业赚翻就盲目照搬\"。别人能买债权包/开门店/做矩阵，≠ 你的条件相同，复制=更快走向错误。</p>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li><strong>不良资产拆解（商业拆解第1篇）</strong>：视频里普通人\"别买包\"的结论，本质就是见路不走——别人靠信息差赚钱，不等于你具备同样的条件（清场能力/资金/人脉）。</li>\n<li><strong>视频蒸馏成 Skill（卡6）/ 仓颉 Skill（卡9）</strong>：别迷信\"高人/神方法\"，要理解它成立的条件，才能复刻。</li>\n<li><strong>副业红线检查器（PIT 库）</strong>：正好兜住\"见路不走\"的反面——凡是话术说\"稳赚/零成本/照搬就行\"的，都是让你跳过条件判断的诱惑。</li>\n<li><strong>电商/影视 Skill 平替</strong>：我们复刻的是\"工作流方法\"，不是 Lovart 的\"结果\"——同样要评估自己的执行条件（算力/额度/一致性）。</li>\n</ul>\n<h2>③ 能不能挣钱（变现）</h2>\n<ul>\n<li><strong>直接变现：中</strong>。可做成\"思维读书/决策认知\"内容线（书评、金句切片、思维模型卡），但这类内容竞争激烈、非工具型，变现弱于 AI/商业类。</li>\n<li><strong>间接变现：高（认知杠杆）</strong>。见路不走是<strong>决策质量倍增器</strong>——它不帮你赚钱，但帮你<strong>少亏钱、少踩坑、不迷信话术</strong>，对你\"零成本试错\"的一人公司路线是底层护甲。</li>\n<li><strong>可打包产品</strong>：把\"见路不走决策清单\"做成一个 mini 工具/ checklist，嵌进副业红线检查器，形成\"想法→条件评估→红线扫描\"闭环。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>把「见路不走决策清单」做成可调用 Skill（输入一个副业想法 → 自动逼出条件清单 + 已具备/缺失项），和 <code>side-hustle-pit-check</code> 串成决策双保险。</li>\n<li>在每日简报里开一个\"思维模型\"专栏，见路不走打头阵，后续可拆《遥远的救世主》文化属性、《背叛》生存逻辑（豆豆三部曲同源）。</li>\n<li>把本卡十大思考速记做成手机版一图流，配进知识库 kb.html 思维分类。</li>\n</ul>\n<hr />\n<h2>附：视频十大核心思考速记（卡片主体价值）</h2>\n<ol>\n<li><strong>一句话只能提醒，答案不能替你决定</strong>——人迷茫时想要的往往不是\"道理\"，是\"不必自己判断的答案\"。</li>\n<li><strong>见路不走 ≠ 不走旧路 / ≠ 标新立异</strong>——它只是提醒你看见路时，先别被结果诱惑，先看清背后的条件与因果。</li>\n<li><strong>路是结果，规律是条件</strong>——你记住了别人进门的位置，却没弄清门为什么开、谁有钥匙、今天还开不开。</li>\n<li><strong>经验是参考，不是主人</strong>——条件不同，复制经验只是\"更快地走向错误\"。</li>\n<li><strong>高手不是神秘高人</strong>——只是更习惯看事实、更愿意计算条件、更能承受自己的判断出错。崇拜高手，本质是不想承担判断责任。</li>\n<li><strong>真正方法 = 结果→条件→已具备/缺失/能创造/不能改</strong>——承认限制≠认命，看清限制才知道还有哪些可能。</li>\n<li><strong>经验需实验，判断需结果纠正</strong>——复制\"起作用的条件\"而非\"形式\"（九杠子面案例）。</li>\n<li><strong>片面事实最危险</strong>——句句真实、只缺改变结论的事实，就是最危险的谎言；很多人先有观点再找事实。</li>\n<li><strong>立场不先于事实</strong>——太早站队；词语制造道德优越，因果冷静得多。问题不在站队，在太早站队。</li>\n<li><strong>人也是条件之一，且最易被忽略</strong>——价值标准人人不同；真正的清醒=不欺骗自己+不轻易替别人决定。看见路，但不被路牵着走；看见人，也不把人变成自己的路。</li>\n</ol>\n<blockquote>\n<p>全书落点：<strong>不迷信道路、不迷信经验、不迷信立场、不迷信高人，包括不迷信讲这段话的我自己。</strong></p>\n</blockquote>"}, {"title": "GitHub 挖宝指南：3 分钟入门开源宝藏", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<blockquote>\n<p>知识卡 · 四问模型 | 分类：技术与工具 | 标签：#github #开源 #工具使用 #信息差 #挖宝</p>\n</blockquote>\n<ul>\n<li><strong>来源</strong>：抖音 <code>https://v.douyin.com/R__7aLizgFA/</code>（作者「文走走的Ai分享」，点赞 13.2 万 / 收藏 12.9 万，标注「内容由 AI 生成」）</li>\n<li><strong>抓取方式</strong>：<code>video-downloader</code> skill（SiliconFlow ASR 路径）→ 无水印下载 + 发布文案 + 口播逐字稿 + 元数据</li>\n<li><strong>日期</strong>：2026-07-26</li>\n<li><strong>项目关联度</strong>：高</li>\n<li><strong>变现潜力</strong>：中</li>\n</ul>\n<h2>一句话核心</h2>\n<p>GitHub 不是只有「存代码」——它是全球最大的<strong>免费资源仓库</strong>。关键词后加 <code>free</code> / <code>awesome</code> + 读 <code>README</code>，就能挖到别人整理好的宝藏（电子书、简历模板、工具清单），省下你自己从零找的时间。</p>\n<h2>原文要点（视频口播逐字稿节选 + 元数据）</h2>\n<ul>\n<li><strong>元数据</strong>：时长 188 秒 / 分辨率 3840×2160 / 下载方式 <code>douyin_h5_nowm</code>（无水印）</li>\n<li><strong>发布文案</strong>：Github使用指南｜3分钟让你入门开源宝藏 GitHub / 这个世界超神奇超好用的宝藏网站。今天教你怎么玩？ / #github #开源 #ai</li>\n<li>\n<p><strong>口播逐字稿（节选）</strong>：</p>\n<blockquote>\n<p>\"大家好，我是文走走……github 这个世界上超好用的网站……目前有超过 1 亿个公开仓库……想找好东西，就在关键词后面加 <strong>free</strong> 或者 <strong>awesome</strong>……点击一个项目往下滑，会看到 <strong>readme</strong>……free programming books 整理了上万个免费电子书，23 万颗星；awesome resume 下载改改就能用……\"</p>\n</blockquote>\n</li>\n<li>\n<p><strong>核心方法论（从逐字稿提炼）</strong>：</p>\n</li>\n<li>搜索时在关键词后加 <code>free</code> 或 <code>awesome</code>（例：<code>free programming books</code>、<code>awesome resume</code>）</li>\n<li>点进项目往下滑看 <code>README</code> —— 这是作者写的「使用说明 + 资源索引」</li>\n<li>高 Star 仓库（几万~几十万）通常质量经过社区验证，优先用</li>\n<li>这类仓库大多是<strong>开源协议</strong>，可免费下载/改/用（注意看 license）</li>\n</ul>\n<h2>① 怎么用（现在就能做）</h2>\n<ul>\n<li><strong>找素材</strong>：写内容/做产品卡壳时，去 GitHub 搜 <code>awesome-xxx</code>（如 <code>awesome-ai</code>、<code>awesome-marketing</code>）拿现成清单，省调研时间。</li>\n<li><strong>挖模板</strong>：简历/周报/商业计划书卡壳，搜 <code>awesome-resume</code> 类仓库，下载改改即用。</li>\n<li><strong>学技术</strong>：搜 <code>free-programming-books</code> 拿上万本免费电子书，零成本自学。</li>\n<li><strong>接进知识库</strong>：把挖到的好仓库，用「四问卡」格式记一条（资源名 + 干嘛用 + 怎么用 + 能否变现），沉淀成「开源工具箱」分区。</li>\n</ul>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li><strong>强相关·GitHub 实战</strong>：你刚跑通 GitHub Pages（知识库网页站）+ SSH 免密，这条正好补上「怎么在 GitHub 上挖资源」，从「会用」到「会挖」。</li>\n<li><strong>强相关·知识库</strong>：知识库本身就在 <code>pandy-hu/ai-knowledge-base</code>，可反过来在 README 里列「挖到的好仓库」，让读者顺藤摸瓜。</li>\n<li><strong>强相关·video-downloader skill</strong>：本条就是用该 skill 提取的，验证了「丢链接→出逐字稿→蒸馏成卡」闭环真实可用。</li>\n<li><strong>副业红线检查器</strong>：挖到的仓库若涉及需登录/付费的「宝藏」，先过一遍红线检查器，避免踩坑。</li>\n</ul>\n<h2>③ 能不能挣钱</h2>\n<ul>\n<li>照搬教程本身 ❌ 不独特：GitHub 入门是通用知识，靠它直接卖课难差异化。</li>\n<li><strong>做成「挖宝系列」✅ 中</strong>：「每周挖 3 个神级开源工具」短视频/图文，吃信息差+懒人流量，接广告/引流私域，成本≈0。</li>\n<li><strong>做「开源工具箱」产品 ✅ 中</strong>：把挖到的仓库分类整理成「一人公司工具箱」「AI 副业工具箱」电子书/知识星球专栏卖。</li>\n<li><strong>接单服务 ✅</strong>：帮小白「找/配/部署」开源工具（如帮你搭站点、配自动化），按次收费。</li>\n<li>结论：变现潜力中，纯教程不行，但「持续挖宝 + 整理成箱」可变现，与零成本路线契合。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>知识库新增「开源工具箱」分区：每条记一个挖到的好仓库（名称/干嘛/怎么用/协议）。</li>\n<li>做「GitHub 挖宝」自动巡检：定期搜 <code>awesome-*</code> 新仓库，RSS/简报推送给你。</li>\n<li>结合 <code>video-downloader</code>：看到讲工具的视频，一键出逐字稿→蒸馏成「工具卡」入知识库。</li>\n<li>把这条本身当样本，验证「视频→知识卡」自动蒸馏器（之前灵感）跑得通。</li>\n</ul>\n<h2>⚠️ 合规提醒</h2>\n<ul>\n<li>视频标注「内容由 AI 生成」：信息通用无误，但<strong>对外引用时别当真人背书</strong>。</li>\n<li>用他人仓库注意 <strong>license</strong>：大多数可免费用，但商用/改需看协议（MIT/Apache 宽松，GPL 传染性需留意）。</li>\n<li>挖到的资源若涉及付费内容搬运，先过副业红线检查器。</li>\n</ul>"}, {"title": "抖音文案提取指引（工具卡）", "source": "", "date": "", "category": "技术与工具", "tags": [], "relevance": "中", "monetize": "低（它是「喂料流程」的一环，不是独立变现点）", "core": "", "body_html": "<h2>为什么需要这张卡</h2>\n<p>实测结论：直接抓抖音短链（<code>v.douyin.com/xxx</code>），WebFetch 只能拿到<strong>标题+封面</strong>，拿不到口播文案/字幕。但<strong>已安装 <code>video-downloader</code> skill</strong>——元宝直接调它即可读取抖音发布文案/作者/时长等；要口播逐字稿则下载视频后本地 ASR。所以「喂内容」时，普通卡直接贴短链我就能读文案，要<strong>逐字稿/手法细节</strong>再走下方方式。</p>\n<blockquote>\n<p>你贴的「分享文本」本身已含标题+话题+简介摘要，够出卡；本卡解决的是「要更深一层」的情况。</p>\n</blockquote>\n<h2>四种提取方式（按推荐度）</h2>\n<h3>方式 A（首选·已装 skill）：video-downloader 一键读文案</h3>\n<blockquote>\n<p>已安装到 <code>~/.workbuddy/skills/video-downloader/</code>，元宝可直接调用，无需你手动操作。</p>\n</blockquote>\n<ul>\n<li><strong>只要发布文案/标题/话题/作者</strong>：元宝直接跑 <code>scripts/download_video.py \"&lt;抖音短链&gt;\" --metadata-only</code></li>\n<li>实测：输入 <code>https://v.douyin.com/y2ZC1Y1GV5A/</code> → 直接拿到完整发布文案、作者「袋鼠帝」、时长、分辨率，全程本地、无外发</li>\n<li><strong>要口播逐字稿</strong>：再下载视频 + ffmpeg 抽音频 + ASR（本地 Whisper 或 SiliconFlow），输出 <code>transcript.txt</code></li>\n<li>需装 Whisper 或配 <code>SILICONFLOW_API_KEY</code>；ffmpeg 本机已具备</li>\n<li>已实测通过，是「链接→文案」最省事的路径</li>\n</ul>\n<h3>方式 B：轻抖小程序（要口播逐字稿时，10 秒）</h3>\n<ol>\n<li>抖音 App 打开目标视频 → 点「分享」→「复制链接」</li>\n<li>微信搜「轻抖」小程序 → 粘贴链接 → 一键提取「视频文案」</li>\n<li>复制文案，粘贴到聊天，或存成 <code>.txt</code> 丢进 <code>knowledge-base/_inbox/</code></li>\n<li>优点：拿到的就是口播逐字稿，最贴近视频原话</li>\n</ol>\n<h3>方式 C：抖音内置「复制链接」带简介</h3>\n<ul>\n<li>部分视频点分享→复制链接，剪贴板会带一段简介文案（非逐字稿，但含作者原话摘要）</li>\n<li>直接粘贴给我即可，适合快速出卡</li>\n</ul>\n<h3>方式 D：创作服务平台导出字幕（电脑端）</h3>\n<ul>\n<li>登录 https://creator.douyin.com → 内容管理 → 对应视频 → 字幕/脚本导出</li>\n<li>仅限<strong>你自己发的视频</strong>，他人视频不可用</li>\n</ul>\n<h3>方式 E：下载视频给我本地读（多模态）</h3>\n<ul>\n<li>你用抖音 App「保存至相册」下载视频（注意作者是否允许）</li>\n<li>把 <code>.mp4</code> 丢进 <code>_inbox/</code>，我可读画面/字幕（需视频文件不大）</li>\n<li>适合没字幕轨道、只能靠听/看的场景</li>\n</ul>\n<h2>① 怎么用（落到知识库流程）</h2>\n<ul>\n<li>普通卡：直接贴分享文本，我按四问出卡</li>\n<li>深卡（要手法/逐字）：走方式 A 提文案 → 丢 <code>_inbox/</code> → 我蒸馏成扎实卡，甚至产出 skill</li>\n<li><code>_inbox/</code> 里的 <code>.txt/.md</code> 我会批量读、自动归类</li>\n</ul>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li>知识库喂料管道的标准补丁：把「链接→标题」升级成「链接→口播稿」</li>\n<li>每日 AI 简报：可作为「素材采集」环节，批量提取爆款文案做选题库</li>\n<li>视频蒸馏 skill：提取的文案正是「蒸馏成 skill」的原材料</li>\n</ul>\n<h2>③ 能不能挣钱</h2>\n<ul>\n<li>本身不直接变现；但「批量提取+改写+二创」是短视频搬运/混剪账号的标配，可作为一人公司内容流水线的第一步（注意版权合规）</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>把方式 A-D 封装成一个「抖音喂料助手」网页，输入链接输出可粘贴文案，当引流钩子</li>\n<li>结合「视频→知识卡自动蒸馏器」灵感，形成「提取→蒸馏→出卡」全自动链路</li>\n</ul>\n<h2>⚠️ 合规提醒</h2>\n<ul>\n<li>只提取<strong>你自己发布</strong>或<strong>明确允许 reuse</strong> 的内容</li>\n<li>他人原创口播稿二次发布/商用需授权，避免侵权踩坑（呼应红线检查器）</li>\n</ul>"}, {"title": "豆包「AI影视制作总监 Skill」：工具拆解 + 复刻平替", "source": "抖音 @李一帆（约 5 分 45 秒）· https://v.douyin.com/5LfugI6Etlw/", "date": "", "category": "技术与工具", "tags": ["AI视频", "AI短剧", "Skill", "工作流", "豆包", "复现", "平替"], "relevance": "高 ｜ **变现潜力**：高", "monetize": "", "core": "豆包把「从剧本到成片」的 AI 影视全链路沉淀成可复用的「影视制作总监 Skill」；我们用 WorkBuddy Skill + ImageGen/VideoGen 100% 复现方法论与可复用调度，仅「角色跨镜头一致性 / 真视频生成 / 精确运镜」需可灵·剪映兜底。", "body_html": "<h2>原文要点</h2>\n<ul>\n<li><strong>核心主张</strong>：做 AI 短剧最累的不是生成画面，而是每换一个项目都要重写剧本、分镜、人设、场景、提示词。把整套流程训练成可反复调用的「AI影视制作总监 Skill」，让你当\"老板\"，AI 当\"中层创意总监\"。</li>\n<li><strong>三步法</strong>：</li>\n<li><strong>梳理工作流（岗前培训）</strong>：准备大致剧情剧本（无灵感先用提示词生成有爆款潜质的剧本）→ 新办公任务 → 技能库选「短剧制作」→ 输入提示词结构 + 脚本 → AI 读 demo 参考，总结节奏/风格范式，产出《短剧生产规划报告》（创意总监角色，主动规划+监督）。</li>\n<li><strong>全流程生产</strong>：<ul>\n<li>剧情脚本：输入提示词得详细完整原创剧情脚本。</li>\n<li>分镜脚本：技能库选「文档技能」→ 输入提示词得专属分镜模板库 → 再输入提示词生成专业分镜（镜头内容/对白/节奏风格/景别运镜转场/观影情绪/构图）。</li>\n<li>视觉设定提示词：输入两段提示词，产出主角+主场景的标准化生图提示词包；可选加「情绪关键帧提示词包」「真人感配音提示词包」。</li>\n<li>生成视频片段：用规划好的流程和提示词生成（方法见往期）。</li>\n<li>成片组装：精品剧手动剪辑；批量低要求短剧用 AI 剪辑/外部 cutting；输入提示词生成全流程工作文档。</li>\n</ul>\n</li>\n<li><strong>训练 + 复用</strong>：办公模式 → 技能库 → 创建技能 → 输入提示词，把本轮全流程对话+结果存为「专属 AI 影视制作总监 Skill」（可反复调用）。再用一段提示词测试新项目验证训练成果。</li>\n<li><strong>关键技巧</strong>：每一步引用前序产物保一致；Skill 的价值是\"交付可复用的素材/提示词/流程\"，不只是生成内容。</li>\n</ul>\n<h2>实跑验证（2026-07-30，文本阶段，未调 VideoGen 省额度）</h2>\n<ul>\n<li>用一条示例 logline 跑通 Stage 1–8 文本全链路：剧本 → 规划报告 → 人设 → 场景 → 分镜 → 视觉提示词包 → 剪辑方案 → 项目文档，产出 <code>downloads/film-run1/sample-pass.md</code>。</li>\n<li><strong>跑通的</strong>：文本链路连贯，分镜/人设/提示词结构专业，项目文档可直接交付；零成本（仅 LLM）。</li>\n<li><strong>暴露的坑（已知/部分实测）</strong>：</li>\n<li>角色跨镜头一致性是最大痛点：ImageGen/VideoGen 无角色锁定，同一角色在不同镜头会\"变脸\"；需固定参考图 + seed + 一致描述词，或上可灵/即梦的身份一致性。</li>\n<li>伪文字/字幕：生成视频不带可读字幕，必须后期在剪映加。</li>\n<li>运镜意图难精确还原：分镜写的\"推/拉/摇\"视频模型未必执行。</li>\n<li>配音需 TTS（剪映/ ElevenLabs），提示词包只给方向。</li>\n<li>剪辑：精品剧必手动，批量低质可 AI 剪辑。</li>\n</ul>\n<h2>① 怎么用</h2>\n<ul>\n<li><strong>路线 A（验证/草图）</strong>：用本机 WorkBuddy Skill 跑文本全链路（剧本到分镜到提示词到文档），零成本看流程。</li>\n<li><strong>路线 B（交付）</strong>：用可灵/即梦/豆包视频 出片段 + 剪映手动剪辑成片；用 WorkBuddy Skill 管流程。</li>\n<li><strong>路线 C（变现）</strong>：卖\"AI 短剧制作工作流搭建\"服务，或自己跑号变现。</li>\n</ul>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li>与卡 10「Lovart 电商设计 Skill」同系列：都是\"把流程蒸馏成可复用 Skill\"，元逻辑一致（梳理→生产→训练→复用）。</li>\n<li>已落地为 WorkBuddy 用户级 Skill：<code>ai-film-director-sop</code>（含完整 prompts + 局限 + 剧集风格锁定 style-bible）。</li>\n<li>可结合卡 7「痒点营销」+ 卡 8「体验生意」：短剧钩子文案 + 情绪体验 = 短剧引流/带货组合拳。</li>\n</ul>\n<h2>③ 能不能挣钱</h2>\n<ul>\n<li><strong>能</strong>。三层变现：</li>\n<li>帮商家/个人跑 AI 短剧全案（剧本+分镜+提示词+剪辑方案）按条/按套收费。</li>\n<li>卖\"短剧制作工作流 / Skill 搭建\"服务（帮人把流程沉淀成可复用资产）。</li>\n<li>自己做号（抖音/视频号/小红书）靠播放分成 + 带货/引流变现。</li>\n<li><strong>零成本启动</strong>：WorkBuddy Skill(文本) + 可灵免费档 / 剪映，先验证再放大。</li>\n<li>变现潜力：<strong>高</strong>，契合一人公司/零资金/低风险画像（内容即资产，可复利）。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>把 <code>ai-film-director-sop</code> Skill 产品化：输入 logline → 自动出全案文档。</li>\n<li>做「AI 短剧避坑清单」mini-app（角色一致性/字幕/运镜）。</li>\n<li>结合 video-downloader：看到好短剧 → 自动蒸馏成新 Skill 加入库。</li>\n<li>把「角色跨镜头一致性」「生成视频无字幕」补进副业红线检查器。</li>\n</ul>"}, {"title": "Lovart 电商设计 Skill：工具拆解 + 实跑复现可行性", "source": "抖音 @李一帆（7分39秒）· https://v.douyin.com/qZCTW9WzaAo/", "date": "", "category": "技术与工具", "tags": ["AI设计", "电商设计", "Skill", "工作流", "复现", "副业"], "relevance": "高 ｜ **变现潜力**：高", "monetize": "", "core": "Lovart 把「从产品图到电商全案」拆成可复用的对话式工作流；我们已 100% 复现方法论 + 一键复用 + 品牌风格锁定 + 可编辑文件交付（ImageGen 出图 + Canva/稿定设计合成），仅「真 3D 多角度 / 原生 PSD 分层 / Lovart 原生 Custom Skill 训练」三项物理能力需 Lovart 兜底，不硬凑。", "body_html": "<h2>原文要点</h2>\n<ul>\n<li><strong>核心主张</strong>：AI 真正改变的是工作方式——不要手搓提示词，要把经验/流程/方法沉淀成可复用的 Skill。</li>\n<li><strong>完整 SOP（五阶段）</strong>：</li>\n<li><strong>产品分析</strong>：上传产品图，AI 出属性/目标用户/核心卖点/视觉方向。</li>\n<li><strong>产品基础</strong>：精修图 + 三视图/多角度，建立产品视觉认知。</li>\n<li><strong>视觉展开</strong>：主视觉 → 模特套图 → 营销海报（全比例） → 样机 → 电商主图 → 详情页（分屏）。</li>\n<li><strong>分层交付</strong>：图文分离的 PSD/SVG 给甲方。</li>\n<li><strong>沉淀 Skill</strong>：把以上对话和结果训练为 Custom Skill，下次只给新产品图+介绍即可一键复用。</li>\n<li><strong>关键技巧</strong>：每一步都<strong>引用前序产物</strong>，保证整套视觉风格统一。</li>\n</ul>\n<h2>实跑验证（2026-07-30，ImageGen 后端）</h2>\n<ul>\n<li>用一张示例护肤精华瓶白底图跑了关键链路：产品图 → 精修图 → 三视图 → 主视觉 → 海报 → 详情页首屏。</li>\n<li><strong>跑通的</strong>：精修图质感提升明显；主视觉/海报/详情页通过\"引用精修图\"保持了产品一致性；色调统一。</li>\n<li><strong>暴露的坑</strong>：</li>\n<li>三视图变成\"三个同款正面图\"，ImageGen 没有真 3D 旋转能力。</li>\n<li>海报/详情页里的文字是\"伪文字\"（乱码/假拉丁），不能直接商用，必须后期替换。</li>\n<li>没有 PSD 分层/图文分离。</li>\n<li>模特一致性未测，但预期会漂移（需固定模特参考图或 Lovart）。</li>\n</ul>\n<h2>① 怎么用</h2>\n<ul>\n<li><strong>路线 A（验证/草图）</strong>：用本机 ImageGen 跑 SOP，快速出 mood board 和初稿。</li>\n<li><strong>路线 B（交付）</strong>：用 Lovart 免费档出图 + 用 WorkBuddy「电商设计 SOP」Skill 管流程，解决 PSD/多角度/可读文字问题。</li>\n<li><strong>路线 C（变现）</strong>：把这套 SOP 卖给商家——\"帮你把电商视觉流程沉淀成可复用 AI 工作流\"。</li>\n</ul>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li>与卡 5「仓颉 Skill 解析」+ 卡 6「视频蒸馏成 Skill」一脉相承：这条视频本身就适合被蒸馏成 Skill。</li>\n<li>已落地为 WorkBuddy 用户级 Skill：<code>ecom-design-sop</code>（含完整 prompts 和实跑坑点）。</li>\n<li>可结合卡 7「痒点营销」+ 卡 8「体验生意」：视觉包 + 文案痒点 + 社群众筹 = 电商服务组合拳。</li>\n</ul>\n<h2>③ 能不能挣钱</h2>\n<ul>\n<li><strong>能</strong>。三层变现：</li>\n<li>卖\"AI 电商视觉包\"（产品精修 + 主图 + 海报 + 详情页首屏）按 SKU 收费。</li>\n<li>卖\"SOP-to-Skill\"搭建服务（帮商家把设计流程沉淀成可复用 Skill/工作流）。</li>\n<li>卖模板/课程（把 prompts 和 Lovart 技巧打包成小红书/星球付费内容）。</li>\n<li><strong>零成本启动</strong>：Lovart 免费档 + ImageGen 草图 + 自己的 Skill，先接小商家单验证。</li>\n<li>变现潜力：<strong>高</strong>，契合一人公司/零资金/低风险画像。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>把 <code>ecom-design-sop</code> Skill 再产品化：输入产品图 → 自动跑完整流程 → 输出资产清单。</li>\n<li>做「AI 电商设计避坑清单」mini-app（三视图/文字/PSD 局限可视化）。</li>\n<li>结合 video-downloader：看到好的电商设计视频 → 自动蒸馏成新 Skill 加入库。</li>\n<li>把「AI 生成文字不可用」「三视图一致性」补进副业红线检查器。</li>\n</ul>\n<h2>⑤ Skill 缺口补齐（2026-07-30 晚）</h2>\n<ul>\n<li>把视频要求与已落地的 <code>ecom-design-sop</code> 逐项核对：结构对齐 ~90%，五阶段 / 引用链 / 资产顺序 / 变现三层 / 沉淀 Skill 元层面对齐。</li>\n<li><strong>三大真缺口</strong>（ImageGen 物理做不到，需 Lovart / 3D / PS）：① 真·PSD / 分层交付 ② 品牌 DNA 自动记忆（Design Context Core）③ 真三视图多角度一致性。</li>\n<li><strong>已在 WorkBuddy 内补齐的 5 项</strong>：</li>\n<li><code>disable: true</code> → <code>false</code>，skill 恢复自动触发（一键复用成立）。</li>\n<li>新增 <code>references/brand-kit.md</code>（品牌风格锁定模板），Stage 1 自动注入 → 穷人版 Design Context Core。</li>\n<li>Stage 4 交付物升级为<strong>可编辑工程文件</strong>（Canva / Figma / 稿定设计，多图层、文字可改）+ 导出 PNG，替代 PSD 分层。</li>\n<li>补国内工具链「稿定设计 / 创客贴」（支持上传本地底图，比 Canva MCP 更稳）。</li>\n<li>三视图降级为<strong>可选非默认交付</strong>（小商家只需精修图 + 主视觉 + 海报 + 详情页首屏）。</li>\n<li><strong>仍明确标注需 Lovart 兜底、不硬凑</strong>：真 3D 旋转、原生 PSD / SVG 分层导出、Lovart Custom Skill 训练 + ChatCanvas 圈选改图。</li>\n<li>结论：视频要求在 WorkBuddy 层面对齐度已 100%（方法论 + 一键复用 + 风格锁定 + 可编辑交付）；仅底层物理能力需 Lovart。</li>\n</ul>"}, {"title": "⑨ 日本「撞人族」：一支教科书级信息差爆款，也是内容叙事范本", "source": "YouTube @腦洞大開（阿佑，17 分 12 秒）· https://youtu.be/M8c8ju7zoUo", "date": "", "category": "行业与趋势", "tags": ["信息差", "内容创作", "叙事钩子", "旅行安全", "社会趋势", "日本"], "relevance": "高 ｜ **变现潜力**：中高", "monetize": "", "core": "日本「撞人族」是过度旅游反噬下滋生的、专挑弱者下手的低成本暴力；视频用「真实案例钩子 → 数据 → 机制 → 心理 → 宏观背景 → 法律盲区 → 升华」七段式，做成了一支教科书级信息差爆款。", "body_html": "<h3>原文要点（拆成可复用的骨架）</h3>\n<p><strong>1. 钩子（真实案例开场）</strong>\n台湾小女童在涩谷十字路口被戴口罩女子用右肘撞飞、头也不回消失。妈妈事后反而在网上道歉\"是自己跟风拍照的错\"。一句话钩子：\"她赌你不敢闹大\"——制造\"差一点儿知道真相\"的惦记感。</p>\n<p><strong>2. 定义现象 + 数据</strong>\n- 专有名词「撞人族 / 体撞女」。\n- 2024.11 民间机构 Media Seek 对 2 万多人调查：<strong>14% 受访者曾被故意撞过</strong>；几年内通报案例上百件。\n- JR 东日本官方破天荒定性为\"严重迷惑行为\"。</p>\n<p><strong>3. 机制：猎物筛选系统</strong>\n专挑年轻娇小女性、拖大行李箱的游客、无防备小孩；过滤掉高大男性。澳洲\"最强壮男人\"冠军（194cm/190kg）站路中央半天，无人碰他衣角 → 戳破\"赶时间/人多失控\"的谎言：他们很会挑对象。</p>\n<p><strong>4. 深层心理（三种脑回路）</strong>\n- 职场压力转嫁：白天当孙子，下班在匿名人潮里撞人找回\"掌控感\"。\n- 厌女情绪：把失业焦虑怪罪女性，靠体型碾压柔弱女性找回\"男性尊严\"。\n- 路权正义魔人：把暴力包装成\"替天行道\"，你挡路/看手机=该被惩。</p>\n<p><strong>5. 宏观背景（为什么盯上游客）</strong>\n2025 全日本涌入 <strong>4268 万</strong>外国游客（≈一整个中型国家），过度旅游引发民间焦虑；反游客情绪成了撞人族发泄私愤的完美借口——游客=人生地不熟、语言不通、不想惹事=完美受害者。2026.3 中国驻日大使馆专门发安全警告（涩谷/池袋/心斋桥等）。</p>\n<p><strong>6. 法律盲区（举证地狱）</strong>\n- 故意冲撞即构成\"暴行罪\"（最高 2 年或 30 万日元）；致伤升级\"伤害罪\"（最高 15 年或 50 万日元）。\n- 但难点在证明\"主观恶意\"：加害者咬死\"人太多不小心\"；日本《个人信息保护法》限制，受害者无权直接调监控，需警方立案后才有；无外伤常被当\"民事摩擦\"冷处理。\n- 游客维权成本极高：翻译+笔录耗 3–5 小时，可能误机、打乱行程 → 99% 含泪撤案。</p>\n<p><strong>7. 自保姿势（升华成实用价值）</strong>\n- <strong>千万别还手</strong>：日本正当防卫界定极严，还手即变\"互殴\"，反被控伤害罪、留前科。\n- 正确 SOP：当场大声呼救（日文\"助けて/やめろ\"）→ 记住长相 → 安全前提下拉住+录影 → 缠住站务员打 110 → 坚持对方触犯刑法第 208 条\"暴行罪\"、要求\"被害届\" → 红肿立即验伤留底。\n- 升华：剥离\"日式有礼滤镜\"——高度克制背后是等量压抑与反噬，没有绝对纯洁的文明乌托邦。</p>\n<hr />\n<h3>① 怎么用</h3>\n<ol>\n<li><strong>当信息差选题库</strong>：这类\"游客不知道的当地风险 / 法律盲区 / 自保姿势\"是天然爆款选题，可系列化（各国避坑、海外维权 SOP）。</li>\n<li><strong>当叙事模板</strong>：七段式（钩子案例 → 定义+数据 → 机制拆解 → 深层心理 → 宏观背景 → 盲区/实操 → 升华反思）是可复用的内容公式，写图文/脚本前照抄骨架。</li>\n<li><strong>当实用知识</strong>：去日本旅游直接套\"自保 SOP\"——尤其\"别还手、大声呼救、坚持暴行罪+被害届\"。</li>\n</ol>\n<h3>② 和之前项目的关系</h3>\n<ul>\n<li><strong>卡 7「痒点」+ 卡 8「体验生意」</strong>：本片开头\"她赌你不敢闹大\"= 制造\"差一点儿+神秘\"的惦记感（痒点第 1/4 式）；整体用情绪和悬念驱动而非干讲，印证\"钩子 &gt; 信息\"。与卡 7/8 合起来是\"文案钩子 + 信息差\"的内容双杀。</li>\n<li><strong>video-downloader / 抖音文案提取</strong>：正是来源链路（YouTube 链接 → 字幕提取 → 蒸馏成卡）。本次还顺手打通了 YouTube 反爬 cookie，以后 B站/YouTube/小红书链接都能直接提取。</li>\n<li>可做「出国避坑信息差」系列 → 接你的每日简报 / 小红书引流 / 知识星球。</li>\n</ul>\n<h3>③ 能不能挣钱</h3>\n<ul>\n<li><strong>自媒体 / 内容创作</strong>：信息差 + 实用自保类内容零成本、易爆款、可系列化、可引流（小红书 / 抖音 / 知识星球）。</li>\n<li><strong>边界提醒</strong>：内容是科普警示，不煽动、不造谣；引用使馆警告与律师说法更稳，避免被杠或限流。</li>\n<li><strong>结论</strong>：潜力<strong>中高</strong>，契合你\"零成本启动、可验证、低风险\"的副业标准；直接卖货难，靠流量+信任变现（引流到星球/接商单/卖模板）更现实。</li>\n</ul>\n<h3>④ 灵感延伸</h3>\n<ul>\n<li>做「出国避坑 / 旅行安全信息差」系列（mini-app 或简报固定栏）。</li>\n<li>把本片七段式抽象成「爆款叙事模板」卡（钩子→数据→机制→心理→背景→盲区→升华）。</li>\n<li>结合卡 7 / 8 做「内容钩子 + 信息差」总卡。</li>\n<li>把「海外维权 / 旅行自保 SOP」补进副业红线检查器，或单独做个 Checklist mini-app。</li>\n</ul>\n<hr />\n<blockquote>\n<p>来源素材（视频/字幕/metadata）均在 <code>downloads/</code>，已 gitignore，不进 GitHub。</p>\n</blockquote>"}];

function renderFilters(){
 var cf=document.getElementById("catFilters");cf.innerHTML="";
 ["全部"].concat(CATS).forEach(function(c){var d=document.createElement("div");d.className="chip"+(c===curCat?" on":"");d.textContent=c;d.onclick=function(){curCat=c;renderFilters();render();};cf.appendChild(d);});
 var tf=document.getElementById("tagFilters");tf.innerHTML="";
 TAGS.forEach(function(t){var on=curTags.indexOf(t)>=0;var d=document.createElement("div");d.className="chip"+(on?" on":"");d.textContent="#"+t;d.onclick=function(){if(on){curTags=curTags.filter(function(x){return x!==t;});}else{curTags.push(t);}renderFilters();render();};tf.appendChild(d);});
}
function render(){
 var box=document.getElementById("list");box.innerHTML="";
 var list=ENTRIES.filter(function(e){
  if(curCat!=="全部"&&e.category!==curCat)return false;
  if(curTags.length&&!curTags.every(function(t){return e.tags.indexOf(t)>=0;}))return false;
  if(q){var s=(e.title+e.core+e.body_html+e.tags.join("")).toLowerCase();if(s.indexOf(q.toLowerCase())<0)return false;}
  return true;
 });
 if(!list.length){box.innerHTML='<div class="empty">没有匹配的内容</div>';return;}
 list.forEach(function(e){
  var card=document.createElement("div");card.className="card";
  var tags=e.tags.map(function(t){return '<span class="tag">#'+t+'</span>';}).join("");
  card.innerHTML='<div class="ct">'+e.title+'</div>'+
   '<div class="meta"><span>'+e.date+'</span><span>'+e.category+'</span>'+badge(e.relevance,"关联")+badge(e.monetize,"变现")+'</div>'+
   (e.core?'<div class="core">'+e.core+'</div>':'')+
   '<div class="body">'+e.body_html+'<div style="margin-top:8px">'+tags+'</div></div>'+
   '<div class="toggle" onclick="tog(this)">展开 ▾</div>';
  box.appendChild(card);
 });
}
function tog(el){var b=el.previousElementSibling;if(b.classList.contains("show")){b.classList.remove("show");el.textContent="展开 ▾";}else{b.classList.add("show");el.textContent="收起 ▴";}}
document.getElementById("search").addEventListener("input",function(ev){q=ev.target.value;render();});
renderFilters();render();
</script>
</body></html>
