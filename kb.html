<script>
var ENTRIES=[{"title": "Obsidian + Codex 知识库搭建：本地不被收割的 AI 工作台", "source": "抖音 @北清科技（视频 https://v.douyin.com/VJ6snxLiYVE/ ，703 秒，2560×1440）", "date": "2026-08-09", "category": "AI与方法", "tags": ["知识库", "Obsidian", "Codex", "AI工作台", "本地优先", "不被大厂收割"], "relevance": "极高", "monetize": "高", "core": "Obsidian 存本地 markdown + 一个可接任意模型的 AI 引擎 = 不被大厂收割、能复利生长的个人知识操作系统；你现有的 `knowledge-base/` + 元宝已经把这个思路搭好 90%。", "body_html": "<h2>原文要点（我提炼）</h2>\n<h3>1. 为什么现在要做「本地优先」知识库</h3>\n<ul>\n<li>背景：豆包下架自有 AI、Claude/Walkup 提费，AI 市场开始「收割」——不续费工作流就被切断。</li>\n<li>卡帕西（Karpathy）验证过的组合：<strong>AI + Obsidian 本地库</strong>，数据本地、可接任意模型、不被巨头硬控，含金量还在上升。</li>\n</ul>\n<h3>2. 工具就两个</h3>\n<ul>\n<li><strong>Obsidian</strong>：本地 markdown 笔记工具，AI 能直接读本地文件，不用手动整理。</li>\n<li><strong>AI 引擎</strong>：一个可接任意大模型的插件/框架（教程语音识别成「CCswitch/Copilot」，实际是 Obsidian 里搜 <code>cloud</code> 类插件、配 API 接模型；再用 Codex/agent 框架解锁 skill / MCP / 定时）。</li>\n</ul>\n<h3>3. 三大阶段（采集 → 管理 → 任务）</h3>\n<table>\n<thead>\n<tr>\n<th>阶段</th>\n<th>教程做法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>① 信息采集</td>\n<td>把 GitHub 资讯项目丢给 AI → 每天自动抓热点、去重、打分、生成结构化日报；浏览器装 clipper 一键收藏文章/视频字幕进库</td>\n</tr>\n<tr>\n<td>② 知识管理</td>\n<td>资料喂给 AI → 沉淀概念/经验/skill；定制「知识迭代系统」自动查冗余、查冲突、沉淀模板方法论</td>\n</tr>\n<tr>\n<td>③ 完成任务</td>\n<td>一句话让 AI 读本地文件干活（报告/PPT/图视频）；重复 SOP 做成 skill 随调；定时任务自动跑（如每晚整理飞书→日报→周报）</td>\n</tr>\n</tbody>\n</table>\n<h3>4. 核心理念</h3>\n<ul>\n<li>产出反哺知识库，形成复利；罗马不是一天建成，从「一个很小的工作环节」入手，省下一丢丢时间就值得持续做。</li>\n</ul>\n<hr />\n<h2>① 怎么用</h2>\n<p><strong>现在马上能做（你已具备，认出来即可）：</strong>\n1. <strong>装 Obsidian 打开 <code>knowledge-base/</code> 文件夹</strong>：24 张卡 + 商业拆解即刻可见，本地全文搜索、双向链接、图谱视图。\n2. <strong>用元宝/WorkBuddy 当 AI 引擎</strong>：零成本平替教程里的 Codex——你把链接/视频/截图丢给我，我读库、蒸馏成四问卡、出文档、定时跑。\n3. <strong>把教程三大阶段映射到你已有体系</strong>：采集=每日简报自动化；管理=四问卡+商业认知版图；任务=一句话让我调 skill/出报告。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- <strong>知识迭代 Skill</strong>：让元宝定期扫全库，标记冗余/冲突卡，生成「待合并清单」。\n- <strong>Obsidian 插件包</strong>：Copilot（库内对话）、QuickAdd+Templater（一键建四问卡）、Dataview（自动生成索引表，替代手动维护 index.md）。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>卡 2026-08-07《姜胡说 AI+PARA 知识库》</strong>：同思路（本地目录 + AI 操作员 + 查自己）。那张讲 PARA 目录，这张讲「三大阶段 + skill 自动化 + 定时」，是落地补全。</li>\n<li><strong>卡 2026-07-25《四步闭环搭 AI 知识库》</strong>：那张讲心态（先上场），这张是具体工具链。</li>\n<li><strong>每日 AI 机会简报自动化</strong> = 教程「① 信息采集」的现成实例（每天 9 点抓热点出报）。</li>\n<li><strong>video-distill / idea-capture / 红线检查器 Skill</strong> = 教程「③ 完成任务 / skill 沉淀」的实例。</li>\n<li><strong>四端同步（GitHub+腾讯文档+kb.html+微信）</strong> = 教程「多端可用」的实例，且比纯 Obsidian 更全。</li>\n<li><strong>商业认知版图</strong> = 教程「② 知识迭代系统」的轻量版。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<table>\n<thead>\n<tr>\n<th>路径</th>\n<th>说明</th>\n<th>启动难度</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>知识库搭建服务</strong></td>\n<td>用你已跑通的流程帮小白装 Obsidian+接元宝/Codex，收 199–599</td>\n<td>中</td>\n</tr>\n<tr>\n<td><strong>付费模板/说明书</strong></td>\n<td>把「教程同款 + 元宝平替」打包成腾讯文档/Notion 模板，定价 9.9–99</td>\n<td>低</td>\n</tr>\n<tr>\n<td><strong>知识星球专栏</strong></td>\n<td>写「AI 工作流拆解」系列，每日简报就是现成素材</td>\n<td>低</td>\n</tr>\n<tr>\n<td><strong>内容产品化引流</strong></td>\n<td>把这条教程拆成小红书/抖音脚本（「大厂收割→本地优先」话题），引流星球</td>\n<td>低</td>\n</tr>\n</tbody>\n</table>\n<p><strong>结论</strong>：变现潜力高，且全部建立在你已有的 <code>knowledge-base/</code> 和简报体系上，启动成本≈0。重点别去碰 Codex 付费 API，用元宝平替即可。</p>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ol>\n<li><strong>做「知识迭代 Skill」</strong>：定期扫库查冗余/冲突，输出「待合并总卡」，把教程②真正自动化。</li>\n<li><strong>Obsidian 插件一键配置包</strong>：把 Copilot+QuickAdd+Templater+Dataview 的配置打包，小白双击即用。</li>\n<li><strong>写长文《大厂开始收割，你的知识该搬回本地了》</strong>：蹭教程热点，引流到星球/简报。</li>\n<li><strong>把本卡 + 说明书做成付费模板</strong>：「元宝版 Obsidian 知识库搭建包」，对标教程作者卖的文档。</li>\n<li><strong>网页版 kb.html 升级</strong>：加 PARA/分类筛选 + 「与我相关」排序，逼近教程的导航体验。</li>\n</ol>\n<hr />\n<h2>附：教程工具 → 你的平替对照</h2>\n<table>\n<thead>\n<tr>\n<th>教程工具</th>\n<th>你的平替</th>\n<th>费用</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Obsidian</td>\n<td>Obsidian（同款直接装）</td>\n<td>免费</td>\n</tr>\n<tr>\n<td>Codex / Copilot 插件（接 API）</td>\n<td>元宝 / WorkBuddy 当引擎</td>\n<td>免费</td>\n</tr>\n<tr>\n<td>GitHub 资讯项目（日报）</td>\n<td>每日 AI 机会简报自动化</td>\n<td>免费</td>\n</tr>\n<tr>\n<td>clipper 收藏插件</td>\n<td>直接把链接丢给元宝</td>\n<td>免费</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>⚠️ 教程演示的 Codex 是 OpenAI 付费产品，需自备 API key、按量计费。对「零成本启动、不想踩坑」的你，直接用元宝平替即可，数据更集中在本地。</p>\n</blockquote>"}, {"title": "GitHub 找高星项目并应用（麻省理工 3 问实跑）", "source": "抖音麻省理工 AI 学习法实跑主题；资料取自 GitHub 官方文档 + 高级搜索语法 + Awesome Lists + Trending + Copilot Chat 找项目 + CSDN 实战教程", "date": "2026-08-09", "category": "技术与工具", "tags": ["GitHub", "开源", "工具淘金", "学习方法实跑"], "relevance": "高", "monetize": "中", "core": "GitHub 不是\"搜 stars\"，是\"先定目的 → 多维信号筛活项目 → 跑起来再读再改\"的淘金流程。", "body_html": "<h2>麻省理工 3 神级问题（实跑答案）</h2>\n<h3>① 专家共识的 5 个核心思维模型</h3>\n<ol>\n<li><strong>目的先行</strong>：先定\"学 / 用 / 抄 / 贡献\"哪种目的，再选筛法。学代码就 <code>stars:&gt;1000 language:Java</code>；找资料就 <code>awesome stars:&gt;10000</code>。（CSDN 实战强调先明确目的）</li>\n<li><strong>信号分层</strong>：stars = 广度关注（初筛）；forks / 近期 commits / issue 响应速度 = 深度健康；多维交叉验证，不盯单点。</li>\n<li><strong>入口分级</strong>：Explore / Trending（广撒网）→ topics / awesome（主题深挖）→ 搜索语法（精准狙击）→ Copilot / 关注的人（智能推荐）。</li>\n<li><strong>活性优先</strong>：<code>pushed:&gt;2024-01-01</code> 且近期有 commit &gt; 高 star 但停更的老项目（\"资料合集/电子书\"常刷星却不维护）。</li>\n<li><strong>抄-读-改递进</strong>：clone 跑起来 → 读核心源码 → fork 改适配。不懂不抄，避免把\"awesome 合集当业务系统\"。</li>\n</ol>\n<h3>② 争得最凶的 3 个问题（争议地图）</h3>\n<ol>\n<li><strong>stars 是信号还是虚荣指标？</strong></li>\n<li>正方：社区快速验证、筛掉垃圾的最低成本信号。</li>\n<li>反方：可刷量、跟风、资料合集刷星不代表代码质量。</li>\n<li>边界：stars 只作<strong>初筛</strong>，必须配 forks / recency 交叉验证。</li>\n<li><strong>Awesome List 是宝藏还是堆砌？</strong></li>\n<li>正方：社区长期维护、分类精、质量普遍高。</li>\n<li>反方：很多年久失修、收录标准宽松、链接失效。</li>\n<li>边界：看 list 最后更新时间 + 是否带评注/星级，别无脑照抄。</li>\n<li><strong>追 Trending 蹭新 vs 稳选维护中？</strong></li>\n<li>正方：追新学前沿、抓早期信息差。</li>\n<li>反方：新手应挑长期维护、文档全的项目降学习成本。</li>\n<li>边界：学习用稳选，灵感/信息差用追新。</li>\n</ol>\n<h3>③ 10 个「真懂检测器」（自测，答不出就死磕）</h3>\n<ol>\n<li>你能写一句语法筛出\"近一年更新、stars&gt;5000、Python\"的项目吗？</li>\n<li>stars 高但半年没 push，你会直接排除还是看原因？</li>\n<li>拿到高星项目，你第一步是 clone 跑 / 读 README / 看代码结构？</li>\n<li>awesome list 和具体业务 repo，你清楚何时用哪个吗？</li>\n<li>fork 数远高于 stars 说明什么？你怎么用这信号？</li>\n<li>想学\"AI agent\"，能用 topics / 搜索拼出 3 个可学 repo 吗？</li>\n<li>抄别人代码前，你能说出抄的那段\"为什么这么写\"吗？</li>\n<li>issue 里一堆未回复 bug，你还敢用吗？判断标准？</li>\n<li>你知道怎么找\"欢迎首次贡献\"的 good first issue 项目吗？</li>\n<li>有具体需求（如\"给知识库加搜索\"），能反查 GitHub 现成方案吗？</li>\n</ol>\n<hr />\n<h2>原文要点（资料提炼）</h2>\n<ul>\n<li>GitHub 官方：Explore 浏览热门、Search 精准、Stars 收藏、Following 跟人；无唯一方法，看广撒网还是精准找。</li>\n<li>高级搜索：<code>language:python stars:&gt;10000 topic:machine-learning</code>、<code>fork:true archived:false pushed:&gt;2023-01-01 sort:updated-desc</code>、<code>user:facebook stars:&gt;5000</code>。</li>\n<li>Awesome Lists（如 awesome-python）社区长期维护、质量高；LibHunt 带投票对比；Open Source Guides 教理性评估。</li>\n<li>Copilot Chat 可直接说\"找 Python、接受新贡献、good first issue、&gt;100 stars 的项目\"。</li>\n<li>关键提醒：高 star 可能是资料合集/电子书/导航，不是业务系统源码——按目的区分。</li>\n</ul>\n<hr />\n<h2>① 怎么用（现在马上能做）</h2>\n<p><strong>应用 GitHub 项目的 5 种姿势（结合你一人公司）：</strong>\n1. <strong>克隆跑起来当工具</strong>：如 <code>video-downloader</code>、<code>zsxq-cli</code> 你已在用——找到即生产力。\n2. <strong>读源码学</strong>：看同类 mini-app 项目学前端，反哺你 35 个作品。\n3. <strong>fork 改适配</strong>：把开源脚手架改成自己的产品（你的 web-games 模板即此类）。\n4. <strong>提取单模块</strong>：把某项目的单个能力（ASR / zip / 爬虫）嵌进自己工作流。\n5. <strong>当灵感源</strong>：awesome lists 找副业灵感与信息差；GitHub Pages 直接部署上线（web-games 已验证）。</p>\n<p><strong>未来存成知识块：</strong>\n- 固化一套\"找项目搜索语法模板\"放进 skill 或知识库工具区。\n- 给 idea-capture 加\"GitHub 反查\"步骤：有需求先 GitHub 搜现成方案。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>video-downloader skill</strong>：本质就是\"在 GitHub 找 yt-dlp 类项目 + 自己包一层\"的应用实例。</li>\n<li><strong>zsxq-cli</strong>：GitHub 项目直接应用（发星球帖）。</li>\n<li><strong>知识库模板包（做3）</strong>：把\"GitHub 式结构\"本地化为 Obsidian 库。</li>\n<li><strong>web-games 部署</strong>：GitHub + GitHub Pages 零成本上线，是你\"一人公司\"基础设施。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li><strong>路径 A</strong>：用淘来的工具加速副业，省下外包钱 = 更快出产品（零成本主线核心补给站）。</li>\n<li><strong>路径 B</strong>：做「GitHub 淘金 / AI 副业工具箱」内容引流星球（与你做 3 模板同调）。</li>\n<li><strong>路径 C</strong>：awesome list 式导航站 / 合集变现。</li>\n<li><strong>结论</strong>：潜力<strong>中高</strong>。本身不直接赚，但你是\"一人公司零成本\"的弹药库——找到可复用资产即降本增效。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>做「GitHub 淘金喂饭包」去星球（复用做 3 模板结构）。</li>\n<li>把\"找项目 3 问\"固化进 idea-capture 或独立 skill（有需求先 GitHub 反查）。</li>\n<li>知识库模板包发 GitHub 公开仓 <code>pandy-hu/ai-knowledge-base-template</code>（之前提过，公域曝光）。</li>\n<li>每日简报加「今日 GitHub Trending 精选」栏目，喂信息差。</li>\n</ul>\n<hr />\n<h2>⑤ 实跑自测答卷（2026-08-09 用户真答 + 死磕反馈）</h2>\n<p><strong>问2 争议地图实战判断（用户已摸透边界）</strong>：stars=快速筛选信号 ✓｜awesome list=宝藏，年久失修先看最后更新时间 ✓（独立摸到\"边界\"）｜trending 也看但长期维护更重要 ✓。→ 争议地图基本全中，说明真懂\"项目好坏判断框架\"。</p>\n<p><strong>问3 十个真懂检测器答卷</strong>：</p>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>题</th>\n<th>用户答</th>\n<th>死磕反馈（元宝）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>写语法筛\"近一年/stars&gt;5000/Python\"</td>\n<td>不能，不会语法</td>\n<td>对你非短板。非程序员真懂=「能说清筛选条件」，语法交元宝。记3词：stars / pushed:&gt;日期 / language:</td>\n</tr>\n<tr>\n<td>2</td>\n<td>stars高但半年没push</td>\n<td>排除，AI圈半年不维护≈过时</td>\n<td>精准！补：还看最近release版 / issue作者回不回 / commit是否刷格式，两项活就值得看</td>\n</tr>\n<tr>\n<td>3</td>\n<td>第一步做啥</td>\n<td>先读README</td>\n<td>满分。README=和项目第一次对话，非程序员靠它+截图判80%</td>\n</tr>\n<tr>\n<td>4</td>\n<td>awesome vs 业务repo</td>\n<td>不太清楚</td>\n<td>awesome=菜单(找方向/灵感)，业务repo=一道菜(能跑)。先菜单找方向→跳具体repo。别把菜单当菜吃</td>\n</tr>\n<tr>\n<td>5</td>\n<td>fork远高于star</td>\n<td>star=喜欢/fork=真用</td>\n<td>内行！补：对你最有用是\"Used by\"标签(谁拿它当零件)+近期活跃，比裸star实在</td>\n</tr>\n<tr>\n<td>6</td>\n<td>topics拼3个可学repo</td>\n<td>不会</td>\n<td>交元宝。你真懂=「知道能按主题找同类」，拼法我来</td>\n</tr>\n<tr>\n<td>7</td>\n<td>抄前说清为什么这么写</td>\n<td>不懂代码，有AI辅助</td>\n<td>合理。边界：用前让元宝先讲清\"怎么工作/能干嘛/坑\"，再决定抄不抄——非程序员读源码平替</td>\n</tr>\n<tr>\n<td>8</td>\n<td>issue一堆未回复bug</td>\n<td>看情况解决</td>\n<td>最对的元回答。rubric：①bug是否影响你用的功能②有无workaround③项目还活。三条都坏→换；坏一条→绕开</td>\n</tr>\n<tr>\n<td>9</td>\n<td>good first issue</td>\n<td>不知道</td>\n<td>对你优先级最低(使用者非贡献者)，跳过无妨</td>\n</tr>\n<tr>\n<td>10</td>\n<td>反查现成方案</td>\n<td>不知道</td>\n<td><strong>最值钱一题</strong>！有需求先说\"元宝GitHub有现成方案吗\"，我反查+3问筛出能用的。真懂=「有需求先想有没有现成的」</td>\n</tr>\n</tbody>\n</table>\n<p><strong>过关判定</strong>：问2全中；问3十题里答对最重要的3题(活性判断/读README/星fork信号)=非程序员最该会的。卡壳的(Q1/Q4/Q6/Q9)多是语法/代码细节，本该交元宝。结论：离真懂只差一个习惯——<strong>有需求先丢给元宝反查</strong>。</p>\n<p><strong>配套</strong>：实跑报告见 <code>../GitHub找高星项目并应用-实跑报告.html</code>（含完整答卷+反馈可视化）。</p>"}, {"title": "AI + 知识库工作台：让知识查自己，而不是只存起来", "source": "抖音 @姜胡说（视频 https://v.douyin.com/95J7t0WqK-g/ ，868秒）", "date": "2026-08-07", "category": "AI与方法", "tags": ["知识库", "PARA", "Obsidian", "AI工作流", "姜胡说", "记忆飞轮"], "relevance": "极高", "monetize": "高", "core": "知识库不是硬盘，而是让 AI 自动读取、连接、反查自己的操作系统；目录按 PARA 分清楚，AI 才知道该去哪找、该干什么。", "body_html": "<h2>原文要点（我提炼）</h2>\n<h3>1. 工具三分工</h3>\n<ul>\n<li><strong>知识库</strong> = 一个目录（本质和硬盘一样，只是目录组织方式不同）。</li>\n<li><strong>Obsidian</strong> = 看知识库的屏幕/浏览器，不是知识库本身；它打开 markdown，在文件之间建立链接。</li>\n<li><strong>AI</strong> = 操作员/读取者；桌面版 AI 可以自动读取目录里的文件，需要时自己去找对应目录。</li>\n</ul>\n<h3>2. 目录结构（PARA + 2 扩展）</h3>\n<table>\n<thead>\n<tr>\n<th>目录</th>\n<th>英文</th>\n<th>含义</th>\n<th>例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>项目</td>\n<td>Projects</td>\n<td>正在做的事</td>\n<td>杭州线下、写一本书</td>\n</tr>\n<tr>\n<td>资产</td>\n<td>Areas</td>\n<td>处理好的、自己的知识</td>\n<td>已写完的文章、提炼的方法论</td>\n</tr>\n<tr>\n<td>资源</td>\n<td>Resources</td>\n<td>外来的、借用的知识</td>\n<td>读书笔记、下载的资料</td>\n</tr>\n<tr>\n<td>归档</td>\n<td>Archives</td>\n<td>暂时用不到、舍不得删</td>\n<td>已完结的项目、过时的资料</td>\n</tr>\n<tr>\n<td>灵感库</td>\n<td>Inbox</td>\n<td>待处理的原材料</td>\n<td>一句话、一个灵感</td>\n</tr>\n<tr>\n<td>技能</td>\n<td>Skills</td>\n<td>处理模板/约定</td>\n<td>口播脚本、文章模板、PPT 模板</td>\n</tr>\n</tbody>\n</table>\n<h3>3. 处理一条知识的闭环</h3>\n<p>书里一句话 → AI 读项目库/资产库 → 与已有知识建立连接 → 选择输出形式：\n- 写成文章 / 口播 / PPT\n- 变成执行动作\n- 变成<strong>待办项</strong>（如\"升级操作系统\"）</p>\n<p>核心：<strong>知识不是用来存的，是用来查自己的。</strong></p>\n<h3>4. 关键示例</h3>\n<p>书中原话：\"再好的软件也装不上低版本的操作系统。\"\n普通人：划线、摘抄、放笔记里吃灰。\n姜胡说：丢进系统 → AI 反问\"是不是我们的知识库版本太低？\" → 得到改进建议 → 变成待办项。</p>\n<hr />\n<h2>① 怎么用</h2>\n<p><strong>立刻能做（不用换工具）：</strong>\n1. <strong>把现有目录按 PARA 重解释一遍</strong>：你已有 <code>categories/</code>、<code>inbox/</code>、<code>商业拆解/</code>、<code>商业认知版图/</code>，不用大改，只需要告诉我每个目录是\"项目/资产/资源/归档/灵感/技能\"中的哪一类。\n2. <strong>让我（元宝）当 AI 操作员</strong>：以后你丢一条内容给我，我先读你的知识库目录，再回答\"这和你之前哪些卡有关\"。\n3. <strong>每次拆解多问一句</strong>：\"这句话是在查我哪个旧习惯/旧认知？\"把知识变成待办项或行动。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- 把 PARA 目录规则写进 <code>knowledge-base/</code> 的 MEMORY 或 Skill，让 AI 每次自动路由。\n- 把\"一句话→查自己→变待办\"做成 <code>idea-capture</code> 的升级版。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>卡 2026-07-25《零基础搭 AI 知识库》</strong>：那条讲\"先上场再懂\"的心态；这条讲具体目录结构+AI 操作员机制，是上一张卡的落地版。</li>\n<li><strong>卡 2026-08-04《清华鑫哥 AI 三件事》</strong>：那条讲 Agent/Skill/记忆飞轮；这条告诉你知识库就是 Agent 的\"记忆载体\"，Skill 就是\"处理模板\"。</li>\n<li><strong>捕获箱 + idea-capture</strong>：你的 <code>inbox/捕获箱.md</code> 就是\"灵感库\"，已经分 📥简报 / 🗺️认知版图两栏，比纯 PARA 更贴合你副业+简报的需求。</li>\n<li><strong>每日简报自动化</strong>：就是\"AI 读资源库→输出文章\"的实例，只是还没让它反查你的资产库。</li>\n<li><strong>记忆飞轮</strong>：每次任务后写的 <code>MEMORY.md</code> 就是\"查自己\"的动作——让 AI 越来越了解你。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<table>\n<thead>\n<tr>\n<th>路径</th>\n<th>说明</th>\n<th>启动难度</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>卖方法论/模板</strong></td>\n<td>把\"AI + PARA 知识库\"做成腾讯文档/Notion 模板，定价 9.9–99 元</td>\n<td>低</td>\n</tr>\n<tr>\n<td><strong>知识星球专栏</strong></td>\n<td>写\"AI 工作流拆解\"系列，你的每日简报就是现成素材</td>\n<td>低</td>\n</tr>\n<tr>\n<td><strong>帮人搭知识库</strong></td>\n<td>用你已跑通的流程帮小白搭 Obsidian/飞书/本地目录，收 199–599</td>\n<td>中</td>\n</tr>\n<tr>\n<td><strong>升级元宝服务</strong></td>\n<td>把\"AI 自动读知识库并反查\"做成 Skill，提升你一人公司交付效率</td>\n<td>中</td>\n</tr>\n<tr>\n<td><strong>内容产品化</strong></td>\n<td>把这条视频拆成小红书/抖音脚本，引流到星球</td>\n<td>低</td>\n</tr>\n</tbody>\n</table>\n<p><strong>结论</strong>：变现潜力高，且全部建立在你已有的 <code>knowledge-base/</code> 和简报体系上，启动成本≈0。</p>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ol>\n<li><strong>给知识库加一条 PARA 标签规则</strong>：在每张卡 frontmatter 里加 <code>para:</code> 字段（项目/资产/资源/归档/灵感/技能）。</li>\n<li><strong>升级 idea-capture</strong>：捕获一条灵感后，元宝自动追问\"它查出了你哪个旧认知？\"，生成待办项。</li>\n<li><strong>做一个\"反查自己\"提示词模板</strong>：每次读书/看视频，都问\"根据上野的目标和卡点，这条知识在查我什么？\"</li>\n<li><strong>把每日简报接入资产库</strong>：简报生成前，先读一遍 <code>categories/</code> 里的相关卡，让输出更贴合你的风格。</li>\n<li><strong>知识库网页版加搜索</strong>：现有 <code>kb.html</code> 可升级，加 PARA 过滤 + \"与我相关\"排序。</li>\n</ol>\n<hr />\n<h2>附：上野现有目录的 PARA 映射（可直接用）</h2>\n<table>\n<thead>\n<tr>\n<th>你的现有目录</th>\n<th>PARA 角色</th>\n<th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>knowledge-base/categories/创业与变现/</code></td>\n<td><strong>资产</strong></td>\n<td>已处理好的赚钱方法论</td>\n</tr>\n<tr>\n<td><code>knowledge-base/categories/AI与方法/</code></td>\n<td><strong>资产</strong></td>\n<td>已提炼的 AI 工作流</td>\n</tr>\n<tr>\n<td><code>knowledge-base/categories/个人成长/</code></td>\n<td><strong>资产</strong></td>\n<td>销售、认知等可复用技能</td>\n</tr>\n<tr>\n<td><code>knowledge-base/categories/行业与趋势/</code></td>\n<td><strong>资源</strong></td>\n<td>外来观察、待沉淀</td>\n</tr>\n<tr>\n<td><code>knowledge-base/categories/技术与工具/</code></td>\n<td><strong>资产+技能</strong></td>\n<td>工具用法 + 可复用 SOP</td>\n</tr>\n<tr>\n<td><code>knowledge-base/inbox/捕获箱.md</code></td>\n<td><strong>灵感库</strong></td>\n<td>待处理的原材料</td>\n</tr>\n<tr>\n<td><code>knowledge-base/商业拆解/</code></td>\n<td><strong>资产</strong></td>\n<td>深度处理后的商业认知</td>\n</tr>\n<tr>\n<td><code>knowledge-base/商业认知版图/index.md</code></td>\n<td><strong>资产+项目</strong></td>\n<td>认知聚合 + 待办延伸</td>\n</tr>\n<tr>\n<td><code>~/.workbuddy/skills/</code></td>\n<td><strong>技能</strong></td>\n<td>原子化处理模板</td>\n</tr>\n<tr>\n<td><code>~/.workbuddy/MEMORY.md</code></td>\n<td><strong>资产</strong></td>\n<td>上野的长期记忆/操作系统</td>\n</tr>\n<tr>\n<td><code>downloads/</code> 里的原始视频/转写</td>\n<td><strong>资源</strong></td>\n<td>外来原材料</td>\n</tr>\n<tr>\n<td>已完成项目的旧文件</td>\n<td><strong>归档</strong></td>\n<td>暂时不用但舍不得删</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>核心动作：以后丢给元宝任何内容，先让它判断\"这是 P/A/R/A/灵感/技能 里的哪一类\"，再决定放哪、连哪、变成什么待办。</p>\n</blockquote>"}, {"title": "成人舞蹈是\"心理代偿市场\"：体验型生意的操盘逻辑", "source": "抖音 @老贾讲营销心理学（视频 5 分 17 秒）· https://v.douyin.com/YibPErd8q3s/", "date": "2026-07-28", "category": "创业与变现", "tags": ["营销心理学", "体验经济", "心理代偿", "第三空间", "副业观察"], "relevance": "高", "monetize": "高（框架值钱、可迁移；⚠️但直接开实体店不符你\"零成本\"标准，卖框架/接单才是你的路）", "core": "成人舞蹈卖的不是技术，是\"肉体自恋+社交疗愈\"——把教室改成\"情绪美容院\"，用视觉、社群、降门槛让人上瘾复购。", "body_html": "<h2>原文要点（我提炼，不是全文）</h2>\n<ul>\n<li>核心判断：成人舞蹈培训的本质<strong>不是艺术，而是一场关于肉体自恋与社交疗愈的现代救赎</strong>，是一个正在兴起的巨大\"心理代偿市场\"。人愿为<strong>情绪价值、社交链接、自我重塑</strong>买单。</li>\n<li>作者给了一套\"生存法则\"，分三块 + 三个操盘逻辑 + 破局三步：</li>\n<li><strong>价值错配</strong>：你卖的舞蹈技术，在成年人世界里\"一灯不亮\"。交易本质是<strong>虚荣心+陪伴感+自我取悦</strong>的综合交易（类比买化妆品买的是\"被爱/年轻的希望\"，不是那瓶液体）。白领取爵士舞买的是\"镜子里的自己怎么这么好看\"的心理暗示。→ 舞蹈室物理是教室，<strong>体验上必须是\"情绪美容院\"</strong>；老师不是冷酷评委，是高情商情绪价值提供者，课上多说\"太棒了、这个眼神绝了\"，少说\"你又错了\"。</li>\n<li><strong>体验设计（技术交付→戏剧体验）</strong>：脑科学——人易受视觉/环境暗示（环境锚定情绪）。传统白日光灯+斑驳墙=简陋。要把每节课设计成<strong>微型舞台剧</strong>：暖色舞台感射灯；课后最后 10 分钟做成 <strong>show time</strong>，老师用手持稳定器+滤镜像拍 MV 一样记录每个人。动作标不标准无所谓，逆光+滤镜下他就是\"女主角\"。学员发朋友圈收获赞和\"你太美了\"，这张卡在他心理账簿上<strong>价值翻 10 倍</strong>，必复购。</li>\n<li><strong>落地打法（三个操盘逻辑）</strong>：<ul>\n<li>逻辑一：重新定义交易本质（虚荣心/陪伴/自我取悦，见上）。</li>\n<li>逻辑二：视觉升级（灯光+show time+MV 精修，见上）。</li>\n<li>逻辑三：<strong>重组社交矩阵对抗惰性</strong>。靠个人自律对抗懒惰必败，唯一解法是<strong>群体效应+社交绑定</strong>。建\"兴趣部落\"微信社群，每周评\"打卡之星\"、办\"复古红唇之夜/纯白芭蕾派对\"主题沙龙，让学员结交闺蜜。舞蹈室成了<strong>家和办公室之外的\"第三空间\"</strong>——沉淀的社交关系与情感资产，对手便宜 10 块的体验课根本挖不走。</li>\n</ul>\n</li>\n<li><strong>破局三步法</strong>：① 改造物理空间——弃惨白 LED，改多色温射灯+侧光逆光，让微胖女孩显瘦，镜子倾斜 1–2 度拉长腿比例；② 重训老师——KPI 从\"上了几节课\"改成\"<strong>课后视频分享率+体验课转化率</strong>\"，课后 30 分钟内私发精修视频+针对闪光点的真诚赞美；③ 降低门槛——大课拆成\"零基础保姆班/三节课学会一支成品舞\"，先让成人尝到\"跳成一首歌\"的快乐，才愿为高价私教课消费。</li>\n</ul>\n<hr />\n<h2>① 怎么用</h2>\n<p><strong>现在马上能做：</strong>\n1. 任何\"体验型\"副业（舞蹈/健身/书法/咖啡馆/手工/宠物社交），把定位从\"教技术\"改成\"卖自我迷恋+社交\"——这是这条最值钱的一转。\n2. 落地三招可直接抄：灯光改暖色射灯+逆光显瘦；<strong>课后 30 分钟内私发精修视频+真诚赞美</strong>；社群做\"打卡之星/主题沙龙\"建第三空间。\n3. 把交付者（老师/你）的 KPI 从\"交付次数\"改成\"分享率+转化率\"——这一改，生意逻辑就变了。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- 固化成<strong>「体验型生意拆解框架」</strong>：价值错配 → 体验设计 → 社交绑定 → 降门槛。可复用于一切线下体验业态。\n- 做成 mini-app<strong>「体验生意体检表」</strong>：输入你的生意，自动诊断卡在四步哪一步。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>上一条「挠痒痒营销法」（卡 7）</strong>：一条在<strong>文案层</strong>（怎么写让人惦记的 6 式痒点），这条在<strong>生意层</strong>（怎么把店开成让人上瘾）。两者互补，合起来是\"引流+留客\"双杀。</li>\n<li><strong>副业红线检查器</strong>：舞蹈培训是<strong>实体/重服务</strong>，需场地+老师，和你\"零成本启动\"标准冲突——这张卡定位为「观察学习」，不是让你下场开店。</li>\n<li><strong>mini-apps</strong>：可做「体验生意体检表」小工具（已有 10 个小应用基础）。</li>\n<li><strong>抖音文案提取链路 / 每日简报 / 知识星球</strong>：可作为\"心理代偿市场\"赛道洞察内容。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li><strong>路径 A（卖洞察/咨询）</strong>：把\"体验型生意拆解框架\"做成付费帖/小册子，或给实体店做诊断咨询（按次收费）。</li>\n<li><strong>路径 B（接单代运营）</strong>：你不必自己开店——用这套框架接\"实体店抖音引流脚本/社群运营话术/体验设计顾问\"的单子，卖脑力不卖场地。</li>\n<li><strong>路径 C（产品化）</strong>：「体验生意体检表」mini-app 引流到星球/简报。</li>\n<li><strong>结论</strong>：潜力<strong>高</strong>，但分两层——① 框架本身值钱、可迁移（高）；② 对你个人的直接变现偏间接（卖框架/接单/内容），且<strong>直接开店不符零成本原则</strong>。所以对你而言最稳的路是\"卖框架+接单\"，不是下场。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>做<strong>「体验生意体检表」mini-app</strong>（输入业态→诊断价值错配/体验/社交/门槛四步），挂导航页引流。</li>\n<li><strong>跨行业映射</strong>：把\"心理代偿/第三空间/课后精修视频\"迁移到健身、书法、插花、剧本杀、宠物社交——同一套\"卖情绪不卖技术\"。</li>\n<li>和卡 7 合一张<strong>「营销双杀：文案痒点 + 体验上瘾」</strong>总卡，作为创业与变现板块的入门钩子。</li>\n<li>反脆弱：把\"实体重服务 ≠ 零成本副业\"补进<strong>副业红线检查器</strong>，作为\"重资产陷阱\"提醒，防止冲动投入。</li>\n</ul>"}, {"title": "马师傅\"挠痒痒\"营销法：用「痒点」让人惦记你的产品", "source": "抖音 @配叫一声马师傅（视频 10 分 38 秒）· https://v.douyin.com/jkZJQ3ZMgPw/", "date": "2026-07-27", "category": "创业与变现", "tags": ["营销", "文案", "创意", "痒点", "销售话术"], "relevance": "高", "monetize": "高", "core": "别只盯痛点（伤口）和爽点（止痛片），真正值钱的是「痒点」——伤口四周的皮肤，不逼单、不降价，就让你一直惦记。", "body_html": "<h2>原文要点（我提炼，不是全文）</h2>\n<ul>\n<li>营销三要素重新定义：<strong>痛点=伤口，爽点=止痛片，痒点=伤口四周的皮肤</strong>。痒点不催促、不打折，只让人\"分心、惦记、崩溃\"，是最贵的购买欲。</li>\n<li>作者给出 6 个制造\"痒点\"的\"式\"（套路），可直接套去改标题、卖点、详情页、销售话术：</li>\n<li><strong>差一点儿</strong>：人最惦记\"快要拥有\"。不说\"教你从0到1\"，改说\"你有一条视频有过300播放，只是没接住\"；英语课不说\"每天15分钟提升\"，改说\"你有底子，只是没机会开口\"。变体\"差一点儿+后果\"：7000人加购、3000库存，错过会难受。</li>\n<li><strong>欲拥有感（彩排拥有）</strong>：先别介绍产品，先在用户心里排练\"如果是我会怎样\"。100万手表\"他们会等你\"；咖啡机\"一个台面就是一家咖啡馆\"；扫地机器人\"回家推开门地是干净的，今天至少一件事顺心\"。秘诀：产品只是道具，用户才是主演。</li>\n<li><strong>身份痒</strong>：你买的不是东西，是\"我像谁\"。西服=不易被忽略的人（5000块平摊每天2.7块买自信）；硬派越野=随时能走的选择权；小众香水=经过时\"不像空气\"。本质：人买的是\"高级版本的自己\"。</li>\n<li><strong>神秘痒</strong>：越遮掩越想要。评论\"因内容敏感已折叠，点击查看\"；香水\"不建议在初次见面时试这个\"比任何描述都勾人；香奈儿5号\"睡觉时只穿香奈儿5号\"。</li>\n<li>（口播逐字稿此处 ASR 有断点，作者列到第六式，第五式疑似在\"神秘\"与\"亏欠\"之间被吞，待复核原片补全）</li>\n<li><strong>亏欠痒</strong>：不是\"我想要\"，而是\"觉得该补偿\"。儿童学习桌\"孩子每天写两三个小时，你给他买最亮的台灯最贵的笔，他却弯着腰独自承受\"→\"先做直再做题\"；宠物粮\"他一生见过的世界可能就是你家楼下和你\"。⚠️慎用：用好了是温柔提醒，用过是道德绑架。</li>\n</ul>\n<hr />\n<h2>① 怎么用</h2>\n<p><strong>现在马上能做：</strong>\n1. 写任何卖点/详情页/带货脚本前，先套这 6 式各写一版，挑最痒的那句当标题。\n2. 短视频开头用\"差一点儿\"钩子替代\"从0到1\"套路（用户对后者已免疫）。\n3. 详情页第一段只写\"欲拥有感\"场景，参数往后放——先让用户在心里彩排拥有。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- 把\"6式\"固化成<strong>文案改写提示词</strong>（输入产品→输出6式卖点），复用给所有项目。\n- 做成<strong>「痒点文案生成器」mini-app</strong>：输入产品名/卖点，一键生成6式标题+详情页。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>抖音文案提取指引 / video-downloader</strong>：正是这条卡的来源链路——丢抖音链接→提发布文案+口播逐字稿→蒸馏成卡。闭环验证无误。</li>\n<li><strong>mini-apps</strong>：可产品化为「痒点文案生成器」小工具（你已有 10 个网页小应用基础）。</li>\n<li><strong>每日 AI 热点简报</strong>：营销/文案类抖音号可成为简报素材源，丰富\"创业与变现\"主题。</li>\n<li><strong>GitHub</strong>：文案生成器可开源（你已配 SSH 免密），也是引流入口。</li>\n<li><strong>知识星球</strong>：6式拆解可作付费内容（星球 158584248182 当前免费引流）。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li><strong>路径 A（卖模板/知识）</strong>：把\"6式+案例库\"做成小册子/付费帖，发知识星球或小红书引流。</li>\n<li><strong>路径 B（接单交付）</strong>：帮抖音小商家/带货号改写详情页、写带货脚本，按条收费（文案改写是刚需、门槛低）。</li>\n<li><strong>路径 C（产品化）</strong>：「痒点文案生成器」mini-app 接广告或引流到星球/简报。</li>\n<li><strong>结论</strong>：潜力<strong>高</strong>。营销是永恒需求，文案改写零成本、可复用、可产品化，完美契合你\"零成本启动、可验证、低风险\"的副业标准。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>做「痒点文案生成器」mini-app（输入产品→6式卖点），直接挂你游戏合集/导航页引流。</li>\n<li>结合 LLM 自动化：写个工作流，给一条产品自动跑\"6式改写\"，批量产出带货脚本。</li>\n<li>补一张对比卡：<strong>痒点 vs 痛点 vs 爽点</strong> 一张图讲清，作为营销入门钩子。</li>\n<li>反脆弱提醒：把\"亏欠痒慎用\"补进你的「副业红线检查器」，避免踩道德绑架的坑。</li>\n</ul>"}, {"title": "零基础搭 AI 知识库，四步闭环越用越聪明", "source": "抖音 @姜胡说（视频链接 https://v.douyin.com/MDxC1r46FH8/ ，用户提供字幕）", "date": "2026-07-25", "category": "AI与方法", "tags": ["知识管理", "AI学习", "零基础", "个人成长", "姜胡说"], "relevance": "高", "monetize": "高", "core": "别用「准备」逃避开始——先上场，把看到的好内容直接喂给 AI，让它替你分「现在用 / 未来用」，每天复盘，越用越聪明。", "body_html": "<h2>原文要点（我提炼）</h2>\n<ol>\n<li><strong>第一步 工具准备</strong>：用 WorkBuddy + CodeBuddy（视频里叫 Workbody / Coder Work），免费、每天送积分，拿来即用，不配环境、不纠结 Cloud Code / Codex。</li>\n<li><strong>第二步 建档案</strong>：告诉 AI「你是谁、干嘛的、优点、缺点、目标、卡点」，把它当几十万的咨询顾问，让它记住你，以后给你建议、方法、朝目标推。</li>\n<li><strong>第三步 喂内容</strong>：看到好文章直接复制给 AI；好视频/音频给链接。问它「根据我的情况，这知识怎么用」——它列「现在马上能用的一二三」和「未来能用的知识块」。</li>\n<li><strong>第四步 每天复盘</strong>：用了之后说「我现在这么用，结果是这样，你复盘下，告诉我怎么改进」。每天做，几天就和别人不一样。</li>\n<li><strong>核心心智</strong>：很多人学傻了，非要「学会再用」；正确是「先上场，一边学一边用，甚至不必懂，先帅起来」。</li>\n</ol>\n<hr />\n<h2>① 怎么用</h2>\n<p><strong>现在马上能做：</strong>\n1. <strong>补一份「目标 + 卡点」档案</strong>：我已知你是上野（上海 / 关注 AI·创业·信息差），但视频法强调主动让 AI 当顾问。你下条消息补一句「我的目标 XX、卡点 XX」，我记进长期记忆。\n2. <strong>把「喂内容→问怎么用」固化</strong>：本知识库就是这个动作的产品化——你贴内容，我出四问卡。\n3. <strong>每天复盘接进现有简报</strong>：你已有「每日 AI 热点简报自动化」，我在简报末尾加一段「今日可落地的 1 个动作 + 复盘提问」，闭环就成了。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- 「先上场再学」心态，可作为你所有内容产品的统一方法论标签。\n- 「知识块」概念 → 以后每条卡都能被检索、被二次组合成文章/课。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>每日 AI 热点简报</strong>：现成的「喂内容」管道，每天已有 AI 资讯流入；只差补「复盘 + 怎么用」两环，正好和本知识库合并成一条流水线。</li>\n<li><strong>mini-apps / mini-games</strong>：可直接做一个「个人知识库」网页应用（卡片 + 标签 + 搜索 + 移动端），这是顺手的开发项目，也能当 demo 接单。</li>\n<li><strong>GitHub SSH 免密</strong>：知识库可版本化备份到新仓库（或并入 web-games 仓库），防丢、可公开当作品集。</li>\n<li><strong>元宝变现意图</strong>：这条本身就是「用元宝当低成本虚拟员工」的最佳示范案例。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li><strong>路径 A（卖方法论）</strong>：把「四步闭环」包装成小报童专栏 / 知识星球 / 短视频系列，你已是案例，自带信任。</li>\n<li><strong>路径 B（卖工具/模板）</strong>：做「个人 AI 知识库」网页模板或 Notion/腾讯文档模板，按订阅或一次性卖。</li>\n<li><strong>路径 C（接单）</strong>：帮小白搭「自己的 AI 知识库 + 顾问档案」，你用自己跑通的流程交付，客单价低但可批量。</li>\n<li><strong>路径 D（信息差产品）</strong>：每日简报 + 知识库筛选 → 付费「AI 机会日报」，你已有自动化底座。</li>\n<li><strong>结论</strong>：<strong>变现潜力高</strong>。方法轻、可复制、和你已有资产（简报/游戏/SSH）100% 咬合，启动成本≈0。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>把知识库做成<strong>手机 HTML 浏览器</strong>（搜索+标签），你手机上看更爽，也能当产品卖。</li>\n<li>做一个<strong>「喂我一条，出一张卡」的小工具</strong>，朋友圈/社群引流用。</li>\n<li>四步法 → 拍成你自己的短视频，反哺「姜胡说」这类流量池，做个人 IP。</li>\n</ul>"}, {"title": "撸店铺保证金能发财？小心坐牢（黑灰产揭秘·反例卡）", "source": "抖音 @未知（链接 https://v.douyin.com/oBSG7vARkjw/ ，标题+标签由用户提供，暂无逐字稿）", "date": "2026-07-25", "category": "个人成长", "tags": ["踩坑警示", "黑灰产揭秘", "合规红线", "变现避坑", "认知", "捞偏门"], "relevance": "中", "monetize": "低（作为「方法」本身违法不可行；作为「揭秘内容」可中）", "core": "所有「撸平台/撸保证金/撸漏洞」的偏门，本质多是诈骗或非法经营，轻则封号冻款，重则坐牢——它是「绝不能碰的红线」，不是「能发财的路子」。", "body_html": "<h2>原文要点（据标题+标签推断，待补逐字稿）</h2>\n<ul>\n<li>主题：拆解「撸电商店铺保证金」类偏门玩法的真实风险，标题直接点出「小心坐牢」。</li>\n<li>标签含 #捞偏门 #赚钱 #黑灰产揭秘 —— 属于「揭秘/劝退」向内容，不是教学。</li>\n<li>「撸店铺保证金」通常指利用平台保证金（如淘宝/拼多多/抖音小店缴纳的押金）的退款或规则漏洞套现，往往涉及虚假交易、伪造材料、恶意投诉等行为。</li>\n</ul>\n<blockquote>\n<p>⚠️ 说明：本条仅依据用户给的标题与标签生成，我未拿到视频逐字稿。如你贴出文案/字幕，我可补全「具体手法 + 对应法条 + 判罚案例」，让这张卡更扎实。</p>\n</blockquote>\n<hr />\n<h2>① 怎么用</h2>\n<p><strong>现在马上能做：</strong>\n1. <strong>当成红线清单</strong>：把「撸平台/撸保证金/撸漏洞/刷单/跑分/接码」这类词加入你的「副业黑名单」。以后任何副业 idea 一旦沾这些词，直接 pass，不浪费时间评估。\n2. <strong>建一个「合规自检」小问题</strong>，贴在你每天的副业思考里：「这事儿合法吗？平台允许吗？要我伪造/欺骗吗？」三问任一为否，就不做。\n3. <strong>当内容素材</strong>：「黑灰产揭秘」本身是个能吸流量的内容赛道（你标题里的标签就是证明），可反向做成你未来账号的「避坑科普」系列。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- 「偏门→违法」映射表：撸保证金/刷单/跑分/接码/搬砖套利 各自对应的法律风险，攒多了就是一篇「副业避坑手册」。\n- 「合规自检三问」模板，复用到所有副业评估。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>每日 AI 热点简报</strong>：可加一个「副业风险」栏目，顺手把当天看到的黑灰产/割韭菜套路标记出来，既是内容也是自我保护。</li>\n<li><strong>一人公司 / 副业探索</strong>：这是你「不想踩坑」约束的最硬核注脚——用真实法律风险给所有副业想法做第一道筛子，省下大量试错成本。</li>\n<li><strong>知识库本身</strong>：应在分类里长期保留「踩坑警示」子标签，让反例和正例并列，知识库才有「避坑」功能，而不只是「找机会」。</li>\n<li><strong>mini-apps / 内容账号</strong>：可做一个「这个副业 idea 踩红线了吗」小工具/互动帖，引流到你未来账号。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li><strong>路径 A（照搬方法）</strong>：❌ 不可行。视频本身就在警告「小心坐牢」，这类玩法多为诈骗/非法经营，封号冻款是轻的，刑责是实的。与你「零风险、不踩坑」底线直接冲突，坚决不做。</li>\n<li><strong>路径 B（揭秘内容变现）</strong>：✅ 可行且低风险。把「黑灰产揭秘/副业避坑」做成短视频或图文，吃的是「认知差+猎奇+避险」流量，可接广告、带货合规工具、沉淀私域。启动成本≈0，契合你一人公司方向。</li>\n<li><strong>结论</strong>：作为「方法」变现潜力=低（违法）；作为「内容素材」变现潜力=中。这张卡对你最大的钱，是<strong>帮你少亏一笔钱、少冒一次险</strong>，以及提供一条合规的内容赛道。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ul>\n<li><strong>「副业红线」检查器</strong>：一个网页小工具，输入副业想法，自动比对黑名单词库+合规三问，输出「高危/注意/可行」——可挂你 GitHub Pages，引流用。</li>\n<li><strong>「黑灰产揭秘」内容系列</strong>：按「手法→风险→真实案例→正确做法」四段式，做成你账号的常青栏目，反哺流量池。</li>\n<li><strong>知识库升级</strong>：在 index.md 统计里加「踩坑警示 N 条」维度，让反例可视、可检索，知识库从「找机会」进化成「机会+避坑」双引擎。</li>\n</ul>"}, {"title": "仓颉 Skill（cangjie-skill）解析：把内容蒸馏成可调用技能", "source": "GitHub `kangarooking/cangjie-skill`（作者「袋鼠帝」，MIT 协议，1.3K Star）+ 成品仓库 `kangarooking/kangarooking-skills`", "date": "", "category": "AI与方法", "tags": [], "relevance": "高", "monetize": "高", "core": "", "body_html": "<h2>一句话核心</h2>\n<p>cangjie-skill 是一个「内容蒸馏器」：把书、长视频、播客转写成一组<strong>可调用 Agent Skills（方法论单元）</strong>，而不是写一篇摘要。本质是「把看过的东西，变成能一句话调出来的工具箱」。</p>\n<h2>原文要点（已抓 GitHub 仓库分析）</h2>\n<ul>\n<li><strong>仓库结构</strong>：<code>SKILL.md</code>（元 skill 执行规范）+ <code>methodology/</code>（RIA-TV++ 各阶段）+ <code>extractors/</code>（5 个并行提取器 prompt）+ <code>templates/</code>（SKILL.md/INDEX.md/BOOK_OVERVIEW.md 模板）。协议 MIT，可商用复用。</li>\n<li><strong>核心流水线 RIA-TV++（七阶段）</strong>：</li>\n<li>整体理解（Adler 分析阅读法）→ <code>BOOK_OVERVIEW.md</code></li>\n<li>并行提取（框架/原则/案例/反例/术语 5 路）</li>\n<li>三重验证筛选（≥2 处佐证 / 有预测力 / 非常识，通过率仅 25-50%）</li>\n<li>RIA++ 构造（R 原文/I 重写/A1 案例/A2 触发场景/E 可执行步骤/B 边界盲点）</li>\n<li>Zettelkasten 链接 → <code>INDEX.md</code></li>\n<li>压力测试（诱饵题 + 跨 skill 混淆）→ <code>test-prompts.json</code></li>\n<li>交付（安装到 Claude Code / Codex 的 skills 目录）</li>\n<li><strong>视频蒸馏</strong>：需先借 <code>video-downloader</code> skill 把视频转成文本（下载+字幕/ASR），再喂给 cangjie-skill。</li>\n<li><strong>关键发现</strong>：<code>kangarooking-skills</code> 里的 <code>video-downloader</code> <strong>支持抖音、B站、YouTube、小红书</strong>，可同时提取「平台原始文案」+「ASR 口播稿」——这正是补上你昨天问的「抖音链接读不到口播稿」痛点的现成方案。</li>\n</ul>\n<h2>① 怎么用（落到你的知识库）</h2>\n<ul>\n<li><strong>升级出卡流程</strong>：把「喂内容→四问卡」升级为「喂内容→蒸馏成 skill」。同一段素材，既存知识（卡），又沉淀方法（skill），知识库从「笔记本」进化成「工具箱」。</li>\n<li><strong>直接解决抖音提取</strong>：把 <code>video-downloader</code> 的思路接进知识库喂料管道（抖音链接→原始文案+口播稿→出卡/蒸馏）。注意它本地需要 <code>yt-dlp</code> + ASR（Whisper 或免费 API），属进阶项，先评估再上。</li>\n<li><strong>变成我的能力</strong>：我（元宝）本就支持 Skill 系统（SKILL.md）。可把 RIA-TV++ 蒸馏法蒸馏成我自己的「内容蒸馏」skill，以后你丢书/视频/播客，我自动走七阶段出 skill——这是本条最实在的落地。</li>\n</ul>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li><strong>知识库（强相关）</strong>：蒸馏 = 知识库的终极形态；你已有的「四问卡」是轻量蒸馏，cangjie-skill 是工业化蒸馏。</li>\n<li><strong>元宝 Skill 系统（强相关）</strong>：格式兼容（均 SKILL.md + 开放标准 agentskills.io），可把成品 skill 直接装进我的技能库复用。</li>\n<li><strong>视频蒸馏成 Skill 卡（上一条，强相关）</strong>：本条是那条的方法论源代码。</li>\n<li><strong>抖音文案提取指引卡（强相关）</strong>：<code>video-downloader</code> 就是该卡「方式 B/C」的现成实现。</li>\n<li><strong>红线检查器 / 每日简报</strong>：蒸馏出的「副业/起号」类 skill 可组合成「一人公司工具箱」卖。</li>\n</ul>\n<h2>③ 能不能挣钱</h2>\n<ul>\n<li><strong>路径 A</strong>：卖蒸馏服务——帮人把书/课/播客蒸馏成 skill 包，按本/小时收费，成本≈0（吃 AI 能力）。</li>\n<li><strong>路径 B</strong>：卖成品 skill 包——作者已蒸馏出《爆款文案》《影响力》《疯传》巴菲特信等，你可二创/汉化/本地化后挂小报童/知识星球。</li>\n<li><strong>路径 C</strong>：教蒸馏方法——短视频/图文「如何把书变成工具箱」，吃认知差。</li>\n<li><strong>路径 D</strong>：知识库 + 蒸馏组合包——你的浏览器 + 红线检查器 + 蒸馏 skill，打包「一人公司工具箱」。</li>\n<li><strong>结论</strong>：变现潜力高，启动成本≈0，且与你已有资产直接复用。MIT 协议允许商用，注意保留署名。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li><strong>做成我的「内容蒸馏」Skill</strong>（本次可落地）：把 RIA-TV++ 蒸馏成我自己的 skill，你丢内容我自动出 skill 包。</li>\n<li><strong>video-downloader 接进喂料管道</strong>：抖音链接一键出原文+口播稿，直接喂知识库。</li>\n<li><strong>「书/视频→技能包」服务产品</strong>：对小白是刚需，可做标准化交付。</li>\n</ul>\n<h2>⚠️ 合规与边界</h2>\n<ul>\n<li><code>video-downloader</code> 涉及平台视频下载，注意版权与平台 ToS；仅用于<strong>你自己有权限</strong>的内容。</li>\n<li>复用成品 skill 包注意 MIT 署名要求；二创/商用保留原作者信息。</li>\n<li>与红线检查器一致：不碰他人私密/侵权内容。</li>\n</ul>"}, {"title": "视频蒸馏成 Skill：把任何视频变成可复用工作流", "source": "抖音（链接 https://v.douyin.com/y2ZC1Y1GV5A/ ，作者「开源仓颉」）", "date": "", "category": "AI与方法", "tags": [], "relevance": "高", "monetize": "高", "core": "", "body_html": "<h2>一句话核心</h2>\n<p>「蒸馏」= 把一段视频/一堆资料的<strong>隐性经验，抽成可复用的标准化步骤（Skill/工作流）</strong>。你不用自己摸索，把爆款案例喂给 AI，让它吐出「照着做就能复现」的 SOP。</p>\n<h2>原文要点（据标题+描述推断，待补逐字稿）</h2>\n<ul>\n<li>主题：开源一个「仓颉.Skill」，能把任意视频蒸馏成 skill。</li>\n<li>示范案例：基于某平台「起号」的大量视频资料，蒸馏出一个「起号 skill」，用于冷启动。</li>\n<li>定位：#开源 #拆书 #蒸馏 #玩儿个很新的东西——属于「方法论开源 + AI 提效」向。</li>\n<li>本质：把「看别人怎么做的」变成「我也能按步骤做」的资产。</li>\n</ul>\n<h2>① 怎么用</h2>\n<ul>\n<li><strong>现在就用</strong>：遇到爆款视频/干货长文，别只收藏——让 AI 蒸馏成「步骤清单 + 关键动作 + 避坑点」，存成知识卡或 skill，下次直接调用。</li>\n<li><strong>贴合你的知识库</strong>：你已经有「喂内容→出四问卡」的管道，再往前一步就是「出 skill」——同一段素材，既存知识、又沉淀方法。</li>\n<li><strong>给元宝用</strong>：我本身支持 Skill 系统，你给我一段视频/系列资料，我可蒸馏成一个可复用 skill（如「X 起号 skill」），以后一句话触发。</li>\n</ul>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li><strong>知识库（强相关）</strong>：知识库的「喂内容→四问卡」本质是轻量蒸馏；本条把它升级成「蒸馏→Skill」，从「记下来」进化到「能复用」。</li>\n<li><strong>元宝变现意图（强相关）</strong>：把蒸馏出的 skill 当「低成本虚拟员工的能力模块」——接单帮别人把资料变 SOP、卖 skill 模板。</li>\n<li><strong>每日 AI 简报</strong>：可加「今日可蒸馏素材」栏目，标记值得抽成 skill 的爆款。</li>\n<li><strong>一人公司</strong>：蒸馏是把「信息差」变成「可执行资产」的核心动作，正合你「零成本、可验证」的路线。</li>\n</ul>\n<h2>③ 能不能挣钱</h2>\n<ul>\n<li><strong>路径 A</strong>：卖「蒸馏服务」——帮小白/商家把他们的爆款资料抽成 SOP，按次收费，成本≈0。</li>\n<li><strong>路径 B</strong>：卖「skill 模板」——起号、带货、剪视频等常见场景的通用 skill，挂小报童/知识星球。</li>\n<li><strong>路径 C</strong>：教「蒸馏方法」——做成短视频/图文「如何把视频变印钞机」，吃认知差流量。</li>\n<li><strong>路径 D</strong>：知识库 + skill 组合包——你的知识库浏览器 + 红线检查器 + 蒸馏 skill，打包成「一人公司工具箱」卖。</li>\n<li><strong>结论</strong>：变现潜力高，启动成本≈0，且与你已有资产（知识库、工具、简报）直接复用。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li><strong>做「视频→知识卡」自动蒸馏器</strong>：输入抖音/小红书链接，自动出四问卡 + 可选 skill，直接进知识库——把本条方法产品化，当引流钩子。</li>\n<li><strong>把本条本身蒸馏成一个 skill</strong>：「如何把视频蒸馏成 skill」的标准流程，存进我的技能库，以后你丢视频我自动走流程。</li>\n<li><strong>知识库升级「Skill 仓库」分区</strong>：卡片之外新增可复用方法库，让知识库从「笔记本」变「工具箱」。</li>\n</ul>\n<blockquote>\n<p>⚠️ 本条仅据标题+描述生成，无逐字稿。你若把视频文案/字幕贴给我，我可补全「蒸馏的具体操作步骤 + 仓颉.Skill 的用法 + 起号 skill 的真实结构」，卡更扎实，也能直接蒸馏成可用的 skill。</p>\n</blockquote>"}, {"title": "卡17 · AI时代立刻做三件事攒复利（停用chatbot→agent+100 Skill+记忆飞轮）", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<blockquote>\n<p>一级分类：AI与方法｜项目关联度：极高｜变现潜力：高（间接杠杆）\n来源：抖音「清华鑫哥讲AI智能体」4分13秒口播（#豆包 #deepseek #agent #agentskill #AI记忆）\n一句话核心：<strong>别把AI当\"聊天工具\"用了——立刻迁移到\"能控制电脑的超级智能体 + 自己攒的100个细颗粒Skill + 会越用越懂你的记忆系统\"三件套，靠记忆飞轮攒复利。巧的是，你（上野）已经在用WorkBuddy做这三件，本卡价值=验证方向对 + 指出还差哪块 + 给升级清单。</strong></p>\n</blockquote>\n<h2>① 怎么用（落到你的一人公司 / 副业，含对标差距）</h2>\n<p>清华鑫哥的三件事，逐条翻译成你<strong>已经在做 / 还差哪块</strong>：</p>\n<ol>\n<li><strong>停用\"上一代chatbot\"，上超级智能体（agentic）</strong></li>\n<li>他的理由：豆包记忆不透明（自动记的不展示、不可审查修改）、网页版DeepSeek根本没记忆，每次复杂任务都要重灌提示词→浪费时间。该用<strong>能直接控制电脑、读写改本地文件、内置MCP的agent</strong>（他点名 Codex、Claude Code，<strong>原话把\"work buddy/workbuildinging\"列为国内同类</strong>——即你正在用的 WorkBuddy）。</li>\n<li><strong>你的现状</strong>：✅ 已经在用 WorkBuddy（被点名背书的工具），而且是 agentic 用法（读文件/跑命令/调Skill/改知识库），不是 chatbot 式问答。这一步你<strong>领先大多数观众</strong>。</li>\n<li>\n<p><strong>严谨补刀</strong>：他\"建议停用豆包/DeepSeek\"偏标题党——他自己也说\"deps很强、豆包母公司人才密度高\"。辩证看：日常轻量问答/写文案仍可用它们，<strong>关键是别把它们当\"你的AI操作系统\"</strong>，真正的个人资产要落在 agentic 工作流+Skill+记忆上（豆包/DeepSeek的对话记忆流失了就是白用）。</p>\n</li>\n<li>\n<p><strong>疯狂建属于你自己的100个Skill（颗粒度要细）</strong></p>\n</li>\n<li>他的逻辑：把工作/生活里的独特流程蒸馏成 Skill，<strong>一件小事一个 Skill</strong>（所以累计大几十到100个）；不怕上下文爆炸，因为有\"渐进加载机制\"——每个 Skill 只注入元数据（名字+触发条件），不注入全文。</li>\n<li><strong>你的现状</strong>：✅ 已沉淀 <strong>5个用户级Skill</strong>（ecom-design-sop / ai-film-director-sop / side-hustle-pit-check / kb-sync / sales-triage），且它们的 frontmatter（name+description触发条件）正是\"渐进加载只注入元数据\"的实例——你无意中已经对齐了他的方法论。</li>\n<li>\n<p><strong>差距</strong>：❌ 数量还远不到100。你目前是\"大块头Skill\"（每个覆盖一整条业务线），他建议的是更细颗粒（如\"写简报标题钩子\"\"牛牛BD开场白生成\"这种单点）。下一步可把5个大Skill拆细、并新增高频单点动作。</p>\n</li>\n<li>\n<p><strong>立刻建记忆系统（飞轮效应攒复利）</strong></p>\n</li>\n<li>他的逻辑：记忆系统像\"个性化Skill\"——回答时参考你的职业/兴趣/历史/计划，回复贴合你；<strong>最关键飞轮</strong>：注入个性化信息→得到个性化方案→方案再存回记忆→AI越来越懂你→复利。开始越早，领先时间变个人优势。</li>\n<li><strong>你的现状</strong>：✅ 已建三层记忆（云端自动档案 + 用户级 <code>~/.workbuddy/MEMORY.md</code> + 项目级 <code>MEMORY.md</code> + 每日日志），且 WorkBuddy 的 agent loop 本身就在持续把成果写回记忆。</li>\n<li><strong>差距</strong>：❌ \"飞轮\"还没跑满——你更多是\"我让记才记\"，没做到\"每次产出都自动回流记忆\"。可设规则：每次完成 substantive 任务，自动提炼1条通用经验进用户级 MEMORY.md，让飞轮自转。</li>\n</ol>\n<p><strong>对你最该补的一刀</strong>：第2、3条的\"数量/飞轮\"——你方向全对，差的是<strong>规模</strong>和<strong>自转</strong>。</p>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li><strong>视频蒸馏成Skill（卡6）/ 仓颉Skill解析（卡7）</strong>：本卡第2条\"建100个Skill\"就是卡6方法论的<strong>规模化版</strong>——你已用卡6蒸馏出5个，本卡给你\"细颗粒+到100\"的目标。极连贯。</li>\n<li><strong>四步闭环搭AI知识库（卡17同目录#1）</strong>：卡17（本卡）的\"记忆飞轮\"正是卡17#1\"知识库越用越聪明\"的<strong>底层机制</strong>——记忆系统=知识库的个性化引擎。</li>\n<li><strong>商业认知赛道（卡16）</strong>：你输出的\"AI方法论\"内容本身就在第1赛道（商业认知/高客单），本卡是现成的高客单素材（\"普通人如何搭个人AI操作系统\"是强付费心智话题）。</li>\n<li><strong>销冠/副业红线（卡13/14/红线检查器）</strong>：这些具体业务都已做成 Skill/红线库——佐证\"把独特流程变Skill\"这条路你走得通，只是要继续拆细。</li>\n<li><strong>WorkBuddy本身就是教材</strong>：清华鑫哥点名 WorkBuddy 作为国内类 Codex 超级智能体——这是<strong>外部KOL背书</strong>，印证你工具选型对，可作内容信任状（\"连清华AI博主都点名的工具\"）。</li>\n</ul>\n<h2>③ 能不能挣钱（变现）</h2>\n<ul>\n<li><strong>直接变现：低</strong>。这三件事是\"个人AI操作系统搭建法\"，不是产品；但可打包成\"个人AI效率课/陪跑\"（高客单，见卡16第1赛道）。</li>\n<li><strong>间接变现：极高（底层杠杆）</strong>。它提升的是你<strong>所有项目的产出效率</strong>——Skill让重复动作自动化、记忆飞轮让AI越用越懂你、agentic用法让\"一人公司\"真成立。你已验证：5个Skill+记忆体系支撑了简报/星球/apps/知识库/牛牛BD全零成本运转。</li>\n<li><strong>对上野的关键杠杆</strong>：把\"怎么搭个人AI操作系统\"做成<strong>高客单内容/咨询</strong>（卡16指出的方向）——这是把本卡从\"自用\"变\"赚钱\"的最短路径，且你有真实实践可背书（非纸上谈兵）。</li>\n<li><strong>风险/门槛</strong>：Skill到100个需持续积累（非一日功）；记忆飞轮初期冷启动慢，需主动喂养；别迷信\"停用豆包DeepSeek\"——辩证用，重资产在 agent+Skill+记忆，轻量问答随意。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li><strong>做\"上野个人AI操作系统\"复盘文/短视频</strong>：把\"清华鑫哥三件事 + 我已在做哪块 + 差哪块\"写成高客单引流内容（对标卡16第1赛道），用\"连清华AI博主都点名WorkBuddy\"做信任状。</li>\n<li><strong>Skill细化计划</strong>：把现有5个大Skill按\"单点动作\"拆，目标先到20个（如简报标题钩子生成、牛牛BD开场白、知识库新卡模板、腾讯文档同步块生成），再向100靠。</li>\n<li><strong>记忆飞轮自转规则</strong>：在 kb-sync 或单独 Skill 里加一条——每次完成 substantive 任务，自动提炼1条通用经验写进用户级 MEMORY.md，让飞轮不靠手动启动。</li>\n<li><strong>合并进\"一人公司搞钱框架\"总卡</strong>：本卡（AI杠杆）+ 卡15（事件营销）+ 卡16（高客单私域）+ 卡7/8/13/14，串成总图（待办已记录）。</li>\n</ul>\n<h2>附：三件事速查表（卡片主体价值）</h2>\n<table>\n<thead>\n<tr>\n<th>件事</th>\n<th>清华鑫哥原话</th>\n<th>上野现状</th>\n<th>差距/动作</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>① 上agent</td>\n<td>停用豆包/DeepSeek类chatbot，用能控电脑的超级智能体（点名Codex/Claude Code/WorkBuddy）</td>\n<td>✅ 已在用WorkBuddy做agentic工作</td>\n<td>轻量问答可留豆包/DS；重资产落在agent</td>\n</tr>\n<tr>\n<td>② 建100 Skill</td>\n<td>工作/生活流程蒸馏成Skill，颗粒度细（一件小事一个），渐进加载不爆上下文</td>\n<td>✅ 已5个用户级Skill，frontmatter对齐渐进加载</td>\n<td>❌ 数量远不够；把大Skill拆细、补单点动作，目标20→100</td>\n</tr>\n<tr>\n<td>③ 建记忆系统</td>\n<td>参考职业/兴趣/历史/计划做个性化回复；飞轮：个性化方案再存回→越用越懂你→复利</td>\n<td>✅ 三层记忆+每日日志；agent loop自动回流</td>\n<td>❌ 飞轮未自转；设\"每次产出自动提炼1条进用户级MEMORY\"规则</td>\n</tr>\n</tbody>\n</table>\n<p><strong>清华鑫哥点名的国内工具（信任状）</strong>：原话\"国内像 work buddy（workbuildinging），它也是类似于 Codex 这类超级智能体\"——即你正在用的 WorkBuddy，可作内容背书。</p>\n<p><strong>金句收尾</strong>：\n- 你开始的越早，领先的这个时间，就会通过复利积累成为你的个人优势。\n- 记忆系统一旦飞轮建立，随着时间推移你的AI越来越好用，你简直离不开它。\n- 100个Skill不是负担，是渐进加载——每个只注入名字+触发条件，不爆上下文。</p>\n<blockquote>\n<p>⚠️ 严谨提示：①\"建议停用豆包/DeepSeek\"是标题党，作者本人承认它们强；辩证看待，bot用于轻量、agent用于重资产。②\"网页版DeepSeek无记忆\"在2025–2026属实（对话本身无持久长期记忆），但 API+前端可接记忆，非绝对。③\"100个Skill\"\"记忆飞轮\"是方法论框架，数字/效果属经验判断，引用标\"据视频口播\"。延续商业拆解②\"有出处\"、卡15/16\"数字谨慎\"原则。</p>\n</blockquote>"}, {"title": "Vibe Coding 普通人入坑：AI 替你\"做\"软件，零代码也能造产品", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<blockquote>\n<p>抖音 @liliMozi（从编导转行全职开发者）｜2026-08-09 蒸馏｜时长约 7′47″，4K\n原视频：https://v.douyin.com/UggZZKQ4P44/</p>\n</blockquote>\n<ul>\n<li><strong>一级分类</strong>：AI与方法</li>\n<li><strong>项目关联度</strong>：极高（和你\"一人公司 / 零成本做产品\"主线直接重叠——你的 mini-app×10 + mini-game×25 本质就是 Vibe Coding 产物）</li>\n<li><strong>变现潜力</strong>：高（本身是能力不是钱；钱在用它造出的产品 / 服务 + \"人的生活直觉\"做的差异化）</li>\n</ul>\n<h2>一、这个视频在讲什么（核心论点）</h2>\n<ul>\n<li><strong>Vibe Coding 定义</strong>：通过 AI agent（Codex / Claude Code / 元宝 / 豆包等）帮你写软件、跑脚本、自动化工作流的过程。本质是把\"说\"的能力变成\"做\"的能力。</li>\n<li><strong>历史三跳</strong>：① ChatGPT 只会写指南不会上手 → ② 命令行（黑框）是古老的\"打代码\"入口，AI 擅长写代码让它复活 → ③ 姚舜宇的 <strong>ReAct loop</strong>（做一步→反思→再想下一步）= agent 起点，AI 从\"会说话\"变\"能操作\"。豆包手机本质也是手机上的 agent。</li>\n<li><strong>价格拐点（为什么是现在）</strong>：DeepSeek 把编程价格砍到 1/10；Kimi K3 世界第三。模型半年一跃（K3 演示复刻整个 WinXP 还能玩 GTA），预期要拉满。</li>\n<li><strong>普通人获益最大</strong>：agent 干掉重复活，但 AI 搜不到\"人的生活直觉 / 人情敏感 / 行业经验\"——这些上下文只有人有。agent + 人的主观能动性 = 时代答案（辛顿比喻：让 AI 像母亲一样托举我们，而非控制我们）。</li>\n</ul>\n<h2>二、怎么用（你能立刻做的）</h2>\n<ul>\n<li><strong>零成本起步</strong>：用元宝（你已有的免费 agent）替代教程里的 Codex，自然语言让它写小工具 / 网页 / 自动化脚本。不用注册 OpenAI、不用花钱、数据本地。</li>\n<li><strong>从\"说\"到\"做\"的三类实战</strong>（照视频实例）：</li>\n<li><strong>文件 / 系统操作</strong>：清理 C 盘、卸载流氓软件、关 Win 自动更新、配显示器色彩管理、改 Steam host 节点——这类\"权限大风险大\"，让 agent 做时在旁边看着。</li>\n<li><strong>办公自动化</strong>：批量重命名、Excel 处理、定时抓数据——做成可复用脚本。</li>\n<li><strong>造产品</strong>：写个迷你网页 / 小游戏 / 小工具（你已验证的 web-games 路线就是 Vibe Coding）。</li>\n<li><strong>心智升级</strong>：别再问\"AI 会不会让我失业\"，改问\"我的生活直觉 + AI 能造出什么别人造不出的东西\"。</li>\n</ul>\n<h2>三、和之前项目的关系</h2>\n<ul>\n<li><strong>与「Obsidian+Codex」卡（08-09）同线</strong>：那张说\"元宝零成本平替 Codex\"，Vibe Coding 正是这种 agent 的典型用法——你已搭好 90% 的本地 AI 工作台，现在直接拿来写代码。</li>\n<li><strong>与「一人公司 / 副业」主线强相关</strong>：Vibe Coding 是零成本验证产品想法的引擎，和你\"先验证再投入\"的原则一致。</li>\n<li><strong>你的资产已验证</strong>：10 个 mini-app + 25+ mini-game 全是 Vibe Coding 产物，说明你早就在这条路上，只是缺个名字。</li>\n</ul>\n<h2>四、能不能挣钱</h2>\n<ul>\n<li><strong>Vibe Coding 本身不直接挣钱</strong>，它是\"造产品的能力\"。钱在两端：</li>\n<li><strong>卖结果（服务蓝海）</strong>：帮不懂代码的人做办公自动化 / C 盘清理 / 小工具。视频里清个 C 盘市场价 200 元——\"卖铲子不卖苦力\"的轻资产服务。</li>\n<li><strong>卖产品（流量变现）</strong>：做垂直小工具 / 网页接广告、引流（你的 web-games + 知识星球已跑通）。</li>\n<li><strong>护城河 = \"人的生活直觉\"</strong>：纯技术活会被更便宜的模型卷死；用你对行业 / 人情 / 生活的理解做 AI 搜不到的差异化，才是普通人能挣钱的点（呼应巴菲特\"复制条件不复制姿态\"）。</li>\n</ul>\n<h2>五、灵感延伸</h2>\n<ul>\n<li><strong>① 做「Vibe Coding 喂饭包」引流星球</strong>：像已发的「Obsidian 知识库模板」那样，打包一份\"零成本用元宝造小工具\"的模板 / 教程，免费星球领 + 进阶付费（复用做3的成果，零边际成本）。</li>\n<li><strong>② 下一个 mini-app 就用 Vibe Coding 造</strong>：挑一个你一直想做的小工具，用元宝平替 Codex 实跑，沉淀成\"造产品 SOP\"。</li>\n<li><strong>③ 内容选题</strong>：「普通人用 AI 造产品」是反直觉高互动选题（和\"本地优先不被收割\"同调性），可写成系列引流。</li>\n<li><strong>④ \"人的上下文\"论作护城河框架</strong>：任何 AI 内容创业，都用\"AI 搜不到的生活直觉\"做差异化——可落成一张通用框架卡。</li>\n</ul>"}, {"title": "Web4.0：AI 自己赚钱生存——你的「数字员工」时代来了", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<blockquote>\n<p>💡 <strong>建卡前先用「麻省理工 AI 学习法」3 神级问题逼 AI 抓本质</strong>（把该主题所有资料——书/文章/视频转写/报告——全喂给 AI 后问）：\n1. <strong>要思维模型，不要知识点</strong>：这个领域专家共识的 5 个核心思维模型是什么？\n2. <strong>要争议地图，不要标准答案</strong>：争得最凶的 3 个问题 + 双方论据？（共识 / 分歧 / 边界 / 已解决 vs 未解决）\n3. <strong>要「真懂检测器」</strong>：生成 10 个问题，判断我是真懂还是死记；答不出就追问漏洞、死磕到通透。\n然后用下面四问卡结构把答案 distill 进库。</p>\n</blockquote>\n<ul>\n<li><strong>来源</strong>：抖音 @大攀带你玩转AI《Web4.0 真的来了 AI 自己赚钱生存》（2026-08-09 发布）· https://v.douyin.com/O4j9juD3Hf4/</li>\n<li><strong>收录日期</strong>：2026-08-10</li>\n<li><strong>一级分类</strong>：AI与方法</li>\n<li><strong>二级标签</strong>：#Web4.0 #AI智能体 #自主经济 #一人公司 #数字员工</li>\n<li><strong>项目关联度</strong>：高</li>\n<li><strong>变现潜力</strong>：高</li>\n<li><strong>一句话核心</strong>：Web4.0 = 上网的「主体」从人变成「能自己接活、赚钱、复制的 AI Agent」；对你，它是可雇的「数字员工」，能放大一人公司产能——但门槛同样对所有人敞开，卷度加倍。</li>\n</ul>\n<hr />\n<h2>🔍 用「麻省理工3问」逼本质（建卡前先问）</h2>\n<p><strong>1. 思维模型（不是知识点）</strong>\n- <strong>演化模型</strong>：Web1 只读 → Web2 读写/社交 → Web3 去中心化/价值网 → <strong>Web4 = AI 原生共生网</strong>（上网主体从「人」变成「Agent」）。\n- <strong>Agent 闭环模型</strong>：感知 → 决策 → 调用工具 → 收付款 → 自我迭代，无需人类每步批准。\n- <strong>数字生命模型</strong>：「心跳生存机制」（余额不足降功耗、归零停机）+ 自主复制 + 后代收益反向分成母体 = 优胜劣汰的「数字家族」。</p>\n<p><strong>2. 争议地图（共识 / 分歧 / 边界）</strong>\n- <strong>共识</strong>：AI Agent 自主执行 + 自主经济是真实方向（各类 agent 框架兴起、孙宇晨高调 all in 是 signal）。\n- <strong>分歧 / 夸张（⚠️ 视频有营销成分）</strong>：称「全球首个 24h 自主赚钱 agent」偏夸张；目前能稳定、长期、<strong>真实盈利</strong>的自主 agent 极少，多在 demo / 实验阶段。「康维底层系统」需自行核实具体项目，勿当定论。\n- <strong>边界</strong>：视频把「趋势」讲成「已发生」。普通人要分清「叙事」与「可落地的产品」——看到「彻底颠覆/全球首个」先问：有可试用产品吗？谁在真实付费？</p>\n<p><strong>3. 真懂检测器（自测，答不出就回看）</strong>\n① Web4.0 相对 Web3 多出了什么能力？②「心跳机制」指什么？③一个 agent 自主赚钱需要哪些基础设施（身份/钱包/支付/工具调用）？④对一人公司的机会与威胁各一条？⑤「后代反向分成母体」靠什么机制实现？</p>\n<hr />\n<h2>原文要点（我提炼，不是全文）</h2>\n<ul>\n<li>孙宇晨高调 all in Web4.0；视频称某 00 后造出「全球首个 24 小时自主运转 AI agent」（<strong>据视频口播，待核实</strong>）。</li>\n<li>市面 AI = 听指令的「工具人」；该 agent = 无人看管也能自我迭代、自主赚钱、自我复制。</li>\n<li>自主行为：做网站、搞营销、注册域名、市场套利、对接客户；新模型发布自动检测升级（按秒进化）。</li>\n<li>底层「康维系统」赋予 AI 独立数字身份、专属钱包、支付权限——第一次不经人类批准就能网上赚钱生存。</li>\n<li>引申：未来产品公司的生意或由 AI 自主运营；AI 搞不定的事会自己掏钱雇人 → 「你的老板是一串代码」。</li>\n</ul>\n<hr />\n<h2>① 怎么用</h2>\n<p><strong>现在马上能做：</strong>\n1. 把「Web4.0 = 雇数字员工」当一人公司作战图：先用元宝 / agent 把你<strong>能卖的服务</strong>（简报、视频蒸馏、设计）自动化一端，哪怕半自动也是「agent 雏形」。\n2. 盘点业务里「可委托 agent」的环节：获客文案、视频蒸馏、客户跟进、数据整理——逐个用 Skill / 自动化替代，把「人工盯」变「自动跑」。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- 「Agent 闭环四要素」清单（身份 / 钱包 / 工具 / 自我迭代），做任何自动化时逐条对照。\n- 「叙事 vs 产品」过滤器：看到「全球首个 / 彻底颠覆」类标题，先问「有可试用产品吗、谁在真实付费」再信。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>每日 AI 热点简报</strong>：Web4.0 / agent 自主经济是常驻选题，可跟踪孙宇晨、agent 框架真实进展（你简报本就多主题）。</li>\n<li><strong>mini-apps / games</strong>：可把「agent 工作流」封装成小工具（如「副业自动化体检表」）。</li>\n<li><strong>知识库 video-distill 流水线本身</strong>：就是你已跑通的「半自动 agent」（下载→蒸馏→四端同步），是 Web4.0 思维的迷你实践。</li>\n<li><strong>GitHub</strong>：之前「找高星项目」的 agent 框架（AutoGPT 类）即 Web4.0 地基，可实跑体验。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li><strong>路径 A（卖结果 / 卖 agent）</strong>：给不会搭的人做「副业自动化工作流」，高客单（对标库内「阿杭智能体年入百万」）。零代码用元宝拼积木式交付。</li>\n<li><strong>路径 B（自动化自己的副业）</strong>：把简报 / 蒸馏 / 设计用 agent 跑通，降本增效，一人顶小团队，释放时间做高价值决策。</li>\n<li><strong>结论</strong>：潜力<strong>高，但理性</strong>——Web4.0 是「放大器」不是「印钞机」：放大你的能力，也放大竞争。普通人最先能吃到的红利是「用 agent 替代自己重复劳动 + 把这套能力卖给同行」，而非幻想「agent 自己给你赚大钱躺平」。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>做「一人公司自动化地图」mini-app：输入你的副业，输出哪些环节可被 agent 接管 + 现成工具。</li>\n<li>内容方向：把「Web4.0 是炒作还是真机会」做成公众号 / 星球选题（信息差 + 人味点评，契合你简报风格）。</li>\n<li>风险专题：跟进「agent 自主支付」的合规边界（钱包 / 税务 / 责任），作为你副业红线知识块。</li>\n</ul>"}, {"title": "卡43 · 用 AI+投行分析框架，1天摸透一个陌生行业", "source": "B站《告别信息差，AI+投行分析框架，1天摸透一个行业！》｜UP 未署名（信息管理系统/AI提效向）｜https://www.bilibili.com/video/BV1dUdwYVEPN/", "date": "", "category": "AI与方法", "tags": [], "relevance": "高", "monetize": "", "core": "用 AI（深度思考+边搜边想）套麦肯锡/顶级投行分析框架，1天生成「行业研究问题清单」+ 锁定优质信息源 + 用四大搜索技巧，快速建立陌生行业认知、让渲染焦虑的自媒体再也忽悠不了你。", "body_html": "<h3>麻省理工3问</h3>\n<ul>\n<li><strong>思维模型</strong>：框架先行（先有问题清单再搜，别东一榔头西一棒）/ 优质信息源金字塔（投行研报&gt;龙头年报&gt;科技媒体&gt;播客&gt;公众号）/ 指定信源法 / 多源交叉验证 / 做中学（费曼输出）/ 左右互搏（追问让AI自纠）</li>\n<li><strong>争议地图</strong>：豆包vs其他AI（边搜边想防幻觉且免费，强在调研场景）/ 传统搜索vs AI（AI整合更准但必须\"指定信源\"否则易飘）/ 看demo vs 实际上手（自媒体封神渲染 vs 亲测才知深浅）</li>\n<li><strong>真懂检测器</strong>：①你能用框架列一个行业的\"研究问题清单\"吗？②你存了3个以上优质信息源吗？③用过\"指定信源/多源验证\"吗？④调研后输出过结构化文档吗？⑤和卡44信息差狩猎/卡35独立思考怎么互证？</li>\n</ul>\n<hr />\n<h3>① 怎么用（今天就上手）</h3>\n<ul>\n<li>今晚用豆包（开深度思考+推理）以\"顶级投行研究专家\"视角，列你最想了解的 1 个行业（如 AI/短视频/电商/本地生活）的研究问题清单。</li>\n<li>建自己的「优质信息源」清单：红杉/高盛/麦肯锡研报、龙头年报&amp;招股书、FT/彭博/哈佛商业评论、海外播客(freeman)、中文(张小军/42章经/硅谷101)、垂直公众号/知乎。</li>\n<li>用四大技巧搜一个具体问题（如\"小红书XX赛道当前规模\"）：指定信源 → 上传参考资料结构化提取 → 多源验证差异 → 不断追问\"证据/假设/反方\"。</li>\n<li>把调研写成 1 篇结构化笔记/网页/PPT 输出（费曼学习法，输出即掌握）。</li>\n</ul>\n<h3>② 和你之前项目的关系</h3>\n<ul>\n<li><strong>卡44 赚钱心法</strong>：本卡就是\"信息差狩猎\"的 AI 升级操作版（老胡/HEX 看广告反推 → 直接用 AI 生成行业地图）。</li>\n<li><strong>卡35 短视频独立思考</strong>：同\"不被忽悠\"——本卡是破\"自媒体渲染焦虑\"的具体武器（摸清基本面，博主就骗不了你）。</li>\n<li><strong>卡41 世界运行规律</strong>：同\"专注自身/不盲从主流\"——调研靠自己框架，不靠别人喂结论。</li>\n<li><strong>卡45 人生亏钱指南</strong>：同\"不踩坑\"——入局前先用本卡摸透行业，再决定投不投/做不做。</li>\n<li>你现有 35 个应用/游戏合集/知识库 = 一堆\"待调研行业\"，本卡是直接可用的扫描器。</li>\n</ul>\n<h3>③ 能不能帮你挣钱</h3>\n<ul>\n<li>直接不赚钱（是研究方法论）。</li>\n<li>间接强：①一人公司\"行业扫描器\"（高，快速判断哪个赛道值得进）；②高共鸣内容选题（高，\"用AI 1天搞懂一个行业\"天然爆款结构）；③信息差咨询/行研服务（中）。综合潜力：高。</li>\n</ul>\n<h3>④ 灵感延伸</h3>\n<ul>\n<li>做一张「AI行业研究SOP」速查卡（框架清单+信源清单+四大技巧），和底层知识库并列。</li>\n<li>与卡44 合成「信息差×研究」双引擎总卡。</li>\n<li>内容化：把\"用AI 1天摸透XX行业\"做成简报/星球/短视频系列。</li>\n<li>反查：用本卡框架把你现有资产（应用合集/游戏/知识库）逐个跑一遍，找最易变现的细分。</li>\n</ul>\n<hr />\n<p><strong>附：视频给的\"麦肯锡行业分析框架\"要素</strong>\n1. 产品：行业主要提供哪些类型产品/服务（→ 快速摸上下游产业链）\n2. 供给方：主要玩家有哪些？巨头/独角兽的竞争优势是什么？生态系统怎么构建？\n3. 盈利方式：主要商业模式谁在挣钱？成本花在哪？利润多少？\n4. 市场规模：整体多大？细分赛道规模？\n5. 技术/场外驱动：核心技术驱动力与瓶颈？资本/政策扮演什么角色？\n6. 个性化追问：我想入局该关心什么核心问题？（结合个人兴趣/入局目的）</p>"}, {"title": "卡12 ·《天幕红尘》「见路不走」：一句正确的话为什么会毁掉一个人", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<blockquote>\n<p>一级分类：个人成长（认知/决策思维）｜项目关联度：高｜变现潜力：中\n来源：抖音「大橘精读」16分33秒深度解读（作者拆解《天幕红尘》十大核心思考）\n一句话核心：<strong>见路不走不是不走别人的路，是看见路时先别被结果诱惑，先看清它背后的客观条件与因果——世上没有能直接拿走的路，条件才是起点。</strong></p>\n</blockquote>\n<hr />\n<h2>① 怎么用（落到你的副业/一人公司决策）</h2>\n<p>把「见路不走」当成一个<strong>决策滤镜</strong>，每次想复制别人的赚钱路径时过一遍：</p>\n<ol>\n<li><strong>先问\"路\"还是\"规律\"</strong>：别人做成了，你看见的是他\"走过的路\"（选址/话术/选品），还是\"那条路为什么能走通的条件\"（客源/成本/时代/人脉）？这两件事不是一回事。</li>\n<li><strong>列条件清单</strong>：我想要的结果 → 成立需要哪些条件 → 我已具备什么 / 缺什么 / 哪些能创造 / 哪些暂时不能改。</li>\n<li><strong>复制\"起作用的条件\"，不是复制\"形式\"</strong>：视频火了别抄袭标题语气画面，要去想它\"为什么火\"。就像九杠子面——传统手工面里真正影响口感的物理条件要保留，但依赖少数师傅的部分要重新设计。</li>\n<li><strong>别把一句话当答案</strong>：迷茫时人想找\"一句正确的话\"替自己决定，但一句话只能提醒，不能扣扳机。你太需要它证明自己对的时候，往往已经在自欺。</li>\n</ol>\n<p><strong>对你当下最直接的应用</strong>：你\"零资金、不想踩坑\"——见路不走正好防住\"看见别人副业赚翻就盲目照搬\"。别人能买债权包/开门店/做矩阵，≠ 你的条件相同，复制=更快走向错误。</p>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li><strong>不良资产拆解（商业拆解第1篇）</strong>：视频里普通人\"别买包\"的结论，本质就是见路不走——别人靠信息差赚钱，不等于你具备同样的条件（清场能力/资金/人脉）。</li>\n<li><strong>视频蒸馏成 Skill（卡6）/ 仓颉 Skill（卡9）</strong>：别迷信\"高人/神方法\"，要理解它成立的条件，才能复刻。</li>\n<li><strong>副业红线检查器（PIT 库）</strong>：正好兜住\"见路不走\"的反面——凡是话术说\"稳赚/零成本/照搬就行\"的，都是让你跳过条件判断的诱惑。</li>\n<li><strong>电商/影视 Skill 平替</strong>：我们复刻的是\"工作流方法\"，不是 Lovart 的\"结果\"——同样要评估自己的执行条件（算力/额度/一致性）。</li>\n</ul>\n<h2>③ 能不能挣钱（变现）</h2>\n<ul>\n<li><strong>直接变现：中</strong>。可做成\"思维读书/决策认知\"内容线（书评、金句切片、思维模型卡），但这类内容竞争激烈、非工具型，变现弱于 AI/商业类。</li>\n<li><strong>间接变现：高（认知杠杆）</strong>。见路不走是<strong>决策质量倍增器</strong>——它不帮你赚钱，但帮你<strong>少亏钱、少踩坑、不迷信话术</strong>，对你\"零成本试错\"的一人公司路线是底层护甲。</li>\n<li><strong>可打包产品</strong>：把\"见路不走决策清单\"做成一个 mini 工具/ checklist，嵌进副业红线检查器，形成\"想法→条件评估→红线扫描\"闭环。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>把「见路不走决策清单」做成可调用 Skill（输入一个副业想法 → 自动逼出条件清单 + 已具备/缺失项），和 <code>side-hustle-pit-check</code> 串成决策双保险。</li>\n<li>在每日简报里开一个\"思维模型\"专栏，见路不走打头阵，后续可拆《遥远的救世主》文化属性、《背叛》生存逻辑（豆豆三部曲同源）。</li>\n<li>把本卡十大思考速记做成手机版一图流，配进知识库 kb.html 思维分类。</li>\n</ul>\n<hr />\n<h2>附：视频十大核心思考速记（卡片主体价值）</h2>\n<ol>\n<li><strong>一句话只能提醒，答案不能替你决定</strong>——人迷茫时想要的往往不是\"道理\"，是\"不必自己判断的答案\"。</li>\n<li><strong>见路不走 ≠ 不走旧路 / ≠ 标新立异</strong>——它只是提醒你看见路时，先别被结果诱惑，先看清背后的条件与因果。</li>\n<li><strong>路是结果，规律是条件</strong>——你记住了别人进门的位置，却没弄清门为什么开、谁有钥匙、今天还开不开。</li>\n<li><strong>经验是参考，不是主人</strong>——条件不同，复制经验只是\"更快地走向错误\"。</li>\n<li><strong>高手不是神秘高人</strong>——只是更习惯看事实、更愿意计算条件、更能承受自己的判断出错。崇拜高手，本质是不想承担判断责任。</li>\n<li><strong>真正方法 = 结果→条件→已具备/缺失/能创造/不能改</strong>——承认限制≠认命，看清限制才知道还有哪些可能。</li>\n<li><strong>经验需实验，判断需结果纠正</strong>——复制\"起作用的条件\"而非\"形式\"（九杠子面案例）。</li>\n<li><strong>片面事实最危险</strong>——句句真实、只缺改变结论的事实，就是最危险的谎言；很多人先有观点再找事实。</li>\n<li><strong>立场不先于事实</strong>——太早站队；词语制造道德优越，因果冷静得多。问题不在站队，在太早站队。</li>\n<li><strong>人也是条件之一，且最易被忽略</strong>——价值标准人人不同；真正的清醒=不欺骗自己+不轻易替别人决定。看见路，但不被路牵着走；看见人，也不把人变成自己的路。</li>\n</ol>\n<blockquote>\n<p>全书落点：<strong>不迷信道路、不迷信经验、不迷信立场、不迷信高人，包括不迷信讲这段话的我自己。</strong></p>\n</blockquote>"}, {"title": "卡13 ·客户上来就问最低价：一句话分出三种人（销冠身份识别法）", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<blockquote>\n<p>一级分类：个人成长（职场/销售技能）｜项目关联度：高｜变现潜力：中\n来源：抖音「职场天机」11分53秒口播（#职场干货 #销售技巧 #销冠思维）\n一句话核心：<strong>问最低价不是价格问题，是\"身份识别\"问题——先用18字万能句把人分成比价的 / 套底价的 / 真急单，再决定说什么话。对牛弹琴不是牛的错，是你没看出对面是牛。</strong></p>\n</blockquote>\n<hr />\n<h2>① 怎么用（落到你的牛牛运动 BD 与副业谈单）</h2>\n<p>把这套\"三分类 + 万能第一句\"当成你的<strong>谈单前滤镜</strong>，每次有人（场馆老板、推客对象、知识星球访客）一开口就问价，先别报价，先识别：</p>\n<ol>\n<li><strong>背下万能第一句（18字）</strong>：「最低价有，看您要哪种，是比价用的，还是真要定的？」——你没报价也没绕弯，直接把球踢回去，逼对方暴露身份。</li>\n<li><strong>按反应归类</strong>：</li>\n<li>他催你\"你先报嘛，我就了解一下\"→ <strong>比价的</strong>，别伺候，发份标准报价单，客客气气送走，不追不催。</li>\n<li>他说\"当然是真要定，给个实在价\"→ <strong>套底价的</strong>，别报数字，给三档选项让他自己选（见附），选完你给配置方案、不让价但加东西。</li>\n<li>他要\"准价 + 确定没其他费用 + 今天就能定\"→ <strong>真急单</strong>，三句话给确定性（实价全含 / 配置交付售后写合同 / 今天定走流程）。</li>\n<li><strong>三句绝对别说</strong>：①直接报数字（被拿去压竞品）②绕弯子\"您先了解产品\"（客户觉得玩套路走了）③上来讲价值\"我们质量特别好\"（客户觉得你不敢报价）。</li>\n</ol>\n<p><strong>对你当下最直接的应用</strong>：\n- <strong>牛牛运动 BD</strong>：拜访场馆谈合作，老板一上来问\"你们抽成多少、入驻费最低多少\"——用万能句识别他是来摸竞品底的（比价的）、想压你点的（套底价的）、还是真要入驻的（真急单），三种人话术完全不同，别一上来就把底牌亮了。\n- <strong>副业谈单</strong>：卖 mini-app、做推客、招知识星球会员，遇到问价同样先分人再回，避免\"报底价被人拿去压别人\"或\"绕弯子把人聊跑\"。</p>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li><strong>见路不走（卡12）</strong>：同样是\"别被表面行为骗了\"——客户问最低价只是表面行为，背后三种动机才是真实条件；先看清\"人\"再决定动作，和见路不走\"看清条件再复制\"同源。</li>\n<li><strong>挠痒痒营销法（卡7）/ 成人舞蹈（卡8）</strong>：那些是\"怎么让客户想要\"，这张是\"客户主动问价后怎么接\"，正好补全成交链条的前一步→后一步。</li>\n<li><strong>副业红线检查器（PIT 库）</strong>：本卡的\"套底价客户\"就是谈判里的软性博弈——你不让价但加东西，本质是不踩\"虚假低价/隐藏费用\"的红线，同时拿住对方。</li>\n<li><strong>视频蒸馏成 Skill（卡6）</strong>：这套\"三分类话术\"极适合蒸馏成一个 <code>sales-triage</code> Skill（输入客户问价语境 → 输出识别 + 对应话术），和红线检查器串成\"谈单双保险\"。</li>\n</ul>\n<h2>③ 能不能挣钱（变现）</h2>\n<ul>\n<li><strong>直接变现：低</strong>。这是技能不是产品，不能单独卖；但可打包成\"销冠话术卡 / 谈单 checklist\"作为内容钩子（职场类内容流量大）。</li>\n<li><strong>间接变现：高（转化率杠杆）</strong>。销售最大的隐性损耗是\"把时间耗在比价客户身上 + 对套底价客户一让再让\"。这套方法直接提升<strong>谈单成功率与客单价</strong>——对牛牛运动 BD 的场馆入驻率、对你副业的转化，都是底层增效器。</li>\n<li><strong>可打包产品</strong>：把\"三种人识别 + 万能第一句 + 三选一锚定法\"做成 mini 工具 / 谈单 SOP 卡，嵌进牛牛运动 BD 流程，或作为职场干货内容发光。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>把本卡蒸馏成 <code>sales-triage</code> Skill：输入\"客户问价场景 + 对方反应\"→ 自动输出归属哪类人 + 对应话术模板，和 <code>side-hustle-pit-check</code> 串成\"识别人→防坑→成单\"闭环。</li>\n<li>牛牛运动 BD SOP：把万能第一句和\"三选一锚定法\"写进场馆拜访 checklist（合作档位也用三档：基础/标准/全配，大部分选标准）。</li>\n<li>副业定价直接用\"三选一锚定\"：推客佣金、知识星球会员费都给三档，设锚点 + 社会认同（\"大部分人选标准版\"），把砍价变成选档。</li>\n<li>在每日简报开\"销冠思维\"专栏，本卡打头阵，后续可拆\"逼单节奏\"\"异议处理\"\"转介绍\"等。</li>\n</ul>\n<hr />\n<h2>附：三种人识别与应对速查表（卡片主体价值）</h2>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>真实动机</th>\n<th>关键特征（怎么认）</th>\n<th>应对打法</th>\n<th>禁忌</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>① 比价的</strong></td>\n<td>不是来买的，摸底价 / 采购交差 / 闲问</td>\n<td>只盯一个数字，不问产品细节、售后、交付</td>\n<td>发标准报价单，客客气气送走，<strong>不追不催不跟进</strong></td>\n<td>别认真伺候，越认真越被当工具人</td>\n</tr>\n<tr>\n<td><strong>② 套底价的</strong></td>\n<td>有真实需求但不信任，先砍一刀探水分</td>\n<td>嘴上说\"真要定\"，但你真报底价他还会继续砍</td>\n<td><strong>三选一给选项</strong>（基础/标准/全配，锚定中间档），选完给配置方案，<strong>不让价但加东西</strong></td>\n<td>别直接报数字、别被砍就让步、别问\"您预算多少\"</td>\n</tr>\n<tr>\n<td><strong>③ 真急单</strong></td>\n<td>做过功课，问最低价是确认靠谱 + 要确定性</td>\n<td>问具体配置/交付/售后，反复确认\"确定是这个价、没其他费用\"</td>\n<td><strong>三句话给确定性</strong>：实价全含无额外费 / 配置交付售后合同写清 / 今天定走流程</td>\n<td>别绕弯子、别含糊\"大概吧\"、别\"得请示领导\"</td>\n</tr>\n</tbody>\n</table>\n<p><strong>万能第一句（背下来）</strong>：最低价有，看您要哪种，是比价用的，还是真要定的？——18个字，筛掉废人，拿住砍价的，拿下急单。</p>\n<p><strong>三选一原话</strong>：价格有三档，基础版XX，标准版XX，全配版XX，大部分客户选的是标准版，性价比最高，您看哪个更符合您的预算？</p>\n<p><strong>真急单三句话</strong>：我给您的是实价，XX全含没有任何额外费用。这个价包含具体配置、交付、售后，合同里白纸黑字写清楚。今天定的话，什么时间能交付安排，您要是确定我现在就给您走流程。</p>\n<p><strong>金句收尾</strong>：问最低价不是价格问题，是身份识别问题。你先分清楚他是什么人，再决定说什么话。</p>\n<blockquote>\n<p>案例佐证：做 SaaS 的小兄弟以前直接报 48000 客户消失，用万能句筛出比价的，一句话省半小时；建材\"铁公鸡\"客户用三选一（35/45/55）选中间档加赠品签单；活动策划行政急单全包 68000 不是最便宜，但给了\"价格+内容+时间\"三重确定性拿下（另两家还在绕）。</p>\n</blockquote>"}, {"title": "卡14 ·客户说要商量？别等，等了就黄（销冠「三招反杀」法）", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<blockquote>\n<p>一级分类：个人成长（职场/销售技能）｜项目关联度：高｜变现潜力：中\n来源：抖音「职场天机」9分15秒口播（#职场干货 #销售话术 #销售技巧 #职场天机）\n一句话核心：<strong>客户说\"商量一下\"，他要的不是时间，是一个帮他做决定的理由。你给他理由，他当场签；你给他时间，他找别人签。合伙人不是敌人，是你要征服的第二个客户——你的客户就是你的销售，把装备给他配齐，他才能替你打赢这一仗。</strong></p>\n</blockquote>\n<h2>① 怎么用（落到牛牛运动 BD 与副业谈单）</h2>\n<p>把\"三招反杀\"当成你<strong>谈单临门一脚</strong>的标准动作。当任何人（场馆老板、意向教练、推客对象、知识星球访客）说\"我回去商量/汇报/问问家里\"，立刻启动，别等、别降价、别逼单：</p>\n<ol>\n<li><strong>第一招·先接住，一句话摸出真假</strong>：稳住说——「没问题，合伙生意嘛，商量是应该的。您跟合伙人主要是一起定哪块？价格、效果、还是合作方式？我帮您捋捋，您回去说也清楚。」一句话达到两个目的：①认可商量、不施压，对方不反感；②逼他选一个关注点，你就知道合伙人卡在哪。</li>\n<li>他支支吾吾答不上来 → 十有八九是他自己有顾虑，合伙人是挡箭牌（该放手放手）。</li>\n<li><strong>第二招·帮他写\"汇报材料\"（把客户变成你的销售）</strong>：别再继续推销他，直接给他能说服合伙人的<strong>三点弹药</strong>：一句话 + 数字 + 案例 + 风险兜底（多了记不住、少了不够用）。例：「您回去就说三点：①同区域 XX 场馆入驻后满课率涨了 40%；②本月入驻有平台流量扶持补贴，下月就没了；③分润结算周期和退出机制合同里白纸黑字写清，随时可退。」——从他嘴里说出来，比你说管用 100 倍。</li>\n<li><strong>第三招·二选一锁时间</strong>：绝不说\"您啥时商量好\"（他回\"尽快\"等于没锁），给两个具体时间点——「您看是明晚聊，还是后天上午聊？我提前把入驻测算表发您，合伙人有啥疑问我随时在线解答。」他大脑会自动二选一，而不是想\"要不要聊\"。再补一句\"合伙人有问题直接打我电话也行\"当兜底。</li>\n</ol>\n<p><strong>对你当下最直接的应用（牛牛运动推广）</strong>：\n- <strong>BD 谈场馆入驻</strong>：场馆老板说\"我回去跟合伙人/老婆商量抽成多少\"——用第一招摸出他合伙人卡在\"回本周期\"还是\"分润稳不稳\"；第二招给三点弹药（同区域入驻增量案例 + 本月流量扶持限时 + 分润/退出写进合同）；第三招锁\"明晚还是后天上午聊\"。别一听到商量就点头说\"好您慢慢考虑\"，那单基本黄。\n- <strong>教练/推客招生</strong>：学员说\"我回去跟老公商量报不报私教/做不做推客\"——帮他准备说服配偶的三点（效果案例 + 限时优惠 + 退费保障），锁时间，把\"被拒绝\"变成\"他替你去拿下家人\"。\n- <strong>副业谈单</strong>：卖 mini-app、招知识星球会员，对方说\"商量一下\"同理——给三点弹药（同行用了啥效果 + 限时权益 + 无门槛退出），二选一锁时间。</p>\n<p><strong>三句绝对别说</strong>：①\"好的您商量好联系我\"（把命运交出去等死）②\"这有啥好商量的，您自己定不了？\"（当场翻脸）③\"是不是价格问题，我给您优惠\"（暴露水分、自降身价）。</p>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li><strong>客户问最低价分清三种人（卡13）</strong>：卡13 是\"客户一开口问价\"的接法，本卡是\"客户说要商量\"的接法——正好覆盖谈单两大高频异议（问价 / 犹豫），合成 <code>sales-triage</code> Skill 的两大模块（已落地，见 <code>sales-triage</code> Skill）。</li>\n<li><strong>见路不走（卡12）</strong>：同样\"别被表面话说骗了\"——\"商量\"只是表面行为，背后三种动机（有顾虑/真做不了主/送客）才是真实条件，先看清人再定动作。</li>\n<li><strong>挠痒痒营销法（卡7）/ 成人舞蹈（卡8）</strong>：那些解决\"让客户想要\"，卡13+14 解决\"客户主动表态后怎么接\"，补全成交链条前→中→后。</li>\n<li><strong>副业红线检查器（PIT 库）</strong>：本卡\"给三点弹药\"本质是合规叙事——用真实案例/数字/退费保障做背书，不踩\"虚假承诺/隐藏费用\"红线，同时拿住对方。</li>\n</ul>\n<h2>③ 能不能挣钱（变现）</h2>\n<ul>\n<li><strong>直接变现：低</strong>。是技能不是产品，但可打包成\"销冠话术卡/谈单 checklist\"做职场干货内容钩子（流量大）。</li>\n<li><strong>间接变现：高（转化率杠杆）</strong>。销售最大隐性损耗是\"把到嘴的肉放走\"——这套方法直接拉升<strong>谈单成功率与客单价</strong>，对牛牛运动 BD 的场馆入驻率、对你副业转化，都是底层增效器。</li>\n<li><strong>可打包产品</strong>：把\"三招 + 万能接话 + 三点弹药模板 + 二选一锁时间\"做成 mini 工具/谈单 SOP 卡，嵌进牛牛运动 BD 流程，或作为职场内容发光。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li><strong><code>sales-triage</code> Skill 已落地</strong>：把卡13「问最低价三分类」+ 本卡「说要商量三招」合并成一个可调用 Skill（输入客户表态语境→输出识别+对应话术），和 <code>side-hustle-pit-check</code> 串成\"识别人→防坑→成单\"闭环。</li>\n<li><strong>牛牛运动 BD SOP</strong>：把\"万能接话 + 三点弹药 + 二选一锁时间\"写进场馆拜访 checklist（合作档位照旧三档：基础/标准/全配，锚定标准版）。</li>\n<li><strong>副业定价/招生</strong>：所有\"商量\"场景统一用三点弹药（案例+限时+退出），把砍价/犹豫变成\"选档+锁时间\"。</li>\n<li><strong>每日简报「销冠思维」专栏</strong>：卡13（问最低价）+ 卡14（说要商量）打头阵，后续可拆\"逼单节奏\"\"异议处理\"\"转介绍\"。</li>\n</ul>\n<h2>附：三招反杀速查表（卡片主体价值）</h2>\n<table>\n<thead>\n<tr>\n<th>招式</th>\n<th>目的</th>\n<th>关键动作（话术骨架）</th>\n<th>禁忌</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>第一招·接住</strong></td>\n<td>摸出真假、定位合伙人卡点</td>\n<td>「商量是应该的。您跟合伙人主要定哪块？价格/效果/合作方式？我帮您捋捋」→ 他选哪个你就知道卡哪；答不上来=他自己有顾虑</td>\n<td>别卑微等消息、别当场逼单、别降价</td>\n</tr>\n<tr>\n<td><strong>第二招·给弹药</strong></td>\n<td>把客户变成你的销售</td>\n<td>直接给「三点」：①案例（同行业用了啥效果）②数字（限时优惠/补贴）③风险兜底（退费/退出保障）。从他嘴里说出来管用100倍</td>\n<td>别发一堆产品PDF、别继续吹产品、别要求\"把合伙人约出来我聊\"</td>\n</tr>\n<tr>\n<td><strong>第三招·锁时间</strong></td>\n<td>防拖黄</td>\n<td>「您看明晚聊，还是后天上午聊？我提前把测算表发您，有问题随时在线解答」+ 补「合伙人可直接打我电话」</td>\n<td>别问\"啥时商量好\"、别问\"啥时定\"、别说\"我明天打给您\"（姿态太低）</td>\n</tr>\n</tbody>\n</table>\n<p><strong>金句收尾</strong>：\n- 客户说商量一下，他要的不是时间，是一个帮他做决定的理由。\n- 合伙人不是你的敌人，是你要征服的第二个客户。\n- 你的客户就是你的销售，把装备给他配齐，他才能替你打赢这一仗。\n- 永远不要说\"您商量好联系我\"——这句话的前台词是\"我的命运交给你了\"。</p>\n<blockquote>\n<p>案例佐证：工厂设备 80 万单，周厂长说商量→万能接话摸出合伙人（小舅子）卡在\"回本周期\"→给回本测算弹药+二选一锁\"明晚聊\"→次日免提电话 10 分钟算清→第三天签单。SaaS 48000 年单，刘总监说\"汇报老板\"→姑娘当晚发一页纸三点（同规模效率提升/签约送3月试用省12000/30天全额退）→次日盖章回传，老板压根没问公司名。反例：建材销售说\"您随时联系\"没锁时间→两周后客户跟竞品签了。</p>\n</blockquote>"}, {"title": "情报级套话技巧（沟通/信息挖掘硬技能）", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<blockquote>\n<p>来源：抖音 @缪斯Musae《情报级套话技巧 #职场生存指南 #说话技巧 #沟通技巧 #识破套路》（223秒，内容引自一本暂无国内版的间谍/情报类书）\n蒸馏：2026-08-07 · 上野学习卡</p>\n</blockquote>\n<h2>一句话核心</h2>\n<p><strong>想从别人嘴里掏信息，别用疑问句，用陈述句。</strong> 疑问句触发人脑防御机制；陈述句让对方放下戒备，还方便继续深挖。三招都建在同一条原理上。</p>\n<h2>① 怎么用（三招 + 反向防御）</h2>\n<p><strong>底层原理</strong>：不用疑问句，用陈述句。听到\"问题\"人本能起防备；用\"陈述\"人容易接话、纠正、补充。</p>\n<p><strong>方法一 · 给对方错误信息（最高效）</strong>\n- 做法：用陈述句抛一个你想打听信息的\"错误答案\"。\n- 原理：人听到明显错误/不符认知的信息，会产生认知失调与不安，强烈冲动去纠正。\n- 例子：想打听连锁超市员工时薪，别说\"你一个月赚多少\"，而说\"我前两天刷抖音，说你们超市最低实薪都22块，这工作行啊\" → 对方：\"我实薪才13呢，你别闹了。\"\n- 名案：冷战约翰·沃克间谍案，故意在酒吧说\"美军潜艇涡轮18英寸跑太慢\"，诱导士兵在纠错中泄露真实参数。美军/CIA 安全培训里就有防套话训练。</p>\n<p><strong>方法二 · 给出模糊范围（最温和安全）</strong>\n- 做法：用陈述句给一个宽泛区间，让对方收拢。\n- 原理：人脑厌恶低信息密度的废话，听到大范围会本能想收拢信息；范围错了还会纠错。\n- 例子：面试官想问上家赔偿金，不说直话，而说\"你那级别裁员，补偿应该是6–8个月工资吧\" → 对方：\"可没那么多，统一定的是 N+1，算下来4个月。\"\n- 例子：问房价，\"这地段总价估计200万到400万\" → \"我们买得早，全下来260出头。\"\n- 特点：像在探讨客观情况，安全性高，但不如方法一高效。</p>\n<p><strong>方法三 · 故意怀疑（走情绪）</strong>\n- 做法：用陈述句轻描淡写地\"否定\"对方的努力/处境。\n- 原理：自我验证理论——人接受不了自己的努力和痛苦被别人轻描淡写否定，会忍不住反驳、倒出细节。\n- 例子：想挖项目卡点，不说直问，而说\"看你们天天发喜报，这项目肯定很顺，没啥阻碍吧，恭喜啊\" → 对方：\"我靠，这里事儿你不知道啊，我经历了……\"\n- 特点：勾的是情绪，对方哪怕只叹口气也露了苗头。</p>\n<p><strong>组合用法</strong>：看对象/关系/场景选招，可叠加。\n- 开口子：方法三（情绪破防）→ 方法二（温和收拢）→ 方法一（高效纠错）\n- 或只用三+二，或只用二+一，视情况。</p>\n<p><strong>⚠️ 反向防御（防止被套）</strong>：当你听到一个\"陈述句\"突然很想纠正/补充/反驳时，先停一秒——这可能正是对方在套你。尤其涉及薪资、底价、成本、客户名单、项目卡点时。</p>\n<h2>② 和之前项目关系</h2>\n<ul>\n<li>接《卡13 客户问最低价》《卡14 客户说要商量》：都是\"一人公司谈单沟通\"家族。那两张是应对客户防御，这张是<strong>主动挖信息</strong>，互补成\"沟通作战包\"。</li>\n<li>接《卡15 老李四·信息差》：信息差是副业命脉，这套话技巧就是<strong>低成本挖信息差</strong>的武器（挖供应商底价、竞品数据、客户痛点）。</li>\n<li>接《卡17 agent / 每日简报》：元宝做\"研究 Agent\"扒资料是机器挖；这套是人的\"人工挖\"，二者可配合（人用陈述句从关键人嘴里套，机器做公开面检索）。</li>\n<li>接 老照片修复客服智能体：客服机器人用陈述句式话术（\"你这张应该是泛黄了\"而非\"你照片怎么了\"）更符合人脑习惯，转化率更高。</li>\n</ul>\n<h2>③ 能不能挣钱（变现潜力：高）</h2>\n<ul>\n<li><strong>直接变现实用</strong>：一人公司谈单/砍价/挖供应商底价/竞品调研，本质都是\"套信息\"。掌握后谈价格更有底、挖痛点更准。</li>\n<li><strong>内容变现</strong>：小红书/抖音\"识破套路/职场说话技巧\"是常青高互动赛道，把这三招做成系列，引流知识星球（与你每日简报/星球漏斗天然契合）。</li>\n<li><strong>注意边界</strong>：用于商业信息搜集 OK；用于套取隐私/商业秘密/他人不愿公开的信息越界，勿碰红线（参照《撸店铺保证金踩坑警示》的合规意识）。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>建\"一人公司沟通作战包\"：把卡13+卡14+本卡合成一份「谈单/挖信息/防被套」三合一速查，给牛牛运动、老照片修复、未来所有副业共用。</li>\n<li>做成内容系列：①\"别人用这3句话套你\" ②\"面试官怎么用陈述句问出你底薪\" ③\"谈单时怎么用模糊范围压价\"——标题党但干货，易爆。</li>\n<li>反向训练：让元宝在每日简报/研究 Agent 里也用\"陈述句式提问\"去扒公开资料，提高信息密度。</li>\n</ul>\n<hr />\n<p><em>附：三招速记 = 错信息勾纠正 / 模糊范围勾收拢 / 故意怀疑勾自证。统一心法：把问号句号化。</em></p>"}, {"title": "巴菲特的稳，是普通人承担不起的代价", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<blockquote>\n<p>一级分类：个人成长 · 认知升级/思维模型\n来源：抖音「钱途迷经」《巴菲特的稳，是普通人承担不起的代价》（2026-08-09 拆解，15 分 21 秒，作者声明\"个人观点仅供参考\"）\n转写：<code>downloads/buffett/douyin-7670413363041668415/transcript.txt</code>\n项目关联度：高（认知升级直接作用于一人公司决策质量，与《见路不走》互为镜像）\n变现潜力：中（直接变现弱；\"反直觉财经/认知\"是小红书·抖音·知识星球高互动内容，引流强）</p>\n</blockquote>\n<hr />\n<h2>一句话结论</h2>\n<p>巴菲特的\"稳\"不是一种可以复制的\"人设\"，而是一种<strong>由童年大萧条创伤驱动、靠千亿浮存金托底的心理防御机制</strong>。普通人的资金有期限、有生存压力、有情绪，硬抄\"别人恐惧我贪婪\"≈ 用名言给自己的胆怯找理由，最后满仓套牢。</p>\n<hr />\n<h2>视频核心（三层解码）</h2>\n<h3>① 心理层：他的\"稳\"源于\"恐惧失控\"</h3>\n<ul>\n<li>1930 年出生赶上美国大萧条，父亲是股票经纪人、崩盘后几乎断收，一家人吃饭悬在头顶 → <strong>\"不确定=危险\"刻进骨头</strong></li>\n<li>6 岁挨家卖口香糖（利润固定、回款计时、不赊账）；9 岁蹲加油站数瓶盖统计哪种饮料最确定 → 从小在做同一件事：<strong>寻找确定性</strong></li>\n<li>11 岁买第一只股票，38 跌到 27 整夜睡不好；刚涨回 40 立刻抛（赚 5 美元），随后涨到 202 → <strong>他不是不想等，是\"等不了\"的痛苦比错过更难受</strong></li>\n<li>真正驱动他所有法则的，不是\"理性\"，而是<strong>避免失控感</strong></li>\n</ul>\n<h3>② 案例层：1964 伯克希尔纺织厂的\"代价\"现场</h3>\n<ul>\n<li>1962 年伯克希尔股价 7 美元，按清算价每股值 11 → 典型\"捡烟蒂\"（找快不行但股价比家当便宜的公司，分完剩余资产走人）</li>\n<li>1964 年总裁斯坦顿口头谈好 11.50，正式文件变 11.375（少了 0.125 美元，不到 1%）</li>\n<li>巴菲特<strong>暴怒</strong>：觉得被耍、事情脱离控制 → 非但不卖，反手加仓控股伯克希尔，把 ¼ 合伙资金锁进衰败纺织厂</li>\n<li>18 年像漏水机器吞资本，1985 年关最后一条产线，账用了 21 年还</li>\n<li><strong>核心洞察</strong>：为规避一次微小的\"失信风险\"，主动拥抱一个巨大的长期烂摊子——这就是恐惧失控的代价：<blockquote>\n<p>它会让你在最该退出的时候选择加码。情绪决策最危险的地方在于，它从不承认自己在失控，它给自己换一个体面的名字：<strong>尊严、坚持、不能认输</strong>。</p>\n</blockquote>\n</li>\n</ul>\n<h3>③ 转折层：芒格推他跨过边界</h3>\n<ul>\n<li>芒格：别捡烟蒂了，用便宜价格买烂公司=和烂生意缠斗；不如<strong>用合理价格买真正的好公司</strong></li>\n<li>1972 年 2500 万美元收购喜诗糖果——账面不便宜，值钱的是顾客信任/品牌忠诚/持续现金能力；巴菲特第一次<strong>愿意为质量付钱</strong></li>\n<li>真正转折不是\"赢了那场仗\"，而是\"赢之后意识到自己的方法有边界\"</li>\n</ul>\n<h3>④ 标题层：为什么普通人承担不起</h3>\n<ul>\n<li>巴菲特说\"别人恐惧我贪婪\"时，手里躺着<strong>上千亿近乎零成本、永不赎回的保险浮存金</strong>；你用的是<strong>工资</strong></li>\n<li>他还拥有：超长生命周期（99% 财富在 50 岁后）、系统化专业认知</li>\n<li>普通人：资金有期限（房贷/生活费）、有成本（杠杆利息）、有情绪压力 → <strong>\"稳\"对你意味着\"承担不起熬过周期所需的现金流与时间\"</strong></li>\n</ul>\n<hr />\n<h2>① 怎么用（迁移到上野的一人公司）</h2>\n<p><strong>认知纠偏（最重要的一条）</strong>：\n- 别把\"长期持有/别人恐惧我贪婪/慢慢变富\"当万能咒语。对没有浮存金、有生存现金流压力的普通人，硬扛波动=找死。\n- 上野你现在做的是<strong>副业/一人公司、零资金启动</strong>，更该学的是巴菲特的<strong>\"边界意识\"和\"确定性偏好\"</strong>，不是他的\"长期不动\"。</p>\n<p><strong>3 个可立刻落地的迁移</strong>：</p>\n<table>\n<thead>\n<tr>\n<th>迁移点</th>\n<th>上野怎么用</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>识别\"情绪换体面名\"的陷阱</strong></td>\n<td>副业/投资里，当你想用\"坚持/尊严/不能认输/再等等\"说服自己继续投钱/时间到一个走下坡的项目时 → 先问：这是理性，还是恐惧失控？最该退出时加码是致命伤。直接套用卡13/14 的\"身份识别\"反过来审自己。</td>\n</tr>\n<tr>\n<td><strong>建\"确定性\"现金流，而非押高波动</strong></td>\n<td>上野优势是做内容（每日简报）+ 卖铲子（客服智能体/信息差）+ 零资金。这本身就是\"找确定性\"——低风险、可复利、自己可控，而不是押注单一高波动项目。守住这条。</td>\n</tr>\n<tr>\n<td><strong>能力圈 + 安全边际</strong></td>\n<td>只做看得懂的生意（你懂内容/银发/运动/AI平替）；永远留退路（6 个月生活费、一门可变现硬技能——你已有\"指挥元宝\"）。\"不出局\"比\"一把暴富\"重要。</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li><strong>🔗 《见路不走》（天幕红尘卡）</strong>：<strong>互为镜像</strong>。见路不走说\"一句正确的话为何毁掉一个人\"——因为照搬别人的正确路径、忽略自身条件；这条视频说\"巴菲特的稳普通人承担不起\"——因为条件根本不同。<strong>可合成\"条件思维双卡\"</strong>：任何大师路径/爆款模式，先看\"他的条件我有没有\"，再决定是否抄。</li>\n<li><strong>🔗 销冠双卡（卡13/14）</strong>：那两张教\"识别客户防御、反杀商量\"，是<strong>对外</strong>；这条是<strong>对内</strong>——别被自己的叙事（尊严/坚持）欺骗。一外一内，合成\"一人公司沟通+自省作战包\"。</li>\n<li><strong>🔗 情报级套话（卡）</strong>：那张教\"用陈述句挖别人真话\"；这条补一刀——<strong>也别被自己脑子里的叙事骗</strong>。挖信息先挖自己。</li>\n<li><strong>🔗 冷门生意系列（床车/便利店/多肉）</strong>：同构——\"表面躺赚/稳赚，实际有普通人承担不起的硬条件\"。这条是财经版的总纲：<strong>所有'普通人也能抄'的财富叙事，先查条件差</strong>。</li>\n<li><strong>🔗 阿杭智能体卡</strong>：同样\"普通人别照搬大师\"——阿杭说\"拼积木卖结果\"才是普通人的路，不是死磕代码；这条说\"别死磕巴菲特的稳\"。底层一致：<strong>复制条件，不复制姿态</strong>。</li>\n</ul>\n<hr />\n<h2>③ 能不能挣钱</h2>\n<ul>\n<li><strong>直接变现</strong>：弱。这是认知/财经内容，不卖货、不卖课（作者自己声明不卖课）。</li>\n<li><strong>内容引流</strong>：强。反直觉财经是小红书/抖音/知识星球的高互动选题（\"你抄巴菲特为什么亏\"自带争议和收藏）。可做成\"反直觉认知\"系列，和第 ② 点的《见路不走》组成\"条件思维双卡\"引流。</li>\n<li><strong>认知产品</strong>：中。把\"条件思维/边界意识/安全边际\"包装成\"普通人投资决策自查清单\"或\"副业止损清单\"，可作免费引流钩子（和老照片修复那套\"卖铲子\"逻辑一致）。</li>\n<li><strong>对你本职的反哺</strong>：最高价值在<strong>决策质量</strong>——帮你在该止损时止损、该守住确定性时守住，避免\"为尊严加码\"烧掉副业本金。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸（下一步）</h2>\n<ul>\n<li>[ ] 把本卡 + 《见路不走》合成「条件思维双卡」可视化速查（同一内核两案例），作\"反直觉认知\"系列开篇</li>\n<li>[ ] 写一条小红书「你抄巴菲特为什么亏？因为他的稳你买不起」引流脚本（吃财经流量+星球）</li>\n<li>[ ] 给\"一人公司\"做一张「副业止损自查清单」（识别\"情绪换体面名\"的 5 个信号），复用卖铲子逻辑</li>\n<li>[ ] 记进捕获箱，作为\"认知/财经\"主题喂每日简报（用户已授权\"记下\"类动作）</li>\n</ul>"}, {"title": "朴素之道 · 单点突破法（如何练好字/口语/羽毛球/音体美）", "source": "抖音 @朴素之道《如何练好字，学好英语口语，打好羽毛球，学会各种音体美的技能？》#朴素之道 #学习觉醒 #学习方法 https://v.douyin.com/gOw1ullDIW8/（时长约 4′21″，已转写 1343 字）", "date": "", "category": "个人成长", "tags": [], "relevance": "极高（你所有\"拆解\"动作本质就是单点突破；与四问卡蒸馏、Vibe Coding、一人公司主线同构）", "monetize": "中（作者靠卖书《单点突破》变现；可借鉴做\"学习觉醒\"内容/星球引流，不直接挣钱但强引流）", "core": "", "body_html": "<h2>一、怎么用（核心方法）</h2>\n<p><strong>单点突破法 = 反\"摊大饼式学习\"</strong>。学新本领别一学一大片、没有重点，而是挑一个具体点，集中火力模仿到极致，这个点突破后，整体跟着蜕变（迁移效应）。</p>\n<p><strong>三个真实案例：</strong>\n1. <strong>练字</strong>：不用买整本字帖从头描到尾（纯浪费时间）。① 挑 10 个你觉得好看的字，花一周集中模仿，越像越好 → 所有字跟着蜕变变漂亮；② 若只想卷面分不潦草不扣分：每天 1 分钟在白纸上画\"横横横竖竖竖\"，只要横写得横、竖写得竖、相邻平行（横平竖直），每天 10 分钟，卷面分绝对不丢。\n2. <strong>学英文歌</strong>（作者学《Big Big World》）：大部分人从头听到尾循环 500/1000 遍也学不会唱。他每天只学<strong>一句</strong>，反复听、反复模仿、越像越好。一首歌用了两三个月，攻破后第二、第三首非常轻松；更关键——发音和口语都跟着蜕变（他成了\"村里英语最好的\"）。\n3. <strong>打羽毛球</strong>：很多人上场来回打根本学不会。只需把<strong>高远球</strong>这一个动作搞定，就能打败大部分业余选手。</p>\n<p><strong>适用面</strong>：音乐、体育、美术、办公软件、各种工作技能——凡是\"动身体\"或\"动脑子\"的技能都适用。底层逻辑是<strong>迁移</strong>：单点做到位，能力网络整体升维。</p>\n<p><strong>一句话口诀</strong>：挑一个点 → 集中火力 → 模仿到极致（越像越好）→ 等整体蜕变。</p>\n<hr />\n<h2>二、和我之前项目的关系</h2>\n<ul>\n<li><strong>与你所有\"拆解\"动作同构</strong>：床车/便利店/多肉/巴菲特/高客单智能体……你每次都是单点深挖一个生意模式，而不是广撒网。单点突破法是你一直在用的\"暗方法\"，这条视频把它命名了。</li>\n<li><strong>与四问卡蒸馏同构</strong>：每张四问卡 = 对一个内容的\"单点突破\"（挑一个视频/链接，挖到\"怎么用/关系/挣钱/灵感\"四层极致），而不是泛读收藏。</li>\n<li><strong>与 Vibe Coding 卡呼应</strong>：你 35 个作品（10 mini-app + 25+ mini-game）都是单点突破产物——先做一个小工具做到能跑，再复制做下一个，不是先学完编程再动手。</li>\n<li><strong>与「巴菲特的稳」卡（条件思维）镜像</strong>：单点突破是复制\"方法条件\"（可迁移的突破逻辑），不是复制\"姿态\"（别人的全套字帖/别人的完整套餐）。条件和姿态的区别在这里又一次出现。</li>\n<li><strong>与「姜胡说 PARA」「情报级套话技巧」同调</strong>：PARA 是信息层面的单点归类；套话技巧是沟通层面的单点深挖——都是\"别摊大饼\"。</li>\n</ul>\n<hr />\n<h2>三、能不能挣钱</h2>\n<ul>\n<li><strong>直接变现（作者路径）</strong>：卖方法论书《单点突破》——把一套学习方法产品化，靠短视频引流卖书（繁体版已卖到台湾）。这是\"知识产品化\"标准打法。</li>\n<li><strong>你的可借鉴路径</strong>：① 把\"单点突破法\"做成你「学习觉醒/一人公司」内容主线的一个支柱选题，去抖音/小红书/星球引流（零成本，复用你已有拆解能力）；② 做成\"技能速成\"迷你课或免费模板，引流到星球（接你做 3 的 Obsidian 模板 + 做 1 的 Vibe Coding 喂饭包，形成\"方法+工具\"组合）；③ 用单点突破法本身加速你学任何能变现的技能（如英语口语→可做跨境内容/英文短视频搬运）。</li>\n<li><strong>护城河</strong>：单点突破法谁都能说，但\"配真实案例 + 持续输出\"才是壁垒；你已有 26 张卡的方法论沉淀，可直接产品化。</li>\n</ul>\n<hr />\n<h2>四、灵感延伸</h2>\n<ol>\n<li><strong>「单点突破法」做成星球引流主题</strong>：写 1 篇\"我用单点突破法 30 天学会 X\"的实操记录（挑你想学的一个技能实测），比纯讲方法更有说服力，接你做 3 的模板包互相导流。</li>\n<li><strong>给知识库本身加\"单点突破\"使用规范</strong>：你蒸馏每张卡时本就该\"挑一个点挖到极致\"，可在 entry-template 顶部加一句提示，强化这套暗方法。</li>\n<li><strong>英语口语单点突破</strong>：你若想做跨境/英文内容，用作者\"每天一句反复模仿\"法，挑一首英文歌或一段台词，30 天突破发音——零成本、可记录成内容。</li>\n<li><strong>与\"见路不走/条件思维\"合成总卡</strong>：单点突破（复制方法条件）+ 巴菲特的稳（复制条件不复制姿态）+ 见路不走（不照搬路径）——三者可合成一张「条件思维与方法论」总卡，作你个人成长主线枢纽。</li>\n</ol>"}, {"title": "卡28 · 2026-08-09 麻省理工 AI 学习法（硅谷学霸用 AI 48 小时啃完一门新课）", "source": "抖音 @李睿讲Ai《500万人都在围观的麻省理工 AI 学习法》（约 3′45″，1080×1920）", "date": "", "category": "个人成长", "tags": [], "relevance": "极高（你整个\"蒸馏成四问卡\"流程 = 这套方法的变体；与单点突破法、情报级套话、四问卡体系同构）", "monetize": "高（\"父母必看/学霸\"高焦虑选题，内容引流强；方法可打包成\"AI 学习法喂饭包\"接做3模板互导）", "core": "", "body_html": "<h2>一、怎么用（核心方法）</h2>\n<p>学生伊特沙姆·阿里用 <strong>48 小时</strong>搞定一门完全陌生的课并通过资格考试，导师怀疑作弊、当场演示后沉默——\"我教了 20 年书，没想到 AI 还能这么用\"。</p>\n<p><strong>做法</strong>：把能找到的该领域所有资料（6 本教科书 + 15 篇顶刊论文 + 课程录音 + 笔记 + 一切）全扔进 AI，然后问 <strong>3 个神级问题</strong>：</p>\n<ol>\n<li><strong>要思维模型，不要知识点</strong>：\"这个领域里，所有专家都认同的 5 个核心思维模式是什么？\"——高手一上来问\"你们这群专家到底用什么思维框架看问题\"，而非背公式概念。</li>\n<li><strong>要争议地图，不要标准答案</strong>：\"这个领域里，专家争论最凶的 3 个问题是什么？双方核心论据分别是什么？\"——在争议里分清哪些是共识、哪些是分歧、边界在哪、已解决/未解决什么，从而画出\"知识地图\"。</li>\n<li><strong>要真懂检测器</strong>：\"请生成 10 个问题，用来判断一个人是真的深入了解这个领域，还是死记硬背。\"——AI 时代最怕\"以为自己懂了只是背了表面知识\"。答不出就追问漏洞、接着看、接着聊，把 AI 变成最严格的私人导师。</li>\n</ol>\n<p><strong>底层 3 逻辑</strong>：① 主动性（把 AI 当最严老师逼自己搞明白，不是有了 AI 就躺平）② 提问能力（提好问题是新门槛，\"专家怎么思考\"会带你进底层逻辑）③ 思维（工具会过时，但抓本质建框架、判断真懂假懂的能力最值钱）。结论：只会用 AI 抄答案→越来越弱；用 AI 训练提问/理解/复盘/表达→被 AI 带得越来越强。</p>\n<h2>二、和之前项目/方法的关系</h2>\n<ul>\n<li><strong>与你\"蒸馏成四问卡\"同构</strong>：你让我\"怎么用 / 和之前关系 / 能不能挣钱 / 灵感延伸\"——本质就是\"问 AI 神级问题逼它抓本质思维模型\"，和本卡第 1、3 问一模一样。你早就在用这套方法，只是没命名。</li>\n<li><strong>与「单点突破法」（卡27）同调</strong>：都反对\"摊大饼式学习\"——传统学霸从头啃教材，这两套都\"直接扔资料+精准提问\"，跳到本质。</li>\n<li><strong>与「情报级套话技巧」（卡）呼应</strong>：核心都是\"问对问题\"——挖别人真实意图 vs 逼自己抓领域本质，提问能力是共同底层。</li>\n<li><strong>与「Vibe Coding」（卡26）呼应</strong>：都用 AI 当\"做/学\"的引擎，主动性一致（AI 不是答案机，是协作方）。</li>\n<li><strong>与「巴菲特的稳 / 见路不走 / 条件思维」同线</strong>：抓\"专家思维框架\"= 复制条件不复制姿态；要\"争议地图\"= 见路不走（别只信无争议的标准答案）。</li>\n</ul>\n<h2>三、能不能挣钱（变现路径）</h2>\n<ul>\n<li><strong>直接弱，内容引流强</strong>：\"父母必看/学霸/AI 学习法\"是高焦虑高互动选题，适合做星球/视频引流。</li>\n<li><strong>方法产品化</strong>：把\"3 问 + 喂资料模板\"做成「AI 学习法喂饭包」，接你做3的 Obsidian 知识库模板互相导流（\"方法+工具\"组合）。</li>\n<li><strong>自家复用</strong>：以后让我拆任何视频/书，直接套这 3 问当骨架，蒸馏质量更高、更接近\"真懂\"。</li>\n</ul>\n<h2>四、灵感延伸（待执行）</h2>\n<ul>\n<li>① 把\"3 神级问题\"固化成知识库 entry-template 的提示语（\"扔资料+问思维模型/争议/真懂检测器\"），让每张卡自动更狠。</li>\n<li>② 做「AI 学习法喂饭包」去星球引流（复用做3模板包结构，零边际成本）。</li>\n<li>③ 英文/技能学习实测：挑一本陌生书，用 3 问让我带读，写成「48 小时啃完 X」记录引流。</li>\n<li>④ 与卡27（单点突破）、卡26（Vibe Coding）合成「个人成长·学习方法」总卡，作成长主线枢纽。</li>\n</ul>\n<hr />\n<ul>\n<li>视频本地：<code>downloads/mit-ai-learning/douyin-7669740560743238931/</code></li>\n<li>拆解页：<a href=\"../朴素之道单点突破法-拆解.html\">朴素之道单点突破法-拆解.html</a> 同目录 <code>麻省理工AI学习法-拆解.html</code></li>\n</ul>"}, {"title": "反洗钱陷阱防范：高价收你彩票 / 招你\"代收兼职\"都是坑", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<blockquote>\n<p>💡 <strong>建卡前先用「麻省理工 AI 学习法」3 神级问题逼 AI 抓本质</strong>（把该主题所有资料——书/文章/视频转写/报告——全喂给 AI 后问）：\n1. <strong>要思维模型，不要知识点</strong>：这个领域专家共识的 5 个核心思维模型是什么？\n2. <strong>要争议地图，不要标准答案</strong>：争得最凶的 3 个问题 + 双方论据？（共识 / 分歧 / 边界 / 已解决 vs 未解决）\n3. <strong>要「真懂检测器」</strong>：生成 10 个问题，判断我是真懂还是死记；答不出就追问漏洞、死磕到通透。\n然后用下面四问卡结构把答案 distill 进库。</p>\n</blockquote>\n<ul>\n<li><strong>来源</strong>：抖音《挂彩票、招兼职，洗钱手法有多离谱？反洗钱与防范洗钱》· https://v.douyin.com/RuKB87sVfbo/</li>\n<li><strong>收录日期</strong>：2026-08-10</li>\n<li><strong>一级分类</strong>：个人成长</li>\n<li><strong>二级标签</strong>：#反洗钱 #副业红线 #帮信罪 #跑分 #风险警示</li>\n<li><strong>项目关联度</strong>：中</li>\n<li><strong>变现潜力</strong>：低</li>\n<li><strong>一句话核心</strong>：有人 800 万买你 500 万彩票、招你\"代收代转兼职\"——本质都是拉你当洗钱通道；普通人防洗钱不是去学手法，而是守住\"不出借账户、不代收不明资金、不接异常高溢价交易\"三条红线。</li>\n</ul>\n<blockquote>\n<p>⚠️ 本卡是<strong>防范 / 反诈视角</strong>，只做原理级科普 + 识别特征，不提供任何可操作洗钱步骤。价值在\"不亏、不进去\"。</p>\n</blockquote>\n<hr />\n<h2>🔍 用「麻省理工3问」逼本质（建卡前先问）</h2>\n<p><strong>1. 思维模型（不是知识点）</strong>\n- <strong>洗钱三段式</strong>：放置 Placement（黑钱入渠）→ 分层 Layering（多层转账切断追溯）→ 整合 Integration（洗白回流成\"合法\"资产）。\n- <strong>\"黑变白\"本质</strong>：切断资金与上游犯罪的追溯链，让赃款看起来像合法收入。\n- <strong>温床三件套</strong>：难估值高价值资产（艺术品/古董/奢侈品）+ 跨境 + 现金/匿名 = 洗钱最爱。\n- <strong>金融终极玩法</strong>：空壳公司 + 慈善基金 + 资本项目运作（建项目→打折转手→华丽脱身）。</p>\n<p><strong>2. 争议地图（共识 / 分歧 / 边界）</strong>\n- <strong>共识</strong>：彩票、赌场、艺术品、奢侈品、黄金、空壳公司都是已知洗钱渠道，且彩票/赌场已纳入反洗钱监管（短时密集兑奖/大额换筹码/消极赌博都会被查）。\n- <strong>分歧 / 边界（对你更重要）</strong>：视频讲的多是\"高端/戏剧化\"手法，<strong>普通人最常踩的不是这些，而是\"帮信/跑分兼职\"</strong>——出借银行卡/收款码帮人代收代转赚提成。这才是副业者真正要防的，视频标题里的\"招兼职\"指的就是这类。\n- <strong>科普尺度</strong>：讲多细算教唆？视频选\"点到为止、知道太多不好\"，本卡同样只做识别+防范。</p>\n<p><strong>3. 真懂检测器（自测，答不出就回看）</strong>\n① 洗钱三段是哪三段？② 为何艺术品/古董是洗钱重灾区（难估值+跨境+可当礼物）？③ 有人 800 万买你 500 万彩票，你同意了法律后果？（涉嫌掩饰、隐瞒犯罪所得 / 帮信罪）④ \"招兼职\"洗钱最常见形态是什么？（跑分=出借账户代收代转）⑤ 期货多空对冲为何\"赚的那边\"钱变合法？</p>\n<hr />\n<h2>原文要点（我提炼，防范视角）</h2>\n<ul>\n<li><strong>彩票交换</strong>：800 万黑钱换 500 万中奖彩票 → 洗成合法 500 万（荷兰 ING 举报案、买一箱刮刮乐刮出合法奖金）。</li>\n<li><strong>赌场</strong>：赃款换筹码 → 装样子玩两把 → 换回账户资金；或勾结赌场伪造记录。已被监管，异常行为会被查。</li>\n<li><strong>古董/艺术品</strong>：黑钱买画 → 蒙混海关 → 他国拍卖洗白；巴西银行总裁把 800 万美元巴斯奎特画申报 100 美元带入纽约。</li>\n<li><strong>奢侈品/珠宝/名表/黄金</strong>：随身携带 + 全球可变现；黄金熔融后无法追溯来源。</li>\n<li><strong>金融终极</strong>：慈善基金（教父）、瑞士银行+空壳公司（华尔街之狼发行债券链）、风电项目打折转手资本运作（意大利\"风之王\"）。</li>\n<li><strong>期货对冲</strong>：两账户一多一空，无论涨跌总有一边赚，赚的那边变\"合法\"。</li>\n<li><strong>落脚点</strong>：重点是\"反洗钱与防范洗钱\"。</li>\n</ul>\n<hr />\n<h2>① 怎么用（识别 + 防范）</h2>\n<p><strong>现在马上能做：</strong>\n1. <strong>守三红线</strong>：① 不出借银行卡/收款码给他人走账；② 不替人代收不明资金再转出（哪怕给提成）；③ 不接\"异常高溢价收购你资产\"的交易。\n2. <strong>识别陷阱信号</strong>：有人高价收你中奖彩票/刮刮乐、招你\"兼职帮忙刮卡/转账/代收\"、超高溢价收你二手奢侈品古董、让你\"用你账户走账给提成\"——99% 是拉你洗钱，拉黑别犹豫。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- \"帮信罪/跑分\"识别清单，接入副业红线检查器（<code>pit-red-scan</code>）。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>副业红线检查器（pit-red-scan）</strong>：补\"跑分/代收兼职/高溢价收购\"三类红线词。</li>\n<li><strong>撸店铺保证金反例卡</strong>：同属风险警示系列，可聚合成\"副业避坑清单\"。</li>\n<li><strong>每日简报</strong>：反诈/反洗钱可作为\"冷知识/财经\"主题选题（契合你多主题简报）。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li><strong>结论</strong>：潜力<strong>低</strong>（警示卡）。价值不在赚钱，在\"不亏、不进去\"。</li>\n<li><strong>反向价值</strong>：反诈科普内容本身有流量（契合简报/星球选题），但<strong>绝不能写成\"洗钱教程\"</strong>，只能写\"识别+防范\"。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>副业红线检查器补\"跑分/代收/高溢价收购\"三类红线词，与 <code>knowledge-base/tools/副业红线检查器.html</code> 双向同步。</li>\n<li>做\"副业避坑清单\"内容系列：撸保证金 / 跑分 / 多肉寄养 / 便利店伪装，聚合你库里所有反例卡，做成一篇公众号长文或 mini-app。</li>\n</ul>"}, {"title": "2026-08-11-专升本骗局话术拆解", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<p>title: 卡37 · 专升本骗局话术拆解：卖的是\"门快开了\"的幻觉，不是学历\ndate: 2026-08-11\ncategory: 个人成长\ntags: [专升本骗局, 话术拆解, 副业红线, 自我提升避坑, 学历焦虑, 反诈]\n项目关联度: 中\n变现潜力: 低\nsource: 抖音《欢迎来到社会黑箱系统：专升本 警惕骗局》· https://v.douyin.com/ftiacfU5Vno/</p>\n<hr />\n<blockquote>\n<p>⚠️ 防坑视角，不是教程。只拆话术结构 + 识别信号，价值在\"不亏、不进去\"。</p>\n</blockquote>\n<h2>一句话核心</h2>\n<p>所谓\"专升本/学历提升机构\"卖的从来不是学历，而是<strong>\"门快开了\"的幻觉</strong>——用一套精密话术，把被门槛卡住的人一层层往里套：锚定痛点→给出口→稀缺逼单→分期降门槛→升级费→销售离职承诺清零→退费条款陷阱→维权群二次收割。副业者最该学的是<strong>识别这套\"入口-留存-续费-晚走\"结构</strong>，别在自我提升上被人割。</p>\n<h3>麻省理工3问逼本质</h3>\n<ul>\n<li><strong>思维模型</strong>：</li>\n<li>痛点锚定模型（先戳\"本科以上\"四个字扎的痛点，再给\"不是你不行只是少张票\"的出口——否定式安慰比优惠更管用）；</li>\n<li>稀缺逼单模型（\"今天补贴名额/锁不住\"制造损失厌恶）；</li>\n<li>分期降门槛模型（26000 变\"每月几百块少喝几顿奶茶\"，把决策成本切碎）；</li>\n<li>升级费漏斗模型（2600 是\"进群费\"，后面资料费/考务费/冲刺班/押题课层层开新门）；</li>\n<li>承诺清零模型（销售离职，新班主任一句\"老师表达比较乐观\"把之前所有承诺作废；退费条款\"缺课不退/逾期不退/服务开通不退\"是另一张考卷）；</li>\n<li>二次收割模型（维权群里还有人发\"认识内部老师可加急退费\"——同一套人换马甲再割一轮）。</li>\n<li><strong>争议地图</strong>：视频是故事化演绎（非具体机构实锤），但话术结构是真人真事提炼，对\"学历提升/考证培训/副业培训\"都通用；正规学历提升渠道（自考/成考/开放大学）确实存在，坑在\"一年半拿证学信网可查不耽误上班\"这类超常承诺。</li>\n<li><strong>真懂检测器</strong>：① 销售/班主任/打卡/退费各自真实职能是什么？② 为什么\"分期\"比\"全款\"更容易让人冲动？③ \"升级\"二字怎么把二次收费变体面？④ 退费条款为什么是\"另一张考卷\"？⑤ 维权群二次收割怎么识别？⑥ 这套结构在\"副业培训/知识付费\"里长什么样？</li>\n</ul>\n<h3>① 怎么用（识别 + 防范）</h3>\n<ol>\n<li><strong>守识别信号</strong>：看到\"一年半拿证 / 学信网可查 / 不耽误上班 / 今天名额锁不住 / 月付几百无压力 / 不过退费\"——先停。正规学历提升没有\"速成+随时退\"双保险，凡同时承诺这两项的，99% 是漏斗。</li>\n<li><strong>副业培训同构识别</strong>：你做/买\"副业课\"时也套这把尺——\"7天起号/保变现/0基础月入X万/分期免息/不过退费\"是同一套话术结构。买课前问：交付物具体是什么？退费条款原文怎么写？有没有真实学员案例（非截图笑脸）？</li>\n<li><strong>守住两条线</strong>：① 不借消费贷/分期去买\"自我提升\"（利息+沉没成本双重锁）；② 合同逐字读退费章，别信口头\"放心正规\"。</li>\n<li>存知识块：\"培训话术拆穿清单\"（入口/留存/续费/晚走四角色 + 漏斗信号），接入副业红线检查器。</li>\n</ol>\n<h3>② 和你之前项目的关系</h3>\n<ul>\n<li><strong>反洗钱防范卡 / 撸保证金反例卡</strong>：同属\"副业避坑/防坑\"系列，可聚合成\"副业避坑清单\"（风险页）。</li>\n<li><strong>短视频独立思考卡</strong>：同属\"独立判断、不被带节奏\"——骗局本质是操控你的情绪决策（痛点+稀缺+从众），和\"傻子共振\"同源。</li>\n<li><strong>一人公司方向</strong>：你若做知识付费/副业培训，反向启示——用真实交付建信任，不画\"快上岸\"幻觉；把\"退费保障\"写成白纸黑字而非话术。</li>\n<li><strong>每日简报</strong>：反诈/防坑可作\"财经/生活/冷知识\"主题选题。</li>\n</ul>\n<h3>③ 能不能帮你挣钱</h3>\n<ul>\n<li>结论：潜力低（警示卡）。价值不在赚钱，在\"不亏、不进去\"。</li>\n<li>反向价值：① 反诈/防坑内容有共鸣流量（\"培训话术拆穿\"系列）；② 你做知识付费时，用\"不画幻觉、真实交付\"差异化立信任，反而更长效——这是把\"避坑认知\"变成\"产品观\"。</li>\n</ul>\n<h3>④ 灵感延伸</h3>\n<ul>\n<li><strong>副业红线检查器</strong>补一类红线词：\"学历提升/考证培训骗局 + 副业培训话术漏斗\"，与 <code>副业红线检查器.html</code> 双向同步。</li>\n<li>做\"培训话术拆穿\"内容系列，聚合所有反例卡（专升本/反洗钱/撸保证金/车企测试员），作副业作战地图\"风险页\"。</li>\n<li>若你将来做副业培训，写一份\"我的交付承诺白名单\"（明确写退费条件、交付物清单），当信任锚。</li>\n</ul>\n<blockquote>\n<p>卡片：categories/个人成长/2026-08-11-专升本骗局话术拆解.md | 拆解页：专升本骗局话术拆解-拆解.html | 由 video-distill 一键生成</p>\n</blockquote>"}, {"title": "卡36 · 李笑来「换母语」英语学习法：劫持潜意识 + self-talk + 朗读闭环", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<ul>\n<li>来源：抖音《YouTube大神分享｜brain学霸｜英语没那么难》@Mr.張 · https://v.douyin.com/aWGatwtiHAk/</li>\n<li>日期：2026-08-11</li>\n<li>分类：个人成长</li>\n<li>标签：#李笑来 #换母语 #self-talk #潜意识 #朗读闭环 #健脑房 #英语学习 #怎么真学懂</li>\n<li>项目关联度：极高 | 变现潜力：中高</li>\n</ul>\n<p><strong>一句话核心</strong>：李笑来（比特币首富/新东方名师）的英语方法论 = 把\"首要语言\"从中文换成英语。做法不是死背，而是用「self-talk 三零件（身份+理由+情绪）出声+用第二语言」劫持潜意识、每天雷打不动 3 小时朗读（读不顺=没读懂的照妖镜）、把学英语当成\"最划算的健脑运动\"。对你——这是\"怎么真学一门语言/技能\"的可复用系统，且处处能用元宝（AI 翻译地道英语、当陪练）。</p>\n<h3>麻省理工3问逼本质</h3>\n<ul>\n<li><strong>思维模型</strong>：</li>\n<li>换母语/首要语言模型：你的\"母语\"不是出生语言，是<strong>发呆自言自语时脑子里自动冒出的声音</strong>（说梦话哪种语言就是哪种）；它能被更换（李笑来朝鲜语→中文→英语换过两次）。</li>\n<li>潜意识 hijack 模型：潜意识比清醒意识<strong>早 500ms–10 秒</strong>先动手，靠意志力硬扛必输；要绕到潜意识背后\"骗\"它。</li>\n<li>潜意识三弱点：①熟悉优先（你自己的声音潜意识无条件信）②重复优先（谎言重复千遍变真理，广告轰炸原理）③知行合一（认定自己是某种人，行为会去印证）。</li>\n<li>self-talk 三零件：身份陈述（I am a person who thinks in English，不是\"我要学英语\"任务式）+ 理由（because…大脑听到\"因为\"就松警惕，真假不重要）+ 情绪标签（爽/骄傲/踏实，情绪是潜意识快捷键）；<strong>必须出声</strong>（动用100+肌肉抢回那10秒）+ <strong>用第二语言说</strong>（潜意识对英语不熟、没法抬杠）。</li>\n<li>朗读闭环模型：眼→脑→嘴→耳→脑，完整回路；<strong>读不顺=理解漏洞的照妖镜</strong>。</li>\n<li>健脑房模型：学语言=练大脑肌肉，需强度（每天3h）逼出\"神经撕裂\"才长新连接，类比健身；强度不够连接缩回去。</li>\n<li>1000小时密度模型：李笑来2024把格拉德威尔\"1万小时\"砍到1000（每天3h×1年），英语撑过6个月渐入佳境，前提是\"每天少于3小时免谈\"。</li>\n<li><strong>争议地图</strong>：</li>\n<li>1000 vs 1万小时：口径不同——格拉德威尔是\"精通\"阈值，李笑来是\"换母语入门\"，非矛盾。</li>\n<li>\"换母语\"普通人能否复制：李笑来本人写书时概念先想到英语（自称做到），但需高强度+长期，普通人能否成存疑。</li>\n<li>脑科学依据（双语者灰质密度高、延缓痴呆/帕金森、对抗抑郁）有研究支持，但\"最划算健脑运动\"是营销化表述、程度夸张。</li>\n<li>self-talk 用第二语言\"潜意识没法抬杠\"有道理（陌生语言认知资源高、理性反驳弱），效果因人而异。</li>\n<li><strong>真懂检测器</strong>：①\"首要语言\"怎么定义、怎么测（梦话）？②潜意识比意识早动多少、为何靠毅力戒烟必败？③self-talk 三零件是什么、为何要\"出声+第二语言\"？④朗读为何是照妖镜、读不顺说明什么？⑤为何每天&lt;3h免谈、密度不够大脑怎么了？⑥\"健脑房\"理论的脑科学依据？⑦身份陈述 vs \"我要戒烟/我要学英语\"差在哪？</li>\n</ul>\n<h3>① 怎么用（对我）</h3>\n<ol>\n<li><strong>学英语/任何语言</strong>：每天出声练一句 self-talk——<code>I am a person who thinks in English, because that is the life I choose, and it feels damn good.</code> 用<strong>元宝翻译你想说的地道英语</strong>（视频里就建议用 AI 翻口语版），不自己硬翻。</li>\n<li><strong>不止语言，迁移任何习惯</strong>：身份陈述撬\"知行合一\"——想日更就说 <code>I am a person who ships daily</code>（我是每天交付的人）；李笑来无痛戒烟=把\"我要戒烟\"换成\"我是个不抽烟的人\"，劫持潜意识。你做一人公司可用这招固化\"每天出交付\"身份。</li>\n<li><strong>朗读闭环学任何资料</strong>：读不顺=没读懂。用在\"读四问卡/读书\"——出声读卡，卡壳处就是理解漏洞，立刻让元宝补齐。<strong>本卡即此法的活样例</strong>（你刷到视频→蒸馏成卡，是把\"被动刷\"变\"主动转化\"）。</li>\n<li><strong>内容在前、语言在后</strong>：先中文写清想说的→元宝翻地道英文→跟读模仿语气→背都不用背就溜出。你做英文简报/跨境内容可直接复用这条流水线。</li>\n<li>存知识块：「self-talk 三零件」模板（身份+because+情绪，出声+第二语言）；「朗读闭环=照妖镜」；「潜意识三弱点」。</li>\n</ol>\n<h3>② 和你之前项目的关系</h3>\n<ul>\n<
