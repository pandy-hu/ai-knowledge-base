<script>
var ENTRIES=[{"title": "零基础搭 AI 知识库，四步闭环越用越聪明", "source": "抖音 @姜胡说（视频链接 https://v.douyin.com/MDxC1r46FH8/ ，用户提供字幕）", "date": "2026-07-25", "category": "AI与方法", "tags": ["知识管理", "AI学习", "零基础", "个人成长", "姜胡说"], "relevance": "高", "monetize": "高", "core": "别用「准备」逃避开始——先上场，把看到的好内容直接喂给 AI，让它替你分「现在用 / 未来用」，每天复盘，越用越聪明。", "body_html": "<h2>原文要点（我提炼）</h2>\n<ol>\n<li><strong>第一步 工具准备</strong>：用 WorkBuddy + CodeBuddy（视频里叫 Workbody / Coder Work），免费、每天送积分，拿来即用，不配环境、不纠结 Cloud Code / Codex。</li>\n<li><strong>第二步 建档案</strong>：告诉 AI「你是谁、干嘛的、优点、缺点、目标、卡点」，把它当几十万的咨询顾问，让它记住你，以后给你建议、方法、朝目标推。</li>\n<li><strong>第三步 喂内容</strong>：看到好文章直接复制给 AI；好视频/音频给链接。问它「根据我的情况，这知识怎么用」——它列「现在马上能用的一二三」和「未来能用的知识块」。</li>\n<li><strong>第四步 每天复盘</strong>：用了之后说「我现在这么用，结果是这样，你复盘下，告诉我怎么改进」。每天做，几天就和别人不一样。</li>\n<li><strong>核心心智</strong>：很多人学傻了，非要「学会再用」；正确是「先上场，一边学一边用，甚至不必懂，先帅起来」。</li>\n</ol>\n<hr />\n<h2>① 怎么用</h2>\n<p><strong>现在马上能做：</strong>\n1. <strong>补一份「目标 + 卡点」档案</strong>：我已知你是上野（上海 / 关注 AI·创业·信息差），但视频法强调主动让 AI 当顾问。你下条消息补一句「我的目标 XX、卡点 XX」，我记进长期记忆。\n2. <strong>把「喂内容→问怎么用」固化</strong>：本知识库就是这个动作的产品化——你贴内容，我出四问卡。\n3. <strong>每天复盘接进现有简报</strong>：你已有「每日 AI 热点简报自动化」，我在简报末尾加一段「今日可落地的 1 个动作 + 复盘提问」，闭环就成了。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- 「先上场再学」心态，可作为你所有内容产品的统一方法论标签。\n- 「知识块」概念 → 以后每条卡都能被检索、被二次组合成文章/课。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>每日 AI 热点简报</strong>：现成的「喂内容」管道，每天已有 AI 资讯流入；只差补「复盘 + 怎么用」两环，正好和本知识库合并成一条流水线。</li>\n<li><strong>mini-apps / mini-games</strong>：可直接做一个「个人知识库」网页应用（卡片 + 标签 + 搜索 + 移动端），这是顺手的开发项目，也能当 demo 接单。</li>\n<li><strong>GitHub SSH 免密</strong>：知识库可版本化备份到新仓库（或并入 web-games 仓库），防丢、可公开当作品集。</li>\n<li><strong>元宝变现意图</strong>：这条本身就是「用元宝当低成本虚拟员工」的最佳示范案例。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li><strong>路径 A（卖方法论）</strong>：把「四步闭环」包装成小报童专栏 / 知识星球 / 短视频系列，你已是案例，自带信任。</li>\n<li><strong>路径 B（卖工具/模板）</strong>：做「个人 AI 知识库」网页模板或 Notion/腾讯文档模板，按订阅或一次性卖。</li>\n<li><strong>路径 C（接单）</strong>：帮小白搭「自己的 AI 知识库 + 顾问档案」，你用自己跑通的流程交付，客单价低但可批量。</li>\n<li><strong>路径 D（信息差产品）</strong>：每日简报 + 知识库筛选 → 付费「AI 机会日报」，你已有自动化底座。</li>\n<li><strong>结论</strong>：<strong>变现潜力高</strong>。方法轻、可复制、和你已有资产（简报/游戏/SSH）100% 咬合，启动成本≈0。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>把知识库做成<strong>手机 HTML 浏览器</strong>（搜索+标签），你手机上看更爽，也能当产品卖。</li>\n<li>做一个<strong>「喂我一条，出一张卡」的小工具</strong>，朋友圈/社群引流用。</li>\n<li>四步法 → 拍成你自己的短视频，反哺「姜胡说」这类流量池，做个人 IP。</li>\n</ul>"}, {"title": "撸店铺保证金能发财？小心坐牢（黑灰产揭秘·反例卡）", "source": "抖音 @未知（链接 https://v.douyin.com/oBSG7vARkjw/ ，标题+标签由用户提供，暂无逐字稿）", "date": "2026-07-25", "category": "个人成长", "tags": ["踩坑警示", "黑灰产揭秘", "合规红线", "变现避坑", "认知", "捞偏门"], "relevance": "中", "monetize": "低（作为「方法」本身违法不可行；作为「揭秘内容」可中）", "core": "所有「撸平台/撸保证金/撸漏洞」的偏门，本质多是诈骗或非法经营，轻则封号冻款，重则坐牢——它是「绝不能碰的红线」，不是「能发财的路子」。", "body_html": "<h2>原文要点（据标题+标签推断，待补逐字稿）</h2>\n<ul>\n<li>主题：拆解「撸电商店铺保证金」类偏门玩法的真实风险，标题直接点出「小心坐牢」。</li>\n<li>标签含 #捞偏门 #赚钱 #黑灰产揭秘 —— 属于「揭秘/劝退」向内容，不是教学。</li>\n<li>「撸店铺保证金」通常指利用平台保证金（如淘宝/拼多多/抖音小店缴纳的押金）的退款或规则漏洞套现，往往涉及虚假交易、伪造材料、恶意投诉等行为。</li>\n</ul>\n<blockquote>\n<p>⚠️ 说明：本条仅依据用户给的标题与标签生成，我未拿到视频逐字稿。如你贴出文案/字幕，我可补全「具体手法 + 对应法条 + 判罚案例」，让这张卡更扎实。</p>\n</blockquote>\n<hr />\n<h2>① 怎么用</h2>\n<p><strong>现在马上能做：</strong>\n1. <strong>当成红线清单</strong>：把「撸平台/撸保证金/撸漏洞/刷单/跑分/接码」这类词加入你的「副业黑名单」。以后任何副业 idea 一旦沾这些词，直接 pass，不浪费时间评估。\n2. <strong>建一个「合规自检」小问题</strong>，贴在你每天的副业思考里：「这事儿合法吗？平台允许吗？要我伪造/欺骗吗？」三问任一为否，就不做。\n3. <strong>当内容素材</strong>：「黑灰产揭秘」本身是个能吸流量的内容赛道（你标题里的标签就是证明），可反向做成你未来账号的「避坑科普」系列。</p>\n<p><strong>未来能用的（存成知识块）：</strong>\n- 「偏门→违法」映射表：撸保证金/刷单/跑分/接码/搬砖套利 各自对应的法律风险，攒多了就是一篇「副业避坑手册」。\n- 「合规自检三问」模板，复用到所有副业评估。</p>\n<hr />\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>每日 AI 热点简报</strong>：可加一个「副业风险」栏目，顺手把当天看到的黑灰产/割韭菜套路标记出来，既是内容也是自我保护。</li>\n<li><strong>一人公司 / 副业探索</strong>：这是你「不想踩坑」约束的最硬核注脚——用真实法律风险给所有副业想法做第一道筛子，省下大量试错成本。</li>\n<li><strong>知识库本身</strong>：应在分类里长期保留「踩坑警示」子标签，让反例和正例并列，知识库才有「避坑」功能，而不只是「找机会」。</li>\n<li><strong>mini-apps / 内容账号</strong>：可做一个「这个副业 idea 踩红线了吗」小工具/互动帖，引流到你未来账号。</li>\n</ul>\n<hr />\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li><strong>路径 A（照搬方法）</strong>：❌ 不可行。视频本身就在警告「小心坐牢」，这类玩法多为诈骗/非法经营，封号冻款是轻的，刑责是实的。与你「零风险、不踩坑」底线直接冲突，坚决不做。</li>\n<li><strong>路径 B（揭秘内容变现）</strong>：✅ 可行且低风险。把「黑灰产揭秘/副业避坑」做成短视频或图文，吃的是「认知差+猎奇+避险」流量，可接广告、带货合规工具、沉淀私域。启动成本≈0，契合你一人公司方向。</li>\n<li><strong>结论</strong>：作为「方法」变现潜力=低（违法）；作为「内容素材」变现潜力=中。这张卡对你最大的钱，是<strong>帮你少亏一笔钱、少冒一次险</strong>，以及提供一条合规的内容赛道。</li>\n</ul>\n<hr />\n<h2>④ 灵感延伸</h2>\n<ul>\n<li><strong>「副业红线」检查器</strong>：一个网页小工具，输入副业想法，自动比对黑名单词库+合规三问，输出「高危/注意/可行」——可挂你 GitHub Pages，引流用。</li>\n<li><strong>「黑灰产揭秘」内容系列</strong>：按「手法→风险→真实案例→正确做法」四段式，做成你账号的常青栏目，反哺流量池。</li>\n<li><strong>知识库升级</strong>：在 index.md 统计里加「踩坑警示 N 条」维度，让反例可视、可检索，知识库从「找机会」进化成「机会+避坑」双引擎。</li>\n</ul>"}, {"title": "仓颉 Skill（cangjie-skill）解析：把内容蒸馏成可调用技能", "source": "GitHub `kangarooking/cangjie-skill`（作者「袋鼠帝」，MIT 协议，1.3K Star）+ 成品仓库 `kangarooking/kangarooking-skills`", "date": "", "category": "AI与方法", "tags": [], "relevance": "高", "monetize": "高", "core": "", "body_html": "<h2>一句话核心</h2>\n<p>cangjie-skill 是一个「内容蒸馏器」：把书、长视频、播客转写成一组<strong>可调用 Agent Skills（方法论单元）</strong>，而不是写一篇摘要。本质是「把看过的东西，变成能一句话调出来的工具箱」。</p>\n<h2>原文要点（已抓 GitHub 仓库分析）</h2>\n<ul>\n<li><strong>仓库结构</strong>：<code>SKILL.md</code>（元 skill 执行规范）+ <code>methodology/</code>（RIA-TV++ 各阶段）+ <code>extractors/</code>（5 个并行提取器 prompt）+ <code>templates/</code>（SKILL.md/INDEX.md/BOOK_OVERVIEW.md 模板）。协议 MIT，可商用复用。</li>\n<li><strong>核心流水线 RIA-TV++（七阶段）</strong>：</li>\n<li>整体理解（Adler 分析阅读法）→ <code>BOOK_OVERVIEW.md</code></li>\n<li>并行提取（框架/原则/案例/反例/术语 5 路）</li>\n<li>三重验证筛选（≥2 处佐证 / 有预测力 / 非常识，通过率仅 25-50%）</li>\n<li>RIA++ 构造（R 原文/I 重写/A1 案例/A2 触发场景/E 可执行步骤/B 边界盲点）</li>\n<li>Zettelkasten 链接 → <code>INDEX.md</code></li>\n<li>压力测试（诱饵题 + 跨 skill 混淆）→ <code>test-prompts.json</code></li>\n<li>交付（安装到 Claude Code / Codex 的 skills 目录）</li>\n<li><strong>视频蒸馏</strong>：需先借 <code>video-downloader</code> skill 把视频转成文本（下载+字幕/ASR），再喂给 cangjie-skill。</li>\n<li><strong>关键发现</strong>：<code>kangarooking-skills</code> 里的 <code>video-downloader</code> <strong>支持抖音、B站、YouTube、小红书</strong>，可同时提取「平台原始文案」+「ASR 口播稿」——这正是补上你昨天问的「抖音链接读不到口播稿」痛点的现成方案。</li>\n</ul>\n<h2>① 怎么用（落到你的知识库）</h2>\n<ul>\n<li><strong>升级出卡流程</strong>：把「喂内容→四问卡」升级为「喂内容→蒸馏成 skill」。同一段素材，既存知识（卡），又沉淀方法（skill），知识库从「笔记本」进化成「工具箱」。</li>\n<li><strong>直接解决抖音提取</strong>：把 <code>video-downloader</code> 的思路接进知识库喂料管道（抖音链接→原始文案+口播稿→出卡/蒸馏）。注意它本地需要 <code>yt-dlp</code> + ASR（Whisper 或免费 API），属进阶项，先评估再上。</li>\n<li><strong>变成我的能力</strong>：我（元宝）本就支持 Skill 系统（SKILL.md）。可把 RIA-TV++ 蒸馏法蒸馏成我自己的「内容蒸馏」skill，以后你丢书/视频/播客，我自动走七阶段出 skill——这是本条最实在的落地。</li>\n</ul>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li><strong>知识库（强相关）</strong>：蒸馏 = 知识库的终极形态；你已有的「四问卡」是轻量蒸馏，cangjie-skill 是工业化蒸馏。</li>\n<li><strong>元宝 Skill 系统（强相关）</strong>：格式兼容（均 SKILL.md + 开放标准 agentskills.io），可把成品 skill 直接装进我的技能库复用。</li>\n<li><strong>视频蒸馏成 Skill 卡（上一条，强相关）</strong>：本条是那条的方法论源代码。</li>\n<li><strong>抖音文案提取指引卡（强相关）</strong>：<code>video-downloader</code> 就是该卡「方式 B/C」的现成实现。</li>\n<li><strong>红线检查器 / 每日简报</strong>：蒸馏出的「副业/起号」类 skill 可组合成「一人公司工具箱」卖。</li>\n</ul>\n<h2>③ 能不能挣钱</h2>\n<ul>\n<li><strong>路径 A</strong>：卖蒸馏服务——帮人把书/课/播客蒸馏成 skill 包，按本/小时收费，成本≈0（吃 AI 能力）。</li>\n<li><strong>路径 B</strong>：卖成品 skill 包——作者已蒸馏出《爆款文案》《影响力》《疯传》巴菲特信等，你可二创/汉化/本地化后挂小报童/知识星球。</li>\n<li><strong>路径 C</strong>：教蒸馏方法——短视频/图文「如何把书变成工具箱」，吃认知差。</li>\n<li><strong>路径 D</strong>：知识库 + 蒸馏组合包——你的浏览器 + 红线检查器 + 蒸馏 skill，打包「一人公司工具箱」。</li>\n<li><strong>结论</strong>：变现潜力高，启动成本≈0，且与你已有资产直接复用。MIT 协议允许商用，注意保留署名。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li><strong>做成我的「内容蒸馏」Skill</strong>（本次可落地）：把 RIA-TV++ 蒸馏成我自己的 skill，你丢内容我自动出 skill 包。</li>\n<li><strong>video-downloader 接进喂料管道</strong>：抖音链接一键出原文+口播稿，直接喂知识库。</li>\n<li><strong>「书/视频→技能包」服务产品</strong>：对小白是刚需，可做标准化交付。</li>\n</ul>\n<h2>⚠️ 合规与边界</h2>\n<ul>\n<li><code>video-downloader</code> 涉及平台视频下载，注意版权与平台 ToS；仅用于<strong>你自己有权限</strong>的内容。</li>\n<li>复用成品 skill 包注意 MIT 署名要求；二创/商用保留原作者信息。</li>\n<li>与红线检查器一致：不碰他人私密/侵权内容。</li>\n</ul>"}, {"title": "视频蒸馏成 Skill：把任何视频变成可复用工作流", "source": "抖音（链接 https://v.douyin.com/y2ZC1Y1GV5A/ ，作者「开源仓颉」）", "date": "", "category": "AI与方法", "tags": [], "relevance": "高", "monetize": "高", "core": "", "body_html": "<h2>一句话核心</h2>\n<p>「蒸馏」= 把一段视频/一堆资料的<strong>隐性经验，抽成可复用的标准化步骤（Skill/工作流）</strong>。你不用自己摸索，把爆款案例喂给 AI，让它吐出「照着做就能复现」的 SOP。</p>\n<h2>原文要点（据标题+描述推断，待补逐字稿）</h2>\n<ul>\n<li>主题：开源一个「仓颉.Skill」，能把任意视频蒸馏成 skill。</li>\n<li>示范案例：基于某平台「起号」的大量视频资料，蒸馏出一个「起号 skill」，用于冷启动。</li>\n<li>定位：#开源 #拆书 #蒸馏 #玩儿个很新的东西——属于「方法论开源 + AI 提效」向。</li>\n<li>本质：把「看别人怎么做的」变成「我也能按步骤做」的资产。</li>\n</ul>\n<h2>① 怎么用</h2>\n<ul>\n<li><strong>现在就用</strong>：遇到爆款视频/干货长文，别只收藏——让 AI 蒸馏成「步骤清单 + 关键动作 + 避坑点」，存成知识卡或 skill，下次直接调用。</li>\n<li><strong>贴合你的知识库</strong>：你已经有「喂内容→出四问卡」的管道，再往前一步就是「出 skill」——同一段素材，既存知识、又沉淀方法。</li>\n<li><strong>给元宝用</strong>：我本身支持 Skill 系统，你给我一段视频/系列资料，我可蒸馏成一个可复用 skill（如「X 起号 skill」），以后一句话触发。</li>\n</ul>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li><strong>知识库（强相关）</strong>：知识库的「喂内容→四问卡」本质是轻量蒸馏；本条把它升级成「蒸馏→Skill」，从「记下来」进化到「能复用」。</li>\n<li><strong>元宝变现意图（强相关）</strong>：把蒸馏出的 skill 当「低成本虚拟员工的能力模块」——接单帮别人把资料变 SOP、卖 skill 模板。</li>\n<li><strong>每日 AI 简报</strong>：可加「今日可蒸馏素材」栏目，标记值得抽成 skill 的爆款。</li>\n<li><strong>一人公司</strong>：蒸馏是把「信息差」变成「可执行资产」的核心动作，正合你「零成本、可验证」的路线。</li>\n</ul>\n<h2>③ 能不能挣钱</h2>\n<ul>\n<li><strong>路径 A</strong>：卖「蒸馏服务」——帮小白/商家把他们的爆款资料抽成 SOP，按次收费，成本≈0。</li>\n<li><strong>路径 B</strong>：卖「skill 模板」——起号、带货、剪视频等常见场景的通用 skill，挂小报童/知识星球。</li>\n<li><strong>路径 C</strong>：教「蒸馏方法」——做成短视频/图文「如何把视频变印钞机」，吃认知差流量。</li>\n<li><strong>路径 D</strong>：知识库 + skill 组合包——你的知识库浏览器 + 红线检查器 + 蒸馏 skill，打包成「一人公司工具箱」卖。</li>\n<li><strong>结论</strong>：变现潜力高，启动成本≈0，且与你已有资产（知识库、工具、简报）直接复用。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li><strong>做「视频→知识卡」自动蒸馏器</strong>：输入抖音/小红书链接，自动出四问卡 + 可选 skill，直接进知识库——把本条方法产品化，当引流钩子。</li>\n<li><strong>把本条本身蒸馏成一个 skill</strong>：「如何把视频蒸馏成 skill」的标准流程，存进我的技能库，以后你丢视频我自动走流程。</li>\n<li><strong>知识库升级「Skill 仓库」分区</strong>：卡片之外新增可复用方法库，让知识库从「笔记本」变「工具箱」。</li>\n</ul>\n<blockquote>\n<p>⚠️ 本条仅据标题+描述生成，无逐字稿。你若把视频文案/字幕贴给我，我可补全「蒸馏的具体操作步骤 + 仓颉.Skill 的用法 + 起号 skill 的真实结构」，卡更扎实，也能直接蒸馏成可用的 skill。</p>\n</blockquote>"}, {"title": "抖音文案提取指引（工具卡）", "source": "", "date": "", "category": "技术与工具", "tags": [], "relevance": "中", "monetize": "低（它是「喂料流程」的一环，不是独立变现点）", "core": "", "body_html": "<h2>为什么需要这张卡</h2>\n<p>实测结论：直接抓抖音短链（<code>v.douyin.com/xxx</code>），WebFetch 只能拿到<strong>标题+封面</strong>，拿不到口播文案/字幕。所以「喂内容」时，若想要<strong>逐字稿/手法细节</strong>，需你侧先提取文案再给我。</p>\n<blockquote>\n<p>你贴的「分享文本」本身已含标题+话题+简介摘要，够出卡；本卡解决的是「要更深一层」的情况。</p>\n</blockquote>\n<h2>四种提取方式（按推荐度）</h2>\n<h3>方式 A：轻抖小程序（最推荐，10 秒）</h3>\n<ol>\n<li>抖音 App 打开目标视频 → 点「分享」→「复制链接」</li>\n<li>微信搜「轻抖」小程序 → 粘贴链接 → 一键提取「视频文案」</li>\n<li>复制文案，粘贴到聊天，或存成 <code>.txt</code> 丢进 <code>knowledge-base/_inbox/</code></li>\n<li>优点：拿到的就是口播逐字稿，最贴近视频原话</li>\n</ol>\n<h3>方式 B：抖音内置「复制链接」带简介</h3>\n<ul>\n<li>部分视频点分享→复制链接，剪贴板会带一段简介文案（非逐字稿，但含作者原话摘要）</li>\n<li>直接粘贴给我即可，适合快速出卡</li>\n</ul>\n<h3>方式 C：创作服务平台导出字幕（电脑端）</h3>\n<ul>\n<li>登录 https://creator.douyin.com → 内容管理 → 对应视频 → 字幕/脚本导出</li>\n<li>仅限<strong>你自己发的视频</strong>，他人视频不可用</li>\n</ul>\n<h3>方式 D：下载视频给我本地读（多模态）</h3>\n<ul>\n<li>你用抖音 App「保存至相册」下载视频（注意作者是否允许）</li>\n<li>把 <code>.mp4</code> 丢进 <code>_inbox/</code>，我可读画面/字幕（需视频文件不大）</li>\n<li>适合没字幕轨道、只能靠听/看的场景</li>\n</ul>\n<h2>① 怎么用（落到知识库流程）</h2>\n<ul>\n<li>普通卡：直接贴分享文本，我按四问出卡</li>\n<li>深卡（要手法/逐字）：走方式 A 提文案 → 丢 <code>_inbox/</code> → 我蒸馏成扎实卡，甚至产出 skill</li>\n<li><code>_inbox/</code> 里的 <code>.txt/.md</code> 我会批量读、自动归类</li>\n</ul>\n<h2>② 和之前项目的关系</h2>\n<ul>\n<li>知识库喂料管道的标准补丁：把「链接→标题」升级成「链接→口播稿」</li>\n<li>每日 AI 简报：可作为「素材采集」环节，批量提取爆款文案做选题库</li>\n<li>视频蒸馏 skill：提取的文案正是「蒸馏成 skill」的原材料</li>\n</ul>\n<h2>③ 能不能挣钱</h2>\n<ul>\n<li>本身不直接变现；但「批量提取+改写+二创」是短视频搬运/混剪账号的标配，可作为一人公司内容流水线的第一步（注意版权合规）</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>把方式 A-D 封装成一个「抖音喂料助手」网页，输入链接输出可粘贴文案，当引流钩子</li>\n<li>结合「视频→知识卡自动蒸馏器」灵感，形成「提取→蒸馏→出卡」全自动链路</li>\n</ul>\n<h2>⚠️ 合规提醒</h2>\n<ul>\n<li>只提取<strong>你自己发布</strong>或<strong>明确允许 reuse</strong> 的内容</li>\n<li>他人原创口播稿二次发布/商用需授权，避免侵权踩坑（呼应红线检查器）</li>\n</ul>"}];

function render(){

 });

 });
