3 问逼本质</h2>\n<ul>\n<li><strong>思维模型</strong>：劳动力套利模型（用价差赚钱，无技术壁垒）；海绵杠杆模型（1 个高薪 IT 岗带动约 4 个服务业岗，下行时 1 个白领倒下 4 个家庭返贫）；捷径 vs 深耕模型（赚容易钱→不愿啃硬骨头→被降维打击）；算法主权模型（西方企业用 AI 收回业务\"服务回流\"，不再是\"人换人\"而是\"算法对人力中间商\"）。</li>\n<li><strong>争议地图</strong>：印度人骂西方\"数字新殖民主义\"（用印度人的数据养大模型再砸印度人饭碗）有情绪成分，但本质不是阴谋是<strong>经济逻辑</strong>——AI 让初级编码/工单边际成本趋近于零，套利利差消失是自然结果；中国能突围不是因为\"更聪明\"，而是被封锁逼出体系化能力（华为/小米/芯片供应链）。</li>\n<li><strong>真懂检测器</strong>：① 印度 IT 护城河为什么浅？② \"海绵杠杆\"下行怎么放大萧条？③ 为什么\"节俭式创新/小聪明\"到高端就失灵？④ 算法主权 vs 人力外包差在哪？⑤ 对一人公司，哪些是\"容易被 AI 替代的赚容易钱\"模式？</li>\n</ul>\n<h2>① 怎么用（对我）</h2>\n<ol>\n<li><strong>自检副业模式</strong>：你现在的副业有没有\"靠廉价人力/信息差搬运赚容易钱\"的成分？有→这就是 AI 优先抢的。要往\"判断/整合/本地关系/复杂交付\"挪。</li>\n<li><strong>建深耕型护城河</strong>：别只做\"搬运/代做\"表层活，把某一块做到体系化（如你的知识库四问卡蒸馏法 = 把\"看视频学东西\"做成可复用方法论，AI 替不了你的判断与框架）。</li>\n<li><strong>警惕\"捷径文化\"</strong>：印度教训是\"小聪明太多、深耕不够\"。你做一人公司要沉下心把交付/复购/口碑做厚，别追风口表面。</li>\n<li>存知识块：\"易被 AI 替代的 3 类副业\"= 纯代写/纯搬运信息差/低阶编码外包；\"深耕护城河清单\"。</li>\n</ol>\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li><strong>一人公司方向</strong>：直接印证\"零成本启动也要有真壁垒\"——你靠元宝当虚拟员工放大产能，但核心价值在你的选题/判断/人味，不是单纯代劳。</li>\n<li><strong>副业红线 / 反洗钱卡</strong>：同属\"避开坑\"系列——印度是被宏观趋势清算，个人是被合规/替代清算。</li>\n<li><strong>车企消费者测试员卡</strong>：同属\"行业真相\"系列，都是\"表面光鲜、底层有债\"的解构视角。</li>\n<li><strong>每日简报</strong>：宏观经济+AI 就业冲击是常驻选题（信息差/财经向）。</li>\n</ul>\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li>结论：潜力<strong>中</strong>，但方向是\"避坑+定位\"而非直接印钞。</li>\n<li><strong>反向红利</strong>：做\"AI 时代哪些副业会被替代/哪些更安全\"内容（测评/清单/星球选题），有流量且稀缺视角。</li>\n<li><strong>正向定位</strong>：把\"深耕型一人公司作战地图\"做成你的差异化物（对比印度式捷径），对标你库里\"一人公司搞钱框架\"总卡。</li>\n<li>警惕：别做\"印度崩溃\"式情绪流量号，走\"趋势+对普通人的可操作启示\"才立得住。</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>做\"副业抗 AI 替代力\"自测 mini-app：输入副业→输出\"易被替代/较安全\"评级 + 加固建议。</li>\n<li>内容：把\"印度 IT 教训\"浓缩成\"一人公司 3 条护城河\"短文，发简报/星球。</li>\n<li>串联：与\"车企测试员\"\"反洗钱\"合成\"行业真相+避坑\"总卡，作你副业作战地图的\"风险页\"。</li>\n</ul>\n<blockquote>\n<p>由 video-distill 一键流水线生成 · 抖音 @真财实学计划</p>\n</blockquote>"}, {"title": "2026-08-11-日本经济低迷根源动荡时代", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<p>title: 卡38 · 日本经济低迷根源《动荡时代》：泡沫→资产负债表衰退→印钞机失效，白川方明 3 条避坑\ndate: 2026-08-11\ncategory: 行业与趋势\ntags: [日本经济, 动荡时代, 白川方明, 资产负债表衰退, 量化宽松, 人口炸弹, 结构性改革, 时代避坑, 不加杠杆]\n项目关联度: 高\n变现潜力: 中\nsource: 抖音《深挖日本经济长期低迷的根源·提纯&lt;动荡时代&gt;底层逻辑》@成长书库 · https://v.douyin.com/P9g95Awz4AQ/</p>\n<hr />\n<h2>一句话核心</h2>\n<p>日本\"失去的三十年\"不是单一政策失误，而是一条<strong>连锁反应链</strong>：超级泡沫（极端乐观预期 + 失控信贷\"越涨越借越借越涨\"死亡循环 + 监管瘫痪 + 低利率添柴）→ 破裂后陷入<strong>资产负债表衰退</strong>（资产脚踝斩但债务不变，企业从\"利润最大化\"被迫切到\"债务最小化\"，银行惜贷，企业/居民/银行三方同时踩刹车）→ <strong>印钞机失效</strong>（债务黑洞 + 劳动年龄人口见顶的\"人口炸弹\"）→ 被迫搞量化宽松（央行直接买股票/中小企业债）。白川方明给普通人的 3 条避坑：<strong>货币政策不是神药 / 别拿大水漫灌替代结构性改革 / 防系统性崩溃＞盲目刺激增长</strong>——对你，就是<strong>不盲目加杠杆、做真壁垒、守住现金流活下去</strong>。</p>\n<h3>麻省理工3问逼本质</h3>\n<ul>\n<li><strong>思维模型</strong>：</li>\n<li>顺周期效应 / 死亡循环（地价涨→抵押值钱→银行多贷→再买→再涨，弹性被无限放大）；</li>\n<li>资产负债表衰退（资产可一夜脚踝斩，债务连本带息一分不少→企业从进取切防御、拼命还债不投资）；</li>\n<li>三方刹车模型（企业还债 + 居民存钱 + 银行惜贷，经济引擎同时熄火）；</li>\n<li>人口炸弹模型（劳动年龄人口见顶→年轻人少、银发多→需求端断崖式自然萎缩，降息也唤不醒不消费的市场）；</li>\n<li>止痛药 vs 外科手术模型（放水=止痛药，短期回光返照但掩盖真病灶，把重感冒拖成绝症）；</li>\n<li>印钞机边界模型（印钞机印得出纸币，印不出年轻劳动力、印不出硬核技术、逆转不了老龄化）。</li>\n<li><strong>争议地图</strong>：西方经济学家把日本停滞全怪\"降息太慢/放水不够\"——白川反驳这是<strong>掩盖人口动态真相</strong>；\"失去的二十年\"悲情标签掩盖了结构性减速本质；量化宽松/时间轴政策后来被全球照抄成危机标准动作（印证非常规工具有效但治标）。</li>\n<li><strong>真懂检测器</strong>：① 泡沫两大核心成分（狂热情绪 + 失控信贷）？② 资产负债表衰退是什么、为何降息到 0 也没人借？③ 央行为何越过商行直接买股票/中小企业债？④ \"人口炸弹\"怎么让所有金融刺激失效？⑤ 白川 3 条避坑各指什么？⑥ 翻译到你副业：不加杠杆/做真壁垒/守住现金流各对应哪条？</li>\n</ul>\n<h3>① 怎么用（对我）</h3>\n<ol>\n<li><strong>不盲目加杠杆</strong>：个人/副业不借消费贷买房炒股、不借债扩张。债务最小化思维——对应你\"不借消费贷买自我提升\"（专升本骗局卡同源）。</li>\n<li><strong>做真壁垒，不靠\"止痛药\"续命</strong>：副业靠深耕体系能力（对标印度 IT 护城河卡），不靠\"画幻觉/速成/外部风口\"吊着。把每一次交付当\"外科手术\"而非\"打止痛针\"。</li>\n<li><strong>守住底线活下去</strong>：经济换挡期\"不生病、不猝死、保住命脉，安稳活下去就是最大胜利\"→ 副业先求稳现金流，不赌单一爆款、不 all-in 一个渠道。</li>\n<li><strong>看准需求结构</strong>：人口结构变化=年轻人少、银发多→选需求真实存在的赛道（银发经济/刚需服务），避开\"需求断崖\"伪风口。</li>\n<li>存知识块：\"资产负债表衰退识别\"（资产跌债不变→防御模式）；\"止痛药 vs 手术\"决策框架；\"三方刹车\"预警信号。</li>\n</ol>\n<h3>② 和你之前项目的关系</h3>\n<ul>\n<li><strong>印度 IT 护城河 / 车企测试员 / 反洗钱 / 专升本骗局</strong>：同属\"看清结构、守住底线\"主线（时代避坑系列），可合流成<strong>副业作战地图·风险页</strong>。</li>\n<li><strong>短视频独立思考卡</strong>：同属独立判断——不被\"暴富神话/速成/放水救一切\"带节奏。</li>\n<li><strong>一人公司方向</strong>：印证\"零成本启动也要真壁垒 + 稳现金流\"，经济降速期\"抗周期副业\"比追风口更稳。</li>\n<li><strong>每日简报</strong>：宏观经济 + 人口结构 + 政策误判是常驻选题（财经/冷知识角度）。</li>\n</ul>\n<h3>③ 能不能帮你挣钱</h3>\n<ul>\n<li>结论：潜力<strong>中</strong>。两条方向：① 内容——\"日本失去三十年给普通人的避坑指南\"是强共鸣选题（经济焦虑流量），可做测评/清单/星球选题；② 反向定位——经济降速期做\"抗周期副业\"（刚需/低成本/真交付）比追风口更稳，银发经济是结构机会。反向提醒：别做\"崩溃论\"情绪号，走\"清醒认知 + 可操作\"。</li>\n</ul>\n<h3>④ 灵感延伸</h3>\n<ul>\n<li>做\"经济周期下的副业抗风险\"自测 mini-app：输入副业→输出抗周期评级 + 杠杆红线 + 现金流建议。</li>\n<li>内容：把白川 3 条避坑翻译成\"一人公司 3 条底线\"（不加杠杆 / 做真壁垒 / 守住现金流），发简报/星球。</li>\n<li>串联：与印度/车企/反洗钱/专升本合成<strong>\"时代避坑 + 副业风险页\"</strong>总卡（副业作战地图风险页）。</li>\n</ul>\n<blockquote>\n<p>卡片：categories/行业与趋势/2026-08-11-日本经济低迷根源动荡时代.md | 拆解页：日本经济低迷根源动荡时代-拆解.html | 由 video-distill 一键生成</p>\n</blockquote>"}, {"title": "2025买车全攻略：价格战下立省两万的实操框架", "source": "B站 @三区兄弟《【万字干货】25年买车你所需知道的一切！看完立省两万！价格战下，下半年可以买车了么？》｜约35′｜全文15000字｜https://www.bilibili.com/video/BV1N472zAE3E/", "date": "", "category": "行业与趋势", "tags": [], "relevance": "中（消费决策，自己买车能用；与卡30\"车企测试员\"组成\"买车决策\"组合）", "monetize": "低-中（\"买车避坑/立省两万\"是高互动引流内容，可做轻量产品）", "core": "", "body_html": "<h2>怎么用（核心内容）</h2>\n<p><strong>一句话</strong>：价格战下买车 = 既要会砍价省钱、也要避开\"被当测试员 / 被背刺 / 被4S店套路\"的坑；博主三区兄弟给的是选车→预算→砍价→提车一条龙实操框架，燃油车新能源通用。</p>\n<p><strong>① 选车（先懂基本盘）</strong>\n- 车型：轿车（低重心操控好/省油）vs SUV（空间大/家用）vs MPV（6-7座商务，20万+）；级别 A00→D 级，<strong>轴距是核心参数</strong>（轴距越大空间越大），A00最便宜2万出头、A级(秦PLUS)10万内、B级(凯美瑞)10-30万、C级30-50万、D级50万+。\n- 动力：纯电/增程/混动/燃油。增程原理——发动机不当驱动轮、只当发电机，让发动机<strong>一直维持最佳热效率区间</strong>反而比燃油车省油（被喷\"落后技术\"是误解，大车才显费油是刻板印象）；混动发动机电机均可直驱更灵活；换电(蔚来)适合无车位一线城市。\n- <strong>选畅销车不买小众</strong>：销量大=参考样本多=车主帮你提前排雷+保值率坚挺(二手商好出手)+维修便宜；小众车即便有暗病也难短时间反馈，且品牌倒闭后权益/升级/售后全无。</p>\n<p><strong>② 预算（车是负债不是资产）</strong>\n- 富爸爸穷爸爸里车是负债，持续吃现金流（贬值+油费+保险+停车+维修）。\n- 稳妥线：用<strong>年结余的1-2倍</strong>买车；月薪3000不买、5000左右10万内(7万更保险)、1万左右12-18万。\n- 25年特殊建议：<strong>非刚需多等等</strong>——价格战越等越便宜配置越好；但新能源易遭背刺（频繁改款降价，去年某品牌一年三代）。</p>\n<p><strong>③ 不贷款上杠杆（第一大坑）</strong>\n- 没全款能力就别买；买车钱≤现有存款60%、≤年薪1.5倍；月供+房贷+房租+信用卡≤月收入50%。\n- 贷款只是拿优惠手段（5年6期，通常12/24期后一次结清尾款优惠最大），<strong>尾款存定期</strong>确保结清时掏得出（防消费主义花光交不上尾款）。</p>\n<p><strong>④ 砍价（只花5笔费用）</strong>\n- 合法费用仅5笔：车价/购置税/上牌费/保险费/车船税，<strong>其他4S店附加都可不交</strong>。\n- 不低开发票（每便宜1万省1130购置税，但车估值低+保险按发票赔少+本身违法偷税）。\n- 上牌自己125-225元，4S店收1000+是坑；保险只买三者+车损（大城市三者上300万），交强险950。\n- 砍价法：语气温和、设最高/最低理想价；<strong>拿其他店配置单</strong>当筹码；赠品优先换现金优惠、不轻信口头承诺落合同；报价软件查地区底价（代价是接销售电话）。</p>\n<p><strong>⑤ 提车验车（带1000现金+手电筒）</strong>\n- 漆面（手电筒不同角度看划痕/起泡）、玻璃&amp;大灯生产日期（应早于整车）、轮胎（看胎毛/生产周数/钥匙刮痕能否复原，防翻新胎）、油液、门窗密封、整车生产日期(&gt;6个月算库存车)、公里数&lt;100。\n- 单据核对车架号：<strong>合格证/关单最重要</strong>（4S店常抵押银行换流动资金，没了上不了牌）。</p>\n<p><strong>⑥ 时间点</strong>\n- 便宜：暑假(天热没人看)、年底12月(冲销量)；贵：春节前1-2月、金九(国庆前)。</p>\n<h2>麻省理工3问逼本质</h2>\n<ul>\n<li><strong>思维模型</strong>：车是负债模型（持续消耗现金流非资产）；畅销车样本模型（销量大=排雷样本多+保值+维修便宜）；价格战博弈模型（越等越便宜但新能源背刺）；5笔费用边界模型（其他都是信息差溢价）；低开发票双输模型（省小钱亏大钱+违法）。</li>\n<li><strong>争议地图</strong>：增程\"落后技术\"被喷但热效率逻辑成立（大车才显费油是刻板印象）；\"非刚需多等等\"是25年价格战特殊建议非常态；直营新能源少套路，但燃油合资4S店仍有倒闭风险（去年超4400家退网）。</li>\n<li><strong>真懂检测器</strong>：①车为何是负债？②增程为何比油车省油？③不贷款上杠杆红线(存款60%/年薪1.5倍/月供50%)？④只花哪5笔费用？⑤为何不低开发票？⑥提车验车最关键3项？⑦与卡30\"测试员\"怎么呼应（选畅销车=提前排雷/不买小众=避品牌倒闭/租车深度体验=破试驾精心挑选）？</li>\n</ul>\n<h2>和之前项目的关系</h2>\n<ul>\n<li><strong>卡30 车企把消费者当测试员</strong>：本卡是它的\"消费者应对手册\"——选畅销车(样本多提前排雷)对应卡30\"看不到测试数据只能看参数\"；不买小众(品牌倒闭售后是坑)对应卡30\"申报车型过多/开发周期短\"；租车深度体验对应卡30\"试驾线路被精心挑选\"；新能源易背刺对应卡30\"上午提车下午变老款\"。两张合成\"买车决策\"组合。</li>\n<li><strong>日本经济《动荡时代》</strong>：同\"防崩溃&gt;盲目增长/不杠杆\"——不贷款上杠杆买车 = 白川\"别用放水替改革\"的个人版（守住现金流）。</li>\n<li><strong>冯道小人哲学</strong>：4S店话术(赠品虚高/营造急促感/回避砍价)是\"关系本质是交易/识人看正反馈\"的消费场景——拿配置单破\"信息差\"。</li>\n<li><strong>信息差主线</strong>：普通人买车信息差=看不到真实成交价/测试数据，本卡补\"查地区底价+看真实车主小视频/论坛\"动作。</li>\n</ul>\n<h2>能不能挣钱</h2>\n<ul>\n<li>直接：不赚钱（消费攻略）。</li>\n<li>间接：高互动引流内容（\"买车避坑/立省两万\"共鸣强）；可延伸\"买车避坑清单\"轻量产品/星球选题；与卡30合成\"买车决策\"系列做内容矩阵。</li>\n<li>路径：内容引流(中)，不直接变现(低)。</li>\n</ul>\n<h2>灵感延伸</h2>\n<ol>\n<li><strong>合成\"买车决策\"总卡</strong>：卡30(避坑警示)+卡40(实操攻略)→普通人购车决策框架（选车/预算/砍价/验车/避坑）。</li>\n<li><strong>做\"买车避坑清单\"mini内容/信息图</strong>：5笔费用/验车10项/不杠杆3红线/时间点。</li>\n<li><strong>内容</strong>：把\"价格战下该不该买\"做成简报/星球选题（结合卡30行业真相）。</li>\n<li><strong>与\"副业作战地图风险页\"联动</strong>：消费决策也是\"守住底线\"一环（不杠杆=现金流安全）。</li>\n</ol>\n<hr />\n<ul>\n<li>蒸馏模型：麻省理工 AI 学习法（3 神级问题）+ 四问卡</li>\n<li>自动化：本卡由 <code>video-distill</code> skill 一键流水线生成（B站原生下载，无需 cookies）</li>\n</ul>"}, {"title": "卡49 · 经济一差，到处都是诈骗：镰刀/暗礁/舆论战的三层真相", "source": "", "date": "", "category": "", "tags": [], "relevance": "", "monetize": "", "core": "", "body_html": "<blockquote>\n<p>来源：付费文《经济一差，到处都是诈骗》｜达叔一（公众号：胖虎玩软件，2023-08-25，9页）\n日期：2026-08-16 ｜ 一级分类：行业与趋势 ｜ 标签：#反诈 #经济下行期 #镰刀收割 #糖衣美色模式 #AI诈骗 #字幕组博彩 #晋江假药 #差序格局 #警惕愤怒 #定向收割 #舆论战\n项目关联度：高 ｜ 变现潜力：中</p>\n</blockquote>\n<h2>一句话核心</h2>\n<p>经济一差=镰刀加速转——<strong>镰刀有两种（糖衣模式/美色模式）</strong>，距离钱越近的技术（语音模拟/AI换脸/色情直播）越先被用；底层逻辑是<strong>差序格局+没高级产业=黄赌毒被安排</strong>（晋江假药案=乡镇干部带头）；最可怕是<strong>让你愤怒也是定向收割</strong>（关东军从\"保护侨民舆论\"到出兵），警惕自己的愤怒才是终极反诈。</p>\n<h2>麻省理工3问</h2>\n<ul>\n<li><strong>思维模型</strong>：故事&gt;道理(记忆规律) / 镰刀二形态(糖衣·美色) / 距离钱近的技术先用 / 技术中性用人决定方向 / 差序格局(地缘血缘) / 没高级产业=野蛮方案 / 愤怒可被定向制造</li>\n<li><strong>争议地图</strong>：反诈科普vs深度社会批判(本卡)/ \"人是坏人么\"不是，是老实程序员(技术中性)/ \"能让你愤怒也是定向收割\"——这话本身是否也在收割？</li>\n<li><strong>真懂检测器</strong>：①你开始赚钱后遇到几种镰刀？②懂3套房不能动原则吗？③AI时代如何防语音/视频模拟？④晋江假药案你听过吗？⑤你对《孤注一掷》愤怒时警惕了吗？⑥与卡32/37/45/44/48/47/41怎么互证？</li>\n</ul>\n<h2>三大层真相（达叔的三层递进）</h2>\n<h3>第一层：镰刀加速转——对赚钱人的告诫</h3>\n<ul>\n<li>一旦开始赚钱，就有很多人拎着镰刀，要来割你的头、割你的腰子</li>\n<li><strong>镰刀两种</strong>：①糖衣模式 ②美色模式</li>\n<li><strong>达叔给被投创业者的最后一条告诫：要防诈骗</strong></li>\n<li><strong>3 套房不能动原则</strong>：先在熟悉主业赚到 3 套房（给父母、老婆、孩子各一套，是不能动的资产），剩下钱再冒险</li>\n<li><strong>铁律</strong>：要专注主业，不要进入自己不懂的领域，不要轻易扩大规模，轻易不要借钱</li>\n</ul>\n<h3>第二层：技术镰刀+心理学暗礁</h3>\n<ul>\n<li>案例：大 V 自己开公司，被\"朋友\"借 20 万；电话/微信语音/视频全验证 → <strong>语音模拟技术听不出来</strong></li>\n<li>世界上最尖端技术三大去向：①军事（杀人）②医疗生物（救人）③<strong>金融/诈骗（收割钱）</strong></li>\n<li><strong>距离钱越近，越能提高效率的技术，越会得到应用</strong>——AI 在色情和诈骗上的应用，肯定比正事早（色情直播转型的案例：原电子邮箱/垃圾邮件公司 → 中东拉美色情直播 → 赚疯）</li>\n<li>\"人是坏人么？不是，很老实的程序员\"——技术中性，被谁用决定方向</li>\n<li><strong>心理学暗礁</strong>：有人天然被危险吸引（被家暴男/赌博男打死仍不离开，离开再找同类）；\"理解不了，就不要理解，记住有这样人的人，躲远点，就可以了\"</li>\n<li><strong>赌徒的父母</strong>：爹给没毕业孩子买 800 万房+豪车 → 赌博欠钱被追上门没解；妈只会哇哇哭</li>\n<li>\"你对孩子狠不起来犯了错不多给教训，就只能由社会上的其他人对他狠，多给一些教训了\"</li>\n</ul>\n<h3>第三层：诈骗的社会经济根源（最尖锐）</h3>\n<ul>\n<li><strong>差序格局逻辑</strong>：人情社会，一个人搞诈骗赚到钱，可能带领一堆人去搞诈骗</li>\n<li>字幕组与博彩广告：下载电影看到的博彩广告（几千块一条被字幕组租植入），字幕组被端是因为<strong>协助诈骗</strong>而非小电影</li>\n<li>影视扫黄扫毒扫诈骗为什么都是广东福建？——<strong>地缘+血缘</strong>（海外华人华侨后代；改开四大特区深圳珠海汕头厦门即三粤一闽，吸引华侨钱）</li>\n<li><strong>晋江假药案（1985）</strong>：工厂创办人不是骗子不是边缘人，<strong>是乡镇干部</strong>；吴晓波问\"你知道在造假药么\"，对方说\"知道，要解决就业、要吃饭、要摆脱贫困\"</li>\n<li><strong>野蛮方案</strong>：要解决就业+吃饭+摆脱贫困+发展经济 → 黄赌毒出来（\"野蛮洗白\"参考：欧美奴隶贸易/印第安人洗劫/华工屠杀/淘金热）</li>\n<li><strong>今天的晋江</strong>：有钱/鞋子/运动品牌/豪门联姻/嫁女儿全身黄金 → 没人记得乡镇干部带头假药案</li>\n<li><strong>核心结论</strong>：<strong>如果有更高级的产业，他们也不会干脏的产业。问题是，没有 → 黄赌毒是被安排上的</strong></li>\n<li><strong>能把警察等机构一起牵扯进去的 = 系统性暴力 + 内部共识</strong></li>\n</ul>\n<h3>最可怕第四层：让你愤怒也是定向收割</h3>\n<ul>\n<li>看《孤注一掷》小女儿问女警为什么不抓 → 愤怒？恨不能自己拎枪过去</li>\n<li><strong>达叔对愤怒产生警惕</strong>：因为 100 年前关东军挑起事 = 日本内部舆论造成\"日本人被欺负\"错觉 → 没执法权就得保护侨民 → 关东军出手</li>\n<li>我们不是关东军，但我们很强大。东南亚、尤其是缅甸的操盘手看到这样的电影，心里慌不慌？</li>\n<li>类似的电影偶尔搞一个（《湄公河行动》2016）没问题，但<strong>每年多来几个，慢慢舆论就变了，就不仅仅是反诈了</strong></li>\n<li><strong>能让你愤怒，也是一种定向收割的方式</strong></li>\n<li><strong>要警惕自己的愤怒</strong></li>\n</ul>\n<h2>① 怎么用</h2>\n<ul>\n<li>任何副业/一人公司赚到第一笔钱前，先设\"3 套房不能动原则\"作为资产底层</li>\n<li>拒绝任何\"糖衣模式/美色模式\"镰刀邀请（高息/暧昧/熟人借钱/快速扩大）</li>\n<li>AI 时代防诈骗：电话/微信语音/微信通话/视频都不够——必须二次独立验证（见面+签字）</li>\n<li>内容创作：记不住道理只能记住故事——任何反诈/认知科普都用故事而非说教</li>\n<li>看到让你愤怒的内容（反诈/爱国/公平/不平）→ 警惕自己的愤怒，先问\"谁想让我愤怒\"</li>\n<li>对\"老实程序员转型色情直播赚疯\"类的故事：技术中性论——自己不碰灰色，技术能力才不被污染</li>\n</ul>\n<h2>② 和你之前项目的关系</h2>\n<ul>\n<li>卡32 反洗钱：同反诈，本卡\"AI 镰刀+差序格局\"是更深的成因</li>\n<li>卡37 专升本骗局：同反诈，本卡\"心理暗礁+愤怒收割\"是更广的延伸</li>\n<li>卡45 亏钱指南：同不踩坑，本卡\"镰刀二模式+3 套房原则\"是更具体的护城河</li>\n<li>卡44 赚钱心法：同警惕主流/收割文，本卡直接列出收割手法</li>\n<li>卡48 赚钱的隐秘法则：同\"经济下行/人性\"，本卡\"差序格局+没高级产业=黄赌毒被安排\"是社会版</li>\n<li>卡47 察言观色：同识人，本卡\"理解不了就躲远点\"是察言观色的反面操作</li>\n<li>卡41 世界运行规律：同\"不懂规律被收割\"，本卡\"镰刀加速转\"是规律应用</li>\n<li>卡39 冯道：同识人自保，本卡\"3 套房不能动原则\"是护身术</li>\n</ul>\n<h2>③ 能不能帮你挣钱</h2>\n<ul>\n<li>直接不赚钱（认知/反诈）</li>\n<li>间接：高共鸣选题(公众号/星球/短视频，高)/反诈付费课程素材(中高)/内容创作\"故事&gt;道理\"方法论(中)</li>\n<li>综合潜力：中</li>\n</ul>\n<h2>④ 灵感延伸</h2>\n<ul>\n<li>写一篇公众号《警惕你的愤怒》（呼应最尖锐观点）</li>\n<li>做\"反诈 4 层金字塔\"速记卡（镰刀/技术/根源/舆论）</li>\n<li>内容化：3 套房不能动原则+AI 镰刀+差序格局→系列化</li>\n<li>与卡32/37 合成「反诈三层：识别/技术/根源」</li>\n<li>给底层知识库补一条\"警惕自己的愤怒\"候选（待用户认可）</li>\n</ul>"}];
var CATS=["AI与方法", "个人成长", "创业与变现", "技术与工具", "行业与趋势"];
var TAGS=["AI学习", "AI工作台", "AI工作流", "AI短剧", "AI视频", "AI设计", "Codex", "GitHub", "Obsidian", "PARA", "Skill", "不被大厂收割", "个人成长", "体验经济", "信息差", "内容创作", "创意", "副业", "副业观察", "变现避坑", "叙事钩子", "合规红线", "复现", "姜胡说", "学习方法实跑", "工作流", "工具淘金", "平替", "开源", "心理代偿", "捞偏门", "文案", "旅行安全", "日本", "本地优先", "电商设计", "痒点", "知识库", "知识管理", "社会趋势", "第三空间", "营销", "营销心理学", "认知", "记忆飞轮", "豆包", "踩坑警示", "销售话术", "零基础", "黑灰产揭秘"];
var curCat="全部",curTags=[],q="";
function badge(t,label){if(!t)return"";var c=t==="高"?"b-high":(t==="中"?"b-mid":"b-low");return'<span class="badge '+c+'">'+label+t+'</span>';}
function renderFilters(){
 var cf=document.getElementById("catFilters");cf.innerHTML="";
 ["全部"].concat(CATS).forEach(function(c){var d=document.createElement("div");d.className="chip"+(c===curCat?" on":"");d.textContent=c;d.onclick=function(){curCat=c;renderFilters();render();};cf.appendChild(d);});
 var tf=document.getElementById("tagFilters");tf.innerHTML="";
 TAGS.forEach(function(t){var on=curTags.indexOf(t)>=0;var d=document.createElement("div");d.className="chip"+(on?" on":"");d.textContent="#"+t;d.onclick=function(){if(on){curTags=curTags.filter(function(x){return x!==t;});}else{curTags.push(t);}renderFilters();render();};tf.appendChild(d);});
}
function render(){
 var box=document.getElementById("list");box.innerHTML="";
 var list=ENTRIES.filter(function(e){
  if(curCat!=="全部"&&e.category!==curCat)return false;
  if(curTags.length&&!curTags.every(function(t){return e.tags.indexOf(t)>=0;}))return false;
  if(q){var s=(e.title+e.core+e.body_html+e.tags.join("")).toLowerCase();if(s.indexOf(q.toLowerCase())<0)return false;}
  return true;
 });
 if(!list.length){box.innerHTML='<div class="empty">没有匹配的内容</div>';return;}
 list.forEach(function(e){
  var card=document.createElement("div");card.className="card";
  var tags=e.tags.map(function(t){return '<span class="tag">#'+t+'</span>';}).join("");
  card.innerHTML='<div class="ct">'+e.title+'</div>'+
   '<div class="meta"><span>'+e.date+'</span><span>'+e.category+'</span>'+badge(e.relevance,"关联")+badge(e.monetize,"变现")+'</div>'+
   (e.core?'<div class="core">'+e.core+'</div>':'')+
   '<div class="body">'+e.body_html+'<div style="margin-top:8px">'+tags+'</div></div>'+
   '<div class="toggle" onclick="tog(this)">展开 ▾</div>';
  box.appendChild(card);
